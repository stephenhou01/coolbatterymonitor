ly means the tank is full. Power use is now {ratio}% of your usual level, so it will drain faster.", "p.model_design_energy": "Design energy for this model", "p.current_full_energy": "This battery when full now", "p.energy_in_battery": "Energy remaining now", "p.current_power": "Current power use", "p.current_use_estimate": "At this usage", "p.baseline_compare": "At this Mac's usual {watts}W, the estimate is about {time}. The shorter figure mainly reflects the current workload.", "p.runtime_audit_tag": "Published benchmark × this Mac", "p.runtime_audit_title": "Why can an official 15 hours become only a few hours now?", "p.audit_official": "Apple new-battery wireless web test", "p.audit_same_load": "This battery at the same light workload", "p.audit_actual": "Actual system runtime now", "p.audit_capacity_note": "Capacity effect: about {hours} hours below new", "p.audit_load_note": "Workload effect: about {hours} more hours lost", "p.audit_cause": "Main cause: current workload", "p.audit_cause_body": "Current power is about {ratio}× the implied average in Apple's wireless-web test. 100% means today's capacity is full, not that the Mac is running the official light workload.", "p.audit_test_config": "Apple test system", "p.audit_your_config": "Your Mac", "p.audit_conditions": "Wireless web: 25 websites over Wi-Fi; display at 8 clicks from bottom and keyboard backlight off.", "p.audit_method": "Method: 53.8Wh ÷ 15h ≈ 3.59W average for the official web test; compare that with this battery's scaled full energy and system power.", "p.help_open": "View definition and formula", "p.help_title": "Where does this metric come from?", "p.help_current": "Current result", "p.help_raw": "Lowest-level input fields", "p.help_formula": "Formula", "p.help_substitution": "Substitute this Mac's values", "p.help_source": "Source and reliability", "p.help_direct": "No formula: read directly from the system field.", "p.help_model_spec": "System model identifier matched to Apple's published specification.", "p.help_derived": "Derived from raw system fields; not a same-named value returned directly by IOKit.", "p.help_close": "Close", "hw.group.runtime": "Runtime and system estimates", "p.hw_group_runtime": "Time remaining, time to full, and the post-wake invalid window", "hw.group.resistance": "Resistance and discharge curve", "p.hw_group_resistance": "Cell resistance and susceptibility to voltage sag at low charge", "hw.m.current_capacity": "System charge percentage", "hw.n.current_capacity": "User-facing 0–100% on Apple Silicon; capacity math should use AppleRawCurrentCapacity.", "hw.m.fcc_comp": "Full-charge capacity compensation copies", "hw.n.fcc_comp": "FccComp1/FccComp2 equal AppleRawMaxCapacity on this Mac and serve as redundant checks.", "hw.m.chemical_ra": "Chemical weighted resistance", "hw.n.chemical_ra": "Zero on this Mac, treated as unavailable and excluded from conclusions.", "hw.m.cell_wom": "Auxiliary cell-health field", "hw.n.cell_wom": "Only two zero entries for a three-cell pack; cardinality mismatch makes it unusable for scoring.", "hw.m.time_remaining": "Gauge time-remaining estimate", "hw.n.time_remaining": "TimeRemaining and AvgTimeToEmpty come directly from the gauge; 65535 means unavailable, not minutes.", "hw.m.time_to_full": "Estimated time to full", "hw.n.time_to_full": "Valid only while charging and ready; 65535 means unavailable or not applicable.", "hw.m.invalid_wake": "Post-wake estimate invalid window", "hw.n.invalid_wake": "Runtime estimates may be unstable for this many seconds after wake.", "hw.m.system_input": "Adapter input power/voltage/current", "hw.m.adapter_efficiency_loss": "Raw adapter-efficiency loss", "hw.n.adapter_efficiency_loss": "Instant values may be zero or negative and cumulative scaling is unknown; do not derive charging efficiency.", "hw.m.accumulated_avg_power": "Telemetry accumulated average power", "hw.n.accumulated_avg_power": "AccumulatedSystemLoad ÷ SystemLoadAccumulatorCount ÷ 1000, useful as this Mac's baseline.", "hw.m.wall_energy": "Raw accumulated wall-energy value", "hw.n.wall_energy": "Unit and scaling are undocumented; preserve only as a raw diagnostic value.", "hw.m.qmax_disqualification": "Qmax disqualification reason code", "hw.n.qmax_disqualification": "Zero is only the current raw code; nonzero may invalidate calibration, while bit meanings remain undocumented.", "hw.m.daily_soc_pair": "Daily maximum/minimum charge", "hw.m.adapter_contract": "Negotiated PD voltage/current", "hw.m.adapter_menu": "Negotiable PD profiles", "hw.n.adapter_menu": "Available only on AC; the highest profile reflects currently advertised negotiation capability.", "hw.m.adapter_description": "Adapter interface type", "hw.m.charge_limits": "Charging voltage/current limits", "hw.m.carrier_mode": "Carrier-mode charge thresholds and status", "hw.n.carrier_mode": "High/Low are carrier thresholds; Status needs system context and is not directly the 80% charge limit.", "hw.m.port_cycles": "Port-controller attach/detach counts", "hw.n.port_cycles": "Array order cannot safely map to left/right ports, so controllers are numbered. Abnormal growth may indicate contact issues.", "hw.m.port_failures": "Port capability mismatch/election failure", "hw.n.port_failures": "Nonzero values can point to cable, adapter, or PD negotiation issues; values are shown per controller.", "hw.m.chem_ids": "Cell chemistry and algorithm chemistry IDs", "hw.m.manufacture_batch": "Raw manufacturing batch integer", "hw.n.manufacture_batch": "The integer decodes to an ASCII batch code, not a verified calendar date.", "hw.m.first_use": "Raw first-use date", "hw.n.first_use": "Zero on this Mac, so true battery age cannot be obtained from it.", "hw.m.installed": "Battery installed/built-in state", "hw.m.temperature": "Measured cell temperature", "hw.m.model_design_energy": "Model-rated design energy", "hw.n.model_design_energy": "Rated Wh matched to Apple's specification after identifying the system model; it is not calculated from current voltage.", "hw.m.current_full_energy": "Current full-charge energy (scaled)", "hw.n.current_full_energy": "Model design Wh × current full-charge capacity ÷ design capacity, keeping one consistent scale for today's full battery.", "p.forecast_only": "The dashed line is a current forecast and is not saved as system history", "p.snapshot": "Snapshot", "p.snapshot_note": "This HTML prototype shows a system snapshot captured when generated; the app will update live", "p.usage_basis": "Reported directly by macOS; this product does not recalculate it from power", "p.system_charge": "macOS charge", "p.priority_health": "Overall battery health", "p.priority_power": "Current computer power use", "p.priority_temp": "Current battery temperature", "p.tagline": "Battery Monitor", "p.remaining": "Time remaining", "p.src_note": "Time remaining reported directly by macOS; this product does not recalculate it from power", "p.why_title": "Why the last 20% drains so fast", "p.why_sub": "Your battery is never “used up” — the voltage collapses first", "p.aha_label": "Aha moment", "p.health_two_title": "Why is health {sys}% while usable capacity is {raw}%?", "p.health_two_body": "<strong>It is like measuring one tank with two rulers.</strong> The system score accounts for the safety reserve; the capacity bar shows what can actually be filled now. Both are useful, but trends need the same ruler.", "p.health_two_formula": "{sys}% system health score · {raw}% direct capacity ratio", "p.loss_split_title": "Total gap {gap} mAh = unreachable + aged", "p.loss_split_body": "<strong>Using the same tank analogy:</strong> {un} mAh is like water below the straw—still there. Only {aged} mAh is the tank itself becoming smaller. Together they make the gap from new.", "p.loss_split_formula": "{gap} mAh total gap = {un} mAh out of reach + {aged} mAh aged", "p.use_loss_title": "Energy used today is not battery ageing", "p.use_loss_body": "<strong>Think of water in a cup versus the size of the cup.</strong> The {used} mAh used this time returns when charged; the {loss} mAh long-term loss is the cup becoming smaller than when new.", "p.use_loss_formula": "Used this time {used} mAh · long-term loss {loss} mAh · do not add them", "p.aging_judge_title": "Do not judge ageing from cycle count alone", "p.aging_judge_lead": "Cycle count is an odometer: it shows use, not health by itself.", "p.aging_judge_body": "What matters together is whether full-charge capacity keeps falling, resistance rises, cells drift apart, and high temperature becomes common. Those trends explain a real runtime decline.", "p.aging_proof": "This Mac has {cyc} cycles; current full-charge capacity is {loss} below design. The {per}-per-cycle figure is only a retrospective average—not measured loss per cycle and not a life forecast.", "p.time_jump_title": "Time remaining can jump without being wrong", "p.time_jump_lead": "Start compiling and it falls; stop to read and it rises.", "p.time_jump_body": "The charge did not come back. macOS repeatedly re-estimates how long the current pattern can continue. Power affects the estimate, but this page records the system value directly instead of calculating another answer from power.", "p.time_jump_proof": "Definition: on battery, record macOS time remaining. On power, when no system value exists, show stored energy divided by current power as a clearly labelled unplug estimate.", "p.geek": "Complete hardware metrics with per-item explanations", "p.hw_intro_title": "Start with the answer, then inspect raw fields when needed", "p.hw_intro_body": "This prototype includes every raw metric in the supplied list, plus the published model specification and necessary derivations. Each item has this Mac's current value, unit, explanation, range, and reliability; ? expands composite rows to their lowest-level fields.", "p.hw_search": "Search field, meaning, or group: temperature / capacity / charger", "p.hw_no_results": "No matching metric. Try a shorter search term.", "p.hw_group_cells": "Cell balance, depth of discharge, and permanent faults", "p.hw_group_capacity": "Design, full charge, and cycle life", "p.hw_group_electrical": "Live voltage, current, power, and temperature", "p.hw_group_charger": "Adapter capability and charging limits", "p.hw_group_telemetry": "Energy flow between system, adapter, and battery", "p.hw_group_identity": "Battery, gauge, firmware, and model identity", "p.hw_group_lifetime": "Lifetime extremes and capacity-calibration confidence", "p.hw_group_derived": "Derived answers from raw fields", "p.footer": "Definitions · Charge and time remaining prefer the user-visible macOS values; hardware values come from this Mac's IOKit snapshot ({time}).<br>Derived values · Health, capacity splits, and the on-power unplug estimate are labelled as derived or forecast and never mixed into system history.<br>Coverage · {fields} explained metrics / {groups} groups / {langs} languages; no fabricated long-term trends.", "p.hover_hint": "Click ? beside any metric for raw fields, formula, substitution, and reliability", "p.unusable_ex": "The part still included in chemical Qmax but excluded from usable full-charge FCC, derived by subtracting two gauge readings.", "p.nonlinear": "Do not extrapolate: lithium fade is fast early, then flattens"}, "pt": {"app.title": "Monitor de Bateria", "insight.section.health": "Diagnóstico de saúde", "insight.section.power": "Análise de consumo", "insight.section.hardware": "Dados brutos de hardware", "insight.level.good": "BOM", "insight.level.excellent": "EXCELENTE", "insight.factor.capacity": "Retenção de capacidade", "insight.factor.cycles": "Uso de ciclos", "insight.factor.balance": "Equilíbrio das células", "insight.factor.resistance": "Resistência interna", "insight.factor.temperature": "Histórico de temperatura", "insight.factor.fault": "Autoteste de hardware", "insight.factor.fault_none": "Sem falhas", "insight.life.label": "Vida restante", "insight. as em série: as tensões somam-se, a capacidade não. A soma equivale à tensão do pack.", "hw.n.reserve": "Buffer capacity outside the user charge percentage. This prototype uses it in its system-aligned health definition, reverse-verified only on this Mac.", "hw.n.raw_max": "Capacidade de carga total aprendida pelo medidor (= FccComp1/2). Não é o total químico: a parte inutilizável já foi descontada.", "hw.n.raw_current": "Não é medida diretamente: é calculada como FCC × (1 − profundidade de descarga), obtida por contagem de coulombs corrigida pela tensão em circuito aberto.", "hw.n.unusable": "Qmax and FCC come from the gauge. “Unreachable” is this prototype's interpretation of Qmax minus FCC, not a directly named gauge field.", "hw.n.deficit_cycle": "A retrospective average from total gap divided by cycles. It mixes chemical fade with currently unreachable capacity, so it is not measured loss per cycle and must not forecast life.", "hw.n.deficit_total": "Design minus FCC. This is not pure ageing; it combines chemical total-capacity fade with currently unreachable capacity and must be split using Qmax minus FCC.", "hw.n.calib_age": "O medidor só reaprende a capacidade quando o pack repousa o suficiente para ler a tensão em circuito aberto. Ficar sempre ligado faz este número crescer e a leitura de saúde envelhecer.", "hw.n.topology": "nSmP significa n em série e m em paralelo. Em série as tensões somam-se, a capacidade não — a célula mais fraca limita o pack.", "hw.n.health_system": "This prototype uses (FCC + reserve) divided by (design minus reserve), reverse-checked against this Mac. It is verified only here and is not a published Apple formula.", "hw.n.health_raw": "Proporção física pura sem ajuste de reserva. Inferior à dos Ajustes — ambas corretas conforme a definição.", "hw.n.design_cycles": "Use isto como base para a vida restante. Extrapolar linearmente a perda atual sobrestima muito o desgaste no início.", "hw.n.weighted_ra": "A Apple não publica um interv Semântica pouco clara: neste equipamento é baixo demais para ser tempo real, por isso não o usamos para estimar a idade.", "hw.n.daily_soc": "Apenas o instantâneo de hoje: o medidor não guarda histórico, por isso os dados semanais são acumulados por esta app.", "hw.n.system_power": "Já está em watts e permanece ativo na bateria — fonte preferida para análise de consumo.", "stat.temperature": "Temperatura", "stat.cycles": "Ciclos", "stat.health": "Saúde", "stat.adapter": "Adaptador", "gauge.ac": "Energia", "gauge.battery": "Na bateria", "rt.voltage": "Tensão", "rt.amperage": "Corrente", "rt.power": "Potência", "rt.temperature": "Temp", "rt.percent": "Nível", "rt.title": "Monitor em tempo real", "_name": "Português", "p.menu_preview": "Menu bar preview", "p.menu_time": "Time until empty", "p.menu_unplug": "Estimated after unplugging", "p.menu_unplug_short": "unplug ≈", "p.menu_direct": "Direct macOS value · click the pill to collapse", "p.menu_forecast": "Unplug estimate for the current Mac state · not system history", "p.menu_waiting": "Waiting for macOS time estimate", "p.menu_open": "Open full dashboard", "p.menu_settings": "Settings", "p.menu_close": "Close menu bar panel", "p.seg_now": "In there now", "p.seg_used": "Used", "p.seg_now_d": "<strong>Like the water left in the tank right now.</strong> Using the Mac drains it; plugging in fills it again.", "p.derive": "Consumer view: design {d} − current full charge {f} = long-term loss {loss}; current full charge {f} − current charge {c} = used this time {used}.<br>Deep diagnosis: gauge Qmax {q} is only for cell analysis and does not enter the main breakdown above.", "p.where_title": "Where your capacity went", "p.where_head": "Designed for {a} mAh, now fills to {b}, with {c} left right now", "p.design_capacity": "Original design capacity", "p.current_max": "Maximum when full now", "p.current_actual": "Actually left right now", "p.used_since_full": "Used since the last full charge", "p.permanent_loss": "Long-term capacity loss", "p.capacity_sum": "Whole bar = left now + used this charge + long-term loss = {design} mAh design capacity", "p.current_actual_desc": "Charge physically in the battery now. It falls with use and returns when charged.", "p.used_since_full_desc": "Consumed since the most recent full charge. It means “used this time” and returns as usable charge after charging.", "p.used_zero_desc": "It is zero because the battery is full now. This grows after unplugging and using the Mac.", "p.permanent_loss_desc": "The part current full-charge capacity is below the original design. Normal charging does not refill it.", "p.eq_capacity_title": "How much the battery can hold now", "p.eq_capacity_sub": "Compared with when it was new", "p.eq_usage_title": "How much has been used this charge", "p.eq_usage_sub": "This can be refilled by charging", "p.seg_use": "Actually usable", "p.seg_un": "Unreachable", "p.seg_age": "Lost to ageing", "p.card_now": "Left right now", "p.card_use": "Usable when full", "p.card_un": "Still there, out of reach", "p.card_age": "Actually lost to ageing", "p.seg_use_d": "<strong>Like the part of the tank you can really fill and drain.</strong> The menu-bar 0–100% moves within this usable portion.", "p.seg_un_d": "<strong>Like water below the reach of a straw.</strong> The charge is still there, but the Mac shuts down before voltage becomes unsafe.", "p.seg_age_d": "<strong>Like the tank itself becoming slightly smaller.</strong> Charging cannot restore this part; it is currently only a small slice of the original capacity.", "p.why_deeper": "How are these capacities calculated? View technical details", "p.ra_legend": "Internal resistance vs charge level", "p.ra_outlier": "Endpoint under-sampled — excluded", "p.ra_take": "Resistance climbs as charge falls, reaching {x} the mid-range level near empty. Since voltage = open-circuit − current×resistance, high resistance collapses the terminal voltage before that last charge can be drawn — so the gauge excludes it from usable capacity.", "p.dual_head": "Each point records the time remaining reported by macOS; the line only connects system readings", "p.split_v": "Voltage · what the cells give", "p.split_i": "Current · what the system draws", "p.split_note": "Voltage is set by cell chemistry and charge level — slow-moving and outside your control. <b>Only the current is yours to change</b>: closing heavy processes or dimming the display cuts the current term. Saving power physically means pulling less current.", "p.read_title": "Healthy ranges and high/low effects", "p.t_ok": "Normal", "p.t_warn": "Elevated", "p.t_bad": "Too hot", "p.t_lifeavg": "Your lifetime average", "p.t_hist": "All-time range", "p.t_today": "Today's range", "p.t_vs": "vs your normal", "p.collecting": "Collecting", "p.t_impact": "<b>Impact:</b> below 35°C does essentially no harm; 35–45°C measurably accelerates capacity fade; sustained above 45°C causes real damage. Cold does not permanently harm the cells but temporarily reduces available power. Target: <b>under 35°C</b>.", "p.p_low": "Below your normal", "p.p_mid": "About normal", "p.p_high": "Above your normal", "p.p_base": "Your long-run baseline", "p.p_ratio": "vs baseline", "p.p_energy": "Usable energy", "p.p_theory": "Runtime at this draw", "p.p_impact": "<b>The reference is you</b>, not an industry average — the baseline comes from over a hundred thousand samples on this machine. <b>Impact:</b> at your normal draw you get {a}; compiling or rendering (~25W) drops it to {b}; full load (~45W) leaves {c}.", "p.cadence": "The gauge refreshes only every ~30–60 s and holds its value in between — hence steps, not a smooth curve. It is a smoothed average, not an instantaneous reading.", "p.scen_title": "What you do decides how fast it drains", "p.scen_sub": "Measured on this machine. The app keeps recording and will fill in your own habitual scenarios.", "p.scen_now": "Now", "p.scen_idle": "Idle / reading", "p.scen_full": "Full-core compile", "p.scen_measured": "measured", "p.scen_note": "Not a hypothetical — measured just now by running a full-core load on this machine: power {a} → {b}, time left {c} → {d} min. <b>Everything you do sits on this curve.</b>", "p.t_cadence": "Refresh cadence", "p.t_histband": "All-time band", "p.p_peak": "Your all-time peak draw", "p.tb_freeze": "Charging below freezing plates metallic lithium and causes permanent damage. Discharging is safe but capacity shrinks sharply and temporarily.", "p.tb_cold": "Internal resistance rises; available power and runtime drop temporarily. No permanent harm — it recovers as it warms up.", "p.tb_ideal": "The sweet spot. Ageing runs at its slowest and neither charging nor discharging is restricted.", "p.tb_warm": "Ageing starts to accelerate. Rule of thumb: every extra 10 °C roughly doubles the rate of capacity fade.", "p.tb_hot": "Real damage. The system will usually throttle or limit charging to protect itself; sustained exposure here markedly shortens life.", "p.t_arrhenius": "<b>Target 15–35 °C.</b> Rule of thumb (Arrhenius): every 10 °C rise roughly doubles the fade rate — a battery living at 35 °C ages about twice as fast as one at 25 °C. <b>Note:</b> Apple publishes no cell-temperature thresholds; these bands come from general lithium-ion literature, not vendor specs.", "p.spec_title": "Metric reference · read it like a blood panel", "p.spec_sub": "Each metric gets a reference range, where you sit, and what high or low actually does — plus where that range came from.", "p.range": "Reference range", "p.src_apple": "Apple's own spec", "p.src_personal": "Your own history", "p.src_lit": "General Li-ion literature (not vendor spec)", "p.src_none": "⚠️ No authoritative range exists; this is a conservative guess. What is reliable is its trend over time.", "p.cb_ok": "Cells well matched — no single cell holding the pack back", "p.cb_mid": "Drifting apart. In series the weakest cell caps the pack, so a wider spread wastes more", "p.cb_bad": "Clearly unbalanced. Usable capacity is dragged down by the weakest cell — usually a sign one cell has degraded", "p.cb_cells": "Per-cell voltage", "p.ra_ok": "Good power delivery — voltage holds up under heavy load", "p.ra_mid": "Resistance rising. Bigger voltage sag under load means less usable capacity and more heat", "p.ra_bad": "High resistance. Heavy draw can trigger low-voltage shutdowns, and the extra heat accelerates ageing — a feedback loop", "p.ra_cells": "Per-cell resistance", "p.cy_ok": "Plenty of headroom. Against Apple's 1000-cycle rating you are nowhere near the end", "p.cy_mid": "Past halfway. Capacity fade usually flattens here, though the absolute number keeps falling", "p.cy_bad": "Near the rated end. Fade and resistance rise both accelerate from here — worth planning a replacement", "p.hp_ok": "Healthy. Runtime is close to what it was new", "p.hp_mid": "Some fade but still normal. Shorter runtime is noticeable yet everyday use is fine", "p.hp_bad": "Below 80% — Apple's own threshold for “service recommended”. macOS may start prompting", "p.pw_low": "Below your normal — you will get more runtime than usual", "p.pw_mid": "About your normal level", "p.pw_high": "Above normal. Runtime will be noticeably shorter than you are used to", "p.pw_max": "Near full load. The battery will not last long like this, and the heat accelerates ageing", "p.pv_ok": "Within the range this pack has historically operated in", "p.pv_low": "Below the all-time low. Close to cutoff — the system may shut down to protect the cells", "p.pv_high": "Above the all-time high — normally only seen at the instant of full charge", "p.unlock_title": "It keeps learning your battery", "p.unlock_head": "No setup or studying required — just use your Mac and more answers appear", "p.unlock_sub": "Minutes explain what is happening now, hours reveal today's pattern, and days begin shaping a profile unique to you. Every session makes the answers more personal.", "p.ul_now": "Right away", "p.ul_minute       '→ CellVoltage.delta':['cellDelta = max(CellVoltage) − min(CellVoltage)',`${Math.max(...D.cells)} − ${Math.min(...D.cells)} = ${r.v}mV`],
      '→ current full energy':['currentFullWh = designWh × FullChargeCapacity ÷ DesignCapacity',`${D.designWh} × ${D.fcc} ÷ ${D.design} = ${r.v}Wh`],
      '→ health (system)':['(FCC + PackReserve) ÷ (DesignCapacity − PackReserve) × 100',`(${D.fcc}+${D.reserve}) ÷ (${D.design}−${D.reserve}) × 100 = ${r.v}%`],
      '→ health (raw)':['FullChargeCapacity ÷ DesignCapacity × 100',`${D.fcc} ÷ ${D.design} × 100 = ${r.v}%`],
      '→ Qmax − FCC':['min(Qmax) − FullChargeCapacity',`${Math.min(...D.qmax)} − ${D.fcc} = ${r.v}mAh`],
      '→ deficit / cycle':['(DesignCapacity − FullChargeCapacity) ÷ CycleCount',`(${D.design} − ${D.fcc}) ÷ ${D.cyc} = ${r.v}mAh`],
      '→ deficit total':['DesignCapacity − FullChargeCapacity',`${D.design} − ${D.fcc} = ${r.v}mAh`],
      '→ since last Qmax':['CycleCount − CycleCountLastQmax',`${D.cyc} − ${D.cyc-D.calib} = ${r.v}`],
      '→ pack topology':['cellCount → series topology',`${D.cells.length} cell voltages → ${r.v}`]
    };
    const f=r.formula?[r.formula,r.substitution]:formulas[r.k];
    const raw=(r.raw?.length?r.raw:[{name:r.k,value:r.v,unit:r.u}]).map(x=>helpField(x.name,x.value,x.unit));
    return info(T(r.m),`${r.v}${r.u?` ${r.u}`:''}`,r.n?T(r.n):T(r.m),raw,f?f[0]:direct,f?f[1]:`${r.k} → ${r.v}${r.u?` ${r.u}`:''}`,`${T('hw.rel.'+r.r)} · ${r.r==='derived'?derived:'IOKit/system field'}`);
  }
  return null;
}

/* 剩余时间历史：每个点都是 macOS 直接返回的分钟数，不由功率或电量反推。 */
const RH = (D.remainingHistory || [])
  .filter(p=>Number.isFinite(p.t) && Number.isFinite(p.minutes) && p.minutes>0 && p.minutes<60000)
  .map(p=>({t:p.t,h:p.minutes/60}));
const HAS_UNPLUG_FORECAST = D.onAC && Number.isFinite(D.unplugEstimate) && D.unplugEstimate > 0;
const FORECAST_HOURS = HAS_UNPLUG_FORECAST ? D.unplugEstimate / 60 : 0;
let remainingHover = -1;
let forecastHover = null;
const clockText = ms => new Intl.DateTimeFormat(LC, {hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(ms));
const hourText = h => h < 1 ? h.toFixed(2) : h.toFixed(1);
function drawRemaining(hoverIndex=remainingHover){
  remainingHover=hoverIndex;
  const W=1000,H=250,ML=62,MR=24,MT=22,MB=38,iw=W-ML-MR,ih=H-MT-MB;
  if(!RH.length){
    if(HAS_UNPLUG_FORECAST){
      const start=Date.now(),end=start+D.unplugEstimate*60000,hHi=Math.max(.5,FORECAST_HOURS*1.12);
      const x=f=>ML+iw*f,y=v=>MT+ih-v/hHi*ih;
      let g=`<defs><linearGradient id="forecastFill" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffb020" stop-opacity=".16"/><stop offset="1" stop-color="#ffb020" stop-opacity="0"/></linearGradient></defs>`;
      for(let k=0;k<=3;k++){const yy=MT+ih*k/3;
        g+=`<line x1="${ML}" y1="${yy}" x2="${W-MR}" y2="${yy}" stroke="rgba(91,255,199,.06)"/>
          <text x="${ML-9}" y="${yy+3.5}" fill="#ffb020" font-size="9" font-family="IBM Plex Mono" text-anchor="end" opacity=".85">${hourText(hHi-(hHi*k/3))}</text>`;}
      [0,.333,.666,1].forEach((f,idx)=>{
        g+=`<text x="${x(f)}" y="${H-11}" fill="#5d6f6b" font-size="8.5" font-family="IBM Plex Mono" text-anchor="${idx===0?'start':idx===3?'end':'middle'}">${clockText(start+(end-start)*f)}</text>`;
      });
      const d=`M${x(0)} ${y(FORECAST_HOURS)}L${x(1)} ${y(0)}`;
      g+=`<path d="${d}L${x(1)} ${MT+ih}L${x(0)} ${MT+ih}Z" fill="url(#forecastFill)"/>
        <path d="${d}" fill="none" stroke="#ffb020" stroke-width="2.3" stroke-dasharray="7 6"/>
        <circle cx="${x(0)}" cy="${y(FORECAST_HOURS)}" r="3.8" fill="#ffb020"/>
        <text x="${ML}" y="${MT-7}" fill="#ffb020" font-size="9" font-family="IBM Plex Mono">h · ${T('p.unplug_badge')}</text>`;
      if(forecastHover!=null){
        const remain=FORECAST_HOURS*(1-forecastHover),hx=x(forecastHover),hy=y(remain);
        g+=`<line x1="${hx}" y1="${MT}" x2="${hx}" y2="${MT+ih}" stroke="rgba(230,242,238,.4)" stroke-dasharray="3 3"/>
          <circle cx="${hx}" cy="${hy}" r="4" fill="var(--ink)" stroke="#ffb020" stroke-width="2"/>`;
      }
      document.getElementById('remainChart').innerHTML=g;
      return;
    }
    document.getElementById('remainChart').innerHTML=`<line x1="${ML}" y1="${MT+ih}" x2="${W-MR}" y2="${MT+ih}" stroke="rgba(91,255,199,.10)"/>
      <text x="${W/2}" y="${H/2}" fill="#5d6f6b" font-size="11" font-family="PingFang SC" text-anchor="middle">${T('p.no_history')}</text>`;
    return;
  }
  const values=RH.map(p=>p.h);
  const vMin=Math.min(...values),vMax=Math.max(...values),pad=Math.max(.12,(vMax-vMin)*.22);
  const hLo=Math.max(0,vMin-pad),hHi=vMax+pad;
  const tMin=RH.length>1?RH[0].t:RH[0].t-40*60*1000;
  const tMax=RH.length>1?RH[RH.length-1].t:RH[0].t;
  const xTime=t=>ML+(t-tMin)/Math.max(1,tMax-tMin)*iw;
  const yH=v=>MT+ih-(v-hLo)/(hHi-hLo)*ih;
  let g=`<defs><linearGradient id="remainingFill" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#5bffc7" stop-opacity=".24"/><stop offset="1" stop-color="#5bffc7" stop-opacity="0"/></linearGradient></defs>`;
  for(let k=0;k<=3;k++){const yy=MT+ih*k/3;
    g+=`<line x1="${ML}" y1="${yy}" x2="${W-MR}" y2="${yy}" stroke="rgba(91,255,199,.06)"/>
        <text x="${ML-9}" y="${yy+3.5}" fill="#5bffc7" font-size="9" font-family="IBM Plex Mono" text-anchor="end" opacity=".85">${hourText(hHi-(hHi-hLo)*k/3)}</text>`;}
  [0,.333,.666,1].forEach((f,idx)=>{
    const t=tMin+(tMax-tMin)*f;
    g+=`<text x="${ML+iw*f}" y="${H-11}" fill="#5d6f6b" font-size="8.5" font-family="IBM Plex Mono" text-anchor="${idx===0?'start':idx===3?'end':'middle'}">${clockText(t)}</text>`;
  });
  // 系统值约 56 秒更新一次；保持上一次读数，直到新读数到来。
  let path='';
  RH.forEach((p,i)=>{const xa=xTime(p.t),ya=yH(p.h);
    if(!i){path+=`M${xa.toFixed(1)} ${ya.toFixed(1)}`;}
    else{const prev=RH[i-1];path+=`L${xa.toFixed(1)} ${yH(prev.h).toFixed(1)}L${xa.toFixed(1)} ${ya.toFixed(1)}`;}});
  if(RH.length===1) path=`M${xTime(RH[0].t).toFixed(1)} ${yH(RH[0].h).toFixed(1)}`;
  const firstX=xTime(RH[0].t),lastX=xTime(RH[RH.length-1].t);
  if(RH.length>1) g+=`<path d="${path}L${lastX} ${MT+ih}L${firstX} ${MT+ih}Z" fill="url(#remainingFill)"/>`;
  g+=`<path d="${path}" fill="none" stroke="#5bffc7" stroke-width="2.4" stroke-linejoin="round"/>
      <circle cx="${lastX}" cy="${yH(RH[RH.length-1].h)}" r="3.5" fill="#5bffc7"><animate attributeName="r" values="3.5;5.5;3.5" dur="2s" repeatCount="indefinite"/></circle>
      <text x="${ML}" y="${MT-7}" fill="#5bffc7" font-size="9" font-family="IBM Plex Mono">h</text>`;
  if(hoverIndex>=0){
    const point=RH[hoverIndex],hx=xTime(point.t);
    g+=`<line x1="${hx}" y1="${MT}" x2="${hx}" y2="${MT+ih}" stroke="rgba(230,242,238,.4)" stroke-width="1" stroke-dasharray="3 3"/>
      <circle cx="${hx}" cy="${yH(point.h)}" r="4" fill="var(--ink)" stroke="#5bffc7" stroke-width="2"/>`;
  }
  document.getElementById('remainChart').innerHTML=g;
}
const remainWrap=$('#remainWrap'), remainTip=$('#remainTip');
remainWrap.addEventListener('pointermove',e=>{
  const r=remainWrap.getBoundingClientRect();
  const ratio=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));
  if(!RH.length){
    if(!HAS_UNPLUG_FORECAST) return;
    forecastHover=ratio;
    drawRemaining(-1);
    const minutes=Math.max(0,Math.round(D.unplugEstimate*(1-ratio)));
    remainTip.innerHTML=`<div class="ct">${T('p.chart_time')} · ${clockText(Date.now()+D.unplugEstimate*60000*ratio)}</div>
      <div class="cv hours"><span>${T('p.unplug_badge')}</span><b>${hourText(minutes/60)} h · ${minutes} min</b></div>`;
    remainTip.style.left=Math.min(78,Math.max(2,ratio*100))+'%';
    remainTip.style.top=Math.min(r.height-28,Math.max(36,e.clientY-r.top))+'px';
    remainTip.classList.add('on');
    return;
  }
  const target=RH[0].t+(RH[RH.length-1].t-RH[0].t)*ratio;
  let i=0;
  RH.forEach((p,index)=>{if(Math.abs(p.t-target)<Math.abs(RH[i].t-target)) i=index;});
  drawRemaining(i);
  remainTip.innerHTML=`<div class="ct">${T('p.chart_time')} · ${clockText(RH[i].t)}</div>
    <div class="cv hours"><span>${T('p.chart_hours')}</span><b>${hourText(RH[i].h)} h · ${Math.round(RH[i].h*60)} min</b></div>`;
  remainTip.style.left=Math.min(78,Math.max(2,ratio*100))+'%';
  remainTip.style.top=Math.min(r.height-28,Math.max(36,e.clientY-r.top))+'px';
  remainTip.classList.add('on');
});
remainWrap.addEventListener('pointerleave',()=>{remainingHover=-1;forecastHover=null;remainTip.classList.remove('on');drawRemaining(-1);});

/* 内阻示波器 */
function drawScope() {
  const RA = D.ra, W = 1000, H = 320, ML = 56, MR = 22, MT = 24, MB = 40;
  const iw = W - ML - MR, ih = H - MT - MB, maxRa = 1200;
  const X = i => ML + i / 14 * iw, Y = v => MT + ih - Math.min(v, maxRa) / maxRa * ih;
  let s = `<defs><filter id="gl" x="-20%" y="-40%" width="140%" height="180%">
    <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>`;
  for (let g = 0; g <= 4; g++) { const yy = MT + ih * g / 4;
    s += `<line x1="${ML}" y1="${yy}" x2="${W - MR}" y2="${yy}" stroke="rgba(91,255,199,.07)"/>
          <text x="${ML - 8}" y="${yy + 3.5}" fill="#5d6f6b" font-size="9" font-family="IBM Plex Mono" text-anchor="end">${Math.round(maxRa - maxRa * g / 4)}</text>`; }
  [0, 20, 40, 60, 80, 100].forEach(soc => { const xx = X((100 - soc) / 100 * 14);
    s += `<line x1="${xx}" y1="${MT}" x2="${xx}" y2="${MT + ih}" stroke="rgba(91,255,199,.05)"/>
          <text x="${xx}" y="${MT + ih + 19}" fill="#5d6f6b" font-size="9" font-family="IBM Plex Mono" text-anchor="middle">${soc}%</text>`; });
  s += `<text x="${ML - 8}" y="${MT - 9}" fill="#5d6f6b" font-size="8.5" font-family="IBM Plex Mono" text-anchor="end">mΩ</text>`;
  const xCut = X((100 - 16.4) / 100 * 14);
  s += `<rect x="${xCut}" y="${MT}" width="${W - MR - xCut}" height="${ih}" fill="rgba(255,92,92,.07)"/>
        <line x1="${xCut}" y1="${MT}" x2="${xCut}" y2="${MT + ih}" stroke="rgba(255,92,92,.5)" stroke-dasharray="3 3"/>`;
  let d = ''; for (let i = 1; i <= 14; i++) d += (i === 1 ? 'M' : 'L') + X(i) + ' ' + Y(RA[i]);
  s += `<path d="${d}" fill="none" stroke="var(--phos)" stroke-width="2.4" stroke-linejoin="round" filter="url(#gl)"
        pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"><animate attributeName="stroke-dashoffset" from="1" to="0" dur="1.5s" begin=".4s" fill="freeze" calcMode="spline" keySplines=".3 0 .2 1"/></path>
        <path d="M${X(0)} ${Y(RA[0])} L${X(1)} ${Y(RA[1])}" fill="none" stroke="#5d6f6b" stroke-width="1.3" stroke-dasharray="4 4" opacity=".65"/>`;
  for (let i = 1; i <= 14; i++) s += `<circle cx="${X(i)}" cy="${Y(RA[i])}" r="2.5" fill="var(--ink)" stroke="var(--phos)" stroke-width="1.3" opacity="0"><animate attributeName="opacity" to="1" dur=".3s" begin="${1.3 + i * .04}s" fill="freeze"/></circle>`;
  const xn = X((100 - D.socUI) / 100 * 14);
  s += `<line x1="${xn}" y1="${MT - 5}" x2="${xn}" y2="${MT + ih}" stroke="var(--phos)" stroke-width="1.1" opacity=".7"/>
        <circle cx="${xn}" cy="${MT - 8}" r="3.2" fill="var(--phos)"><animate attributeName="r" values="3.2;5;3.2" dur="2.2s" repeatCount="indefinite"/></circle>`;
  $('#scope').innerHTML = s;
}

  $('#socPc').textContent = D.socUI + '%';
  $('#socFill').style.width = `${Math.max(0,Math.min(100,D.socUI))}%`;
  $('#acSt').textContent = T(D.onAC ? 'gauge.ac' : 'gauge.battery');
  const hasSystemEstimate = !D.onAC && D.ate > 0 && D.ate < 60000;
  const shownMinutes = hasSystemEstimate ? D.ate : (HAS_UNPLUG_FORECAST ? D.unplugEstimate : 0);
  const h = shownMinutes ? Math.floor(shownMinutes / 60) : 0, m = shownMinutes ? shownMinutes % 60 : 0;
  $('#timeKicker').textContent = HAS_UNPLUG_FORECAST ? T('p.unplug_kicker') : T('p.usage_basis');
  $('#estimateBadge').textContent = T('p.unplug_badge');
  $('#estimateBadge').classList.toggle('on',HAS_UNPLUG_FORECAST);
  $('#hh').textContent = shownMinutes ? h : '—'; $('#hu').textContent = shownMinutes ? 'h' : '';
  $('#mm').textContent = shownMinutes ? m : ''; $('#mu').textContent = shownMinutes ? 'm' : '';
  $('#srcNote').textContent = hasSystemEstimate ? T('p.src_note') : (HAS_UNPLUG_FORECAST ? T('p.unplug_note') : T('p.no_estimate_ac'));
  const forecastWhy = $('#forecastWhy');
  const dailyMinutes = D.avgW > .5 ? Math.round(D.remainingWh / D.avgW * 60) : 0;
  const durationText = minutes => `${Math.floor(minutes / 60)}h ${minutes % 60}m`;
  const powerRatio = D.avgW > .5 ? Math.round(D.watts / D.avgW * 100) : 0;
  const designEnergyText = Number.isFinite(D.designWh) ? `${D.designWh.toFixed(1)} Wh` : '—';
  forecastWhy.classList.toggle('on', HAS_UNPLUG_FORECAST);
  forecastWhy.innerHTML = HAS_UNPLUG_FORECAST ? `
    <div class="fw-analogy">${icon('bolt','var(--amber)',12)}<span>${T('p.full_tank_explain').replace('{ratio}',powerRatio)}</span></div>
    <div class="fw-design">
      <div class="energy"><small>${T('p.model_design_energy')} · ${D.model}${helpButton('modelDesignWh')}</small><b>${designEnergyText}</b></div>
      <span class="fw-arrow">→</span>
      <div class="energy current"><small>${T('p.current_full_energy')}${helpButton('currentFullWh')}</small><b>${D.currentFullWh.toFixed(1)} Wh</b><em>${D.healthRaw.toFixed(1)}%</em></div>
    </div>
    <div class="fw-math">
      <div class="fw-term"><small>${T('p.energy_in_battery')}${helpButton('remainingWh')}</small><b>${D.remainingWh.toFixed(1)} <i>Wh</i></b></div>
      <span class="fw-op">÷</span>
      <div class="fw-term"><small>${T('p.current_power')}${helpButton('power')}</small><b>${D.watts.toFixed(1)} <i>W</i></b></div>
      <span class="fw-op">=</span>
      <div class="fw-term result"><small>${T('p.current_use_estimate')}${helpButton('actualRuntime')}</small><b>${durationText(D.unplugEstimate)}</b></div>
    </div>
    <div class="fw-normal">${T('p.baseline_compare').replace('{watts}',D.avgW.toFixed(1)).replace('{time}',durationText(dailyMinutes))}</div>` : '';

  const auditReady = Number.isFinite(D.designWh) && Number.isFinite(D.officialWebHours) && D.watts > .5;
  $('#runtimeAuditCard').classList.toggle('on', auditReady);
  if(auditReady){
    const officialWebPower = D.designWh / D.officialWebHours;
    const officialVideoPower = D.designWh / D.officialVideoHours;
    const sameLoadWebHours = D.currentFullWh / officialWebPower;
    const sameLoadVideoHours = D.currentFullWh / officialVideoPower;
    const derivedActualHours = D.remainingWh / D.watts;
    const hasDirectRuntime = !D.onAC && D.ate > 0 && D.ate < 60000;
    const actualHours = hasDirectRuntime ? D.ate / 60 : derivedActualHours;
    const actualNote = hasDirectRuntime
      ? `MACOS DIRECT · ${D.ate} MIN · POWER CHECK ${hourText(derivedActualHours)}H`
      : `${D.remainingWh.toFixed(1)}Wh ÷ ${D.watts.toFixed(2)}W`;
    const capacityCost = Math.max(0,D.officialWebHours-sameLoadWebHours);
    const workloadCost = Math.max(0,sameLoadWebHours-(D.currentFullWh/D.watts));
    const officialRatio = D.watts / officialWebPower;
    const row = (kind,helpId,label,note,hours,width) => `<div class="ra-row ${kind}">
      <div class="ra-label"><b>${label}${helpButton(helpId)}</b><small>${note}</small></div>
      <div class="ra-track"><i style="width:${Math.max(3,Math.min(100,width))}%"></i></div>
      <div class="ra-hours">${hourText(hours)}<small> h</small></div></div>`;
    $('#runtimeBars').innerHTML =
      row('official','officialBenchmark',T('p.audit_official'),`${D.designWh.toFixed(1)}Wh · ${officialWebPower.toFixed(2)}W · VIDEO ${D.officialVideoHours}h`,D.officialWebHours,100)+
      row('capacity','sameLoad',T('p.audit_same_load'),`${D.currentFullWh.toFixed(1)}Wh · VIDEO ${hourText(sameLoadVideoHours)}h`,sameLoadWebHours,sameLoadWebHours/D.officialWebHours*100)+
      `<div class="ra-delta capacity">↳ ${T('p.audit_capacity_note').replace('{hours}',capacityCost.toFixed(1))}</div>`+
      row('actual','actualRuntime',T('p.audit_actual'),actualNote,actualHours,actualHours/D.officialWebHours*100)+
      `<div class="ra-delta load">↳ ${T('p.audit_load_note').replace('{hours}',workloadCost.toFixed(1))}</div>`;
    $('#runtimeVerdict').innerHTML = `<div class="mult">${officialRatio.toFixed(1)}×</div>
      <h3>${T('p.audit_cause')}</h3>
      <p>${T('p.audit_cause_body').replace('{ratio}',officialRatio.toFixed(1))}</p>`;
    $('#runtimeConfig').innerHTML = `<div><small>${T('p.audit_test_config')}</small><b>M4 · ${D.officialTestCpuCores}C CPU / ${D.officialTestGpuCores}C GPU · ${D.officialTestMemoryGB}GB / ${D.officialTestStorageGB}GB</b></div>
      <div><small>${T('p.audit_your_config')}</small><b>${D.systemChip} · ${D.systemCpuCores}C CPU / ${D.systemGpuCores}C GPU · ${D.systemMemory}</b></div>`;
  }

  $('#statGrid').innerHTML = [
    {help:'health',ic:'heart',c:'var(--amber)',l:T('p.priority_health'),v:D.healthSys.toFixed(0),u:'%',sub:T('p.hp_ok').slice(0,10),
      range:'80–100%',hist:T('p.history_learning'),low:T('p.health_low_short'),high:T('p.health_high_short')},
    {help:'power',ic:'bolt',c:'var(--blue)',l:T('p.priority_power'),v:D.watts.toFixed(1),u:'W',sub:`${(D.watts/D.avgW*100).toFixed(0)}% ${T('p.p_ratio')}`,
      range:`${(D.avgW*.85).toFixed(1)}–${(D.avgW*1.3).toFixed(1)}W`,hist:`${T('p.history_peak')} ${D.peakW}W`,low:T('p.power_low_short'),high:T('p.power_high_short')},
    {help:'temp',ic:'thermo',c:D.temp<35?'var(--phos)':'var(--amber)',l:T('p.priority_temp'),v:D.temp.toFixed(1),u:'°C',sub:D.temp<35?T('p.t_ok'):T('p.t_warn'),
      range:'15–35°C',hist:`${T('p.history_extreme')} ${D.tempMin}–${D.tempMax}°C`,low:T('p.temp_low_short'),high:T('p.temp_high_short')},
  ].map(s => `<div class="sc">
      <div class="l">${icon(s.ic, s.c, 11)}<span>${s.l}</span>${helpButton(s.help)}</div>
      <div class="v">${s.v}<small> ${s.u}</small></div>
      <div class="sub" style="color:${s.c}">${s.sub}</div>
      <div class="ref"><span>${T('p.good_range')}</span><b>${s.range}</b></div>
      <div class="hist">${s.hist}</div>
      <div class="impact"><span class="low">${s.low}</span><span class="high">${s.high}</span></div>
    </div>`).join('');

  const forecastOnly=!RH.length && HAS_UNPLUG_FORECAST;
  $('#remainingTag').textContent=T(forecastOnly?'p.unplug_trend':'p.remaining_trend');
  $('#remainingHead').textContent=T(forecastOnly?'p.unplug_head':'p.dual_head');
  $('#remainLeg').innerHTML = `<span><i style="background:${forecastOnly?'var(--amber)':'var(--phos)'}"></i>${
    forecastOnly?T('p.unplug_legend'):(RH.length?`${T('p.chart_hours')} · h`:T('p.chart_waiting'))}</span>`;
  $('#historySource').textContent=T(forecastOnly?'p.unplug_note':'p.direct_source');
  $('#historyCadence').textContent=T(forecastOnly?'p.forecast_only':'p.sample_cadence_short');
  $('#historyMethod').textContent=T(forecastOnly?'p.unplug_method':'p.no_recalc');

  // 顶部只展示用户最关心的健康度、功率和温度；循环等 4 项放在这里。
  const rangeText = (a,b,u) => `${a}–${b}${u ? ' '+u : ''}`;
  const sourceKey = s => 'p.src_' + s.src;
  $('#specTable').innerHTML = `<div class="sh">
      <span>${T('p.spec_metric')}</span><span>${T('p.spec_current')}</span><span>${T('p.range')}</span><span>${T('p.history_extreme')}</span>
      <span>${T('p.low_effect')}</span><span>${T('p.high_effect')}</span><span>${T('p.spec_source')}</span>
    </div>` + D.specs.filter(s=>!['stat.temperature','insight.factor.capacity','rt.power'].includes(s.key)).map(s=>{
      const hist=s.refs.find(r=>r[0]==='p.t_histband');
      const history=hist?`${hist[1]} ${hist[2]}`:T('p.history_learning');
      const sourceLabel=s.src==='none'?T('p.src_none_short'):T(sourceKey(s));
      const sourceDetail=s.src==='none'?T(sourceKey(s)):'';
      const decimals=s.fmt==='%.2f'?2:s.fmt==='%.1f'?1:0;
      const current=`${Number(s.val).toFixed(decimals)} ${s.unit}`;
      return `<div class="sr">
        <div class="metric">${T(s.key)}${helpButton(`spec:${D.specs.indexOf(s)}`)}</div>
        <div class="current">${current}</div>
        <div class="range">${rangeText(s.lo,s.hi,s.unit)}</div>
        <div class="history">${history}</div>
        <div class="effect low">${T(s.bands[0][2])}</div>
        <div class="effect high">${T(s.bands[s.bands.length-1][2])}</div>
        <div class="source"><b>${sourceLabel}</b>${sourceDetail}</div>
      </div>`;
    }).join('');

  // ③ 你买的容量去哪了 —— 三段加起来正好等于出厂标称
  const use = D.fcc, loss = D.deficit, tot = D.design;
  $('#whereHead').innerHTML = T('p.where_head')
    .replace('{a}', `<em>${tot.toLocaleString()}</em>`).replace('{b}', `<em>${use.toLocaleString()}</em>`)
    .replace('{c}', `<em>${Math.min(D.cur,use).toLocaleString()}</em>`);
  const nowc = Math.max(0,Math.min(D.cur,use)), usedc = Math.max(0,use-nowc);
  // 设计容量只拆成三块：此刻还有 + 本次已用 + 相对出厂的长期容量损失。
  $('#whBar').innerHTML =
    `<div class="whseg use" style="flex:${use} 1 0">
       <div class="whin now" style="flex:${nowc} 1 0"><b>${nowc.toLocaleString()}</b><s>${T('p.seg_now')}</s></div>
       ${usedc?`<div class="whin used" style="flex:${usedc} 1 0"><b style="color:var(--t3)">${usedc.toLocaleString()}</b><s style="color:var(--t3)">${T('p.seg_used')}</s></div>`:''}
     </div>
     <div class="whseg loss" style="flex:${Math.max(loss,60)} 1 0"><b>${loss.toLocaleString()}</b><s>${(loss/tot*100).toFixed(1)}%</s></div>`;
  $('#whLeg').innerHTML =
    `<div class="cap-sum">${icon('batt','var(--t2)',14)}<span>${T('p.capacity_sum').replace('{design}',tot.toLocaleString())}</span></div>` + [
      ['currentActual','batt','var(--phos)',T('p.current_actual'),nowc,T('p.current_actual_desc')],
      ['usedSinceFull','bolt','var(--blue)',T('p.used_since_full'),usedc,T(usedc===0?'p.used_zero_desc':'p.used_since_full_desc')],
      ['permanentLoss','cycle','var(--red)',T('p.permanent_loss'),loss,T('p.permanent_loss_desc')],
    ].map(([help,ic,c,label,value,desc])=>{const pc=value/tot*100;return `<div class="cap-key" style="--key-color:${c}">
      <div class="cap-key-head"><div class="cap-key-icon">${icon(ic,c,16)}</div><div class="cap-key-meta"><div class="cap-key-label">${label}${helpButton(help)}</div>
      <div class="cap-key-value">${value.toLocaleString()} <small>mAh · ${pc.toFixed(1)}%</small></div></div></div>
      <div class="cap-key-desc">${desc}</div><div class="cap-mini"><i style="width:${Math.max(0,Math.min(100,pc))}%"></i></div></div>`;}).join('');
  const capTerm=(help,ic,c,label,value)=>`<div class="cap-term" style="--cap-color:${c}"><div class="cap-icon">${icon(ic,c,18)}</div>
    <div class="cap-copy"><small>${label}${helpButton(help)}</small><b>${value.toLocaleString()} <i>mAh</i></b></div></div>`;
  $('#capacityEquations').innerHTML = `
    <div class="cap-eq"><div class="cap-eq-title"><b>${T('p.eq_capacity_title')}</b><span>${T('p.eq_capacity_sub')}</span></div>
      ${capTerm('capacityOverview','batt','var(--amber)',T('p.design_capacity'),tot)}<div class="cap-op">−</div>
      ${capTerm('permanentLoss','cycle','var(--red)',T('p.permanent_loss'),loss)}<div class="cap-op">=</div>
      ${capTerm('currentMax','shield','var(--phos)',T('p.current_max'),use)}</div>
    <div class="cap-eq"><div class="cap-eq-title"><b>${T('p.eq_usage_title')}</b><span>${T('p.eq_usage_sub')}</span></div>
      ${capTerm('currentMax','shield','var(--phos)',T('p.current_max'),use)}<div class="cap-op">−</div>
      ${capTerm('usedSinceFull','bolt','var(--blue)',T('p.used_since_full'),usedc)}<div class="cap-op">=</div>
      ${capTerm('currentActual','batt','var(--phos)',T('p.current_actual'),nowc)}</div>`;
  // 推导来源（原容量链条的信息，压缩成一行）
  $('#whDeriv').innerHTML = T('p.derive')
    .replace('{d}', `<b>${tot.toLocaleString()}</b>`).replace('{q}', `<b>${Math.min(...D.qmax).toLocaleString()}</b>`)
    .replaceAll('{f}', `<b>${use.toLocaleString()}</b>`).replace('{c}', `<b>${nowc.toLocaleString()}</b>`)
    .replace('{loss}', `<b>${loss.toLocaleString()}</b>`).replace('{used}', `<b>${usedc.toLocaleString()}</b>`);

  // 两套健康度与容量差额都在这里就地拆开，避免用户把不同分母混成矛盾。
  $('#healthAhaTitle').textContent = T('p.health_two_title')
    .replace('{sys}', D.healthSys.toFixed(1)).replace('{raw}', D.healthRaw.toFixed(1));
  $('#healthAhaBody').innerHTML = T('p.health_two_body');
  $('#healthAhaFormula').textContent = T('p.health_two_formula')
    .replace('{sys}', D.healthSys.toFixed(1)).replace('{raw}', D.healthRaw.toFixed(1));
  $('#lossAhaTitle').textContent = T('p.use_loss_title');
  $('#lossAhaBody').innerHTML = T('p.use_loss_body')
    .replace('{used}', usedc.toLocaleString()).replace('{loss}', loss.toLocaleString());
  $('#lossAhaFormula').textContent = T('p.use_loss_formula')
    .replace('{used}',usedc.toLocaleString()).replace('{loss}',loss.toLocaleString());
  $('#agingProof').innerHTML = T('p.aging_proof')
    .replace('{cyc}', `<b>${D.cyc.toLocaleString()}</b>`).replace('{loss}', `<b>${loss.toLocaleString()} mAh</b>`)
    .replace('{per}', `<b>${D.deficitPC.toFixed(1)} mAh</b>`);

  const mid = Math.round(D.ra.slice(2, 9).reduce((a, b) => a + b) / 7);
  $('#scopeLegend').innerHTML = `<span><i style="background:var(--phos)"></i>${T('p.ra_legend')}</span>
     <span><i style="background:#5d6f6b;opacity:.6"></i>${T('p.ra_outlier')}</span>`;
  $('#scopeTake').innerHTML = T('p.ra_take').replace('{x}', `<span class="h">${(D.ra[14] / mid).toFixed(1)}×</span>`);

  if ($('#tBands')) $('#tBands').innerHTML = bandRows();

  const fixedRange = r => {
    const k=r.k;
    if(k==='→ CellVoltage.delta') return '0–20 mV';
    if(k==='BatteryData.WeightedRa') return `0–130 mΩ · ${T('p.src_none_short')}`;
    if(k==='BatteryData.ChemicalWeightedRa') return `0 = N/A · ${T('p.no_fixed_range')}`;
    if(k==='BatteryData.PresentDOD' || k.includes('DailyMaxSoc / DailyMinSoc') || k==='CurrentCapacity') return '0–100 %';
    if(k==='AppleRawMaxCapacity' || k.includes('FccComp1')) return `≥ ${(D.design*.8).toFixed(0)} mAh · 80%`;
    if(k==='AppleRawCurrentCapacity' || k==='NominalChargeCapacity') return `0–${D.design.toLocaleString()} mAh`;
    if(k==='TimeRemaining / AvgTimeToEmpty' || k==='AvgTimeToFull') return '0–65,534 min · 65,535 = N/A';
    if(k==='BatteryInvalidWakeSeconds') return `0+ s · ${T('p.counter_range')}`;
    if(k==='CycleCount') return `0–${D.dcyc.toLocaleString()}`;
    if(k==='DesignCycleCount9C') return `${D.dcyc.toLocaleString()} · ${T('p.rated_value')}`;
    if(k==='MaxCapacity' || k==='→ health (system)' || k==='→ health (raw)') return '80–100 %';
    if(k==='Temperature' || k==='VirtualTemperature') return '1500–3500 · 0.01°C';
    if(k==='BatteryData.SystemPower') return `0–${(D.avgW*1.3).toFixed(1)} W`;
    if(k==='LifetimeData.MinimumTemperature' || k==='LifetimeData.MaximumTemperature' || k==='LifetimeData.AverageTemperature') return '15–35 °C';
    if(k==='LifetimeData.MinimumPackVoltage' || k==='LifetimeData.MaximumPackVoltage' || k.includes('AppleRawBatteryVoltage'))
      return `${Math.round(D.specs[D.specs.length-1].lo*1000)}–${Math.round(D.specs[D.specs.length-1].hi*1000)} mV`;
    if(/Serial|DeviceName|Firmware|ChemID|ManufactureDate|DateOfFirstUse|installed|model|topology|Reason|Status|Description/.test(k)) return T('p.id_no_range');
    if(/Count|Samples|OperatingTime|FlashWrite|since last|deficit/.test(k)) return T('p.counter_range');
    return T('p.no_fixed_range');
  };

  const hwGroupDescriptions = {
    'hw.group.cells':'p.hw_group_cells','hw.group.capacity':'p.hw_group_capacity',
    'hw.group.runtime':'p.hw_group_runtime','hw.group.resistance':'p.hw_group_resistance',
    'hw.group.electrical':'p.hw_group_electrical','hw.group.charger':'p.hw_group_charger',
    'hw.group.telemetry':'p.hw_group_telemetry','hw.group.identity':'p.hw_group_identity',
    'hw.group.lifetime':'p.hw_group_lifetime','hw.group.derived':'p.hw_group_derived'
  };
  $('#hwGroups').innerHTML = D.table.map(([gk,rows]) => `<div class="hwgroup"><b>${T(gk)}</b><span>${T(hwGroupDescriptions[gk])} · ${rows.length}</span></div>`).join('');
  const search=$('#hwSearch');
  search.placeholder=T('p.hw_search');
  search.setAttribute('aria-label',T('p.hw_search'));
  const query=search.value.trim().toLocaleLowerCase(LC);
  let n = 0, html = '', total = D.table.reduce((sum,[,rows])=>sum+rows.length,0);
  D.table.forEach(([gk, rows]) => {
    const shownRows=rows.filter(r=>{
      if(!query) return true;
      return [r.k,r.v,r.u,T(gk),T(r.m),r.n?T(r.n):'',fixedRange(r)].join(' ').toLocaleLowerCase(LC).includes(query);
    });
    if(!shownRows.length) return;
    html += `<div class="grp">${T(gk)} · ${shownRows.length}</div>`;
    shownRows.forEach(r => { n++;
      const note = r.n ? T(r.n).replace(/"/g, '&quot;') : '';
      html += `<div class="r" title="${note}"><span class="k"><span class="kt">${esc(r.k)}</span>${helpButton(`hw:${HW_FLAT.indexOf(r)}`)}</span><span class="v">${esc(r.v)}</span>
        <span class="u">${esc(r.u)}</span><span class="m">${esc(T(r.m))}${note?`<small>${note}</small>`:''}</span>
        <span class="rg">${fixedRange(r)}</span>
        <span class="b b-${r.r}" title="${T('hw.rel.' + r.r).replace(/"/g, '&quot;')}">${{verified:'✓',conditional:'◐',questionable:'?',derived:'ƒ'}[r.r]}</span></div>`; });
  });
  $('#gkBody').innerHTML = html;
  $('#fieldCount').textContent = `${n} / ${total}`;
  $('#hwEmpty').style.display=n?'none':'block';
  $('#foot').innerHTML = T('p.footer')
    .replace('{time}', D.snapshotAt).replace('{langs}', D.langs.length).replace('{fields}', total).replace('{groups}', D.table.length);
  document.querySelectorAll('.qbtn').forEach(b=>b.setAttribute('aria-label',T('p.help_open')));
}

$('#hwSearch').addEventListener('input',render);
drawScope(); drawRemaining(); render();
</script>
</body>
</html>
