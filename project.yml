name: BatteryMonitor
options:
  bundleIdPrefix: com.stephen
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.6"
  createIntermediateGroups: true
  # Base language; per-locale bundle names live in BatteryMonitor/<lang>.lproj/InfoPlist.strings
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

targets:
  BatteryMonitor:
    type: application
    platform: macOS
    sources:
      - path: BatteryMonitor
        excludes:
          - "**/.DS_Store"
      # 语言包与 app 源码隔离。folder reference 才能在 bundle 里保住 Languages/
      # 目录结构（普通 json 会被拍平到 Resources/ 根）；也让新增语言只需丢一个
      # JSON 文件，不用改 Swift 也不用重跑 xcodegen。
      - path: Localization/Languages
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stephen.BatteryMonitor
        PRODUCT_NAME: BatteryMonitor
        MARKETING_VERSION: "1.2.0"
        CURRENT_PROJECT_VERSION: "4"
        CODE_SIGN_ENTITLEMENTS: BatteryMonitor/BatteryMonitor.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 6WLUSLD79F
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.utilities"
        # Fallback for locales outside the 10 shipped .lproj bundles — must stay English
        INFOPLIST_KEY_CFBundleDisplayName: "Battery Monitor"
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Stephen. All rights reserved."
        # The app does not implement or ship non-exempt encryption.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: NO
    entitlements:
      path: BatteryMonitor/BatteryMonitor.entitlements
      properties:
        com.apple.security.app-sandbox: true
