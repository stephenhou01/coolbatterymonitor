e) divided by (design minus reserve), reverse-checked against this Mac. It is verified only here and is not a published Apple formula.", "hw.n.health_raw": "不做任何預留修正的純物理比值。低於系統設定顯示的數字——兩者在各自定義下都對。", "hw.n.design_cycles": "剩餘壽命應以此為基準。用當前容量衰減做線性外推會在磨合期嚴重高估衰減速度。", "hw.n.weighted_ra": "Apple 未公開合格範圍。它隨時間的增長趨勢可靠，單看絕對值不可靠。", "hw.n.min_pack_voltage": "歷史上真正達到過的最低組電壓——截止點在哪裡的實測錨點。", "hw.m.dod": "當前放電深度", "hw.m.nominal": "標稱容量", "hw.m.smoothed_amperage": "平滑後電流", "hw.m.instant_amperage": "瞬時電流", "hw.m.virtual_temp": "含熱模型補償", "hw.m.adapter_watts": "充電器額定功率", "hw.m.charge_v_limit": "充電電壓上限", "hw.m.charge_i_limit": "充電電流上限", "hw.m.not_charging_reason": "不充電原因位遮罩", "hw.m.system_load": "系統負載功耗", "hw.m.battery_power": "電池功率流向", "hw.m.power_in": "市電輸入功率", "hw.m.gauge_fw": "電量計固件版本", "hw.m.chem_id": "電芯化學體系", "hw.m.flash_writes": "Flash 寫入次數", "hw.m.pf_status": "0 表示無故障", "hw.m.cell_disconnect": "電芯斷連次數", "hw.m.machine_model": "機型標識", "hw.m.temp_min": "歷史最低溫度", "hw.m.max_charge_current": "歷史最大充電電流", "hw.m.max_discharge_current": "歷史最大放電電流", "hw.m.max_pack_voltage": "歷史最高組電壓", "hw.m.temp_samples": "溫度採樣次數", "hw.m.daily_max_soc": "今日最高電量", "hw.m.daily_min_soc": "今日最低電量", "hw.n.ac_only": "電池供電時瞬時遙測為 0——這一行只在插電時出現。", "hw.n.charge_i_limit": "滿充保持時和剛插上電時也會是 0——單憑它不能判斷充電被限流。", "hw.n.not_charging_reason": "位含義無公開文件，所以我們只展示原始值，不據此下任何結論。", "hw.n.temp_unit": "標度因平台而異：Apple Silicon 是 centi-°C，部分 Intel 機是 deci-°C。我們按數量級判斷。", "hw.n.temp_avg": "注意標度混用：同一個子字典裡 Average 是 deci-°C，而 Min/Max 是直接 °C。", "hw.n.max_discharge": "本來就是帶符號的負整數，不需要做補碼轉換。", "hw.n.total_runtime": "語義不明：本機的值遠低於牆鐘時長，所以我們不拿它推斷電池年齡。", "hw.n.daily_soc": "只有當天快照——電量計不存歷史，週級資料必須由本 app 自己累積。", "hw.n.system_power": "直接就是瓦特，而且電池供電時也有值——功耗分析的首選資料源。", "stat.temperature": "電池溫度", "stat.cycles": "循環次數", "stat.health": "健康度", "stat.adapter": "配接器", "gauge.ac": "已連接電源", "gauge.battery": "使用電池", "rt.voltage": "電壓", "rt.amperage": "電流", "rt.power": "功率", "rt.temperature": "溫度", "rt.percent": "電量", "rt.title": "即時監控", "_name": "繁體中文", "p.menu_preview": "Menu bar preview", "p.menu_time": "Time until empty", "p.menu_unplug": "Estimated after unplugging", "p.menu_unplug_short": "unplug ≈", "p.menu_direct": "Direct macOS value · click the pill to collapse", "p.menu_forecast": "Unplug estimate for the current Mac state · not system history", "p.menu_waiting": "Waiting for macOS time estimate", "p.menu_open": "Open full dashboard", "p.menu_settings": "Settings", "p.menu_close": "Close menu bar panel", "p.seg_now": "In there now", "p.seg_used": "Used", "p.seg_now_d": "<strong>Like the water left in the tank right now.</strong> Using the Mac drains it; plugging in fills it again.", "p.derive": "Consumer view: design {d} − current full charge {f} = long-term loss {loss}; current full charge {f} − current charge {c} = used this time {used}.<br>Deep diagnosis: gauge Qmax {q} is only for cell analysis and does not enter the main breakdown above.", "p.where_title": "Where your capacity went", "p.where_head": "Designed for {a} mAh, now fills to {b}, with {c} left right now", "p.design_capacity": "Original design capacity", "p.current_max": "Maximum when full now", "p.current_actual": "Actually left right now", "p.used_since_full": "Used since the last full charge", "p.permanent_loss": "Long-term capacity loss", "p.capacity_sum": "Whole bar = left now + used this charge + long-term loss = {design} mAh design capacity", "p.current_actual_desc": "Charge physically in the battery now. It falls with use and returns when charged.", "p.used_since_full_desc": "Consumed since the most recent full charge. It means “used this time” and returns as usable charge after charging.", "p.used_zero_desc": "It is zero because the battery is full now. This grows after unplugging and using the Mac.", "p.permanent_loss_desc": "The part current full-charge capacity is below the original design. Normal charging does not refill it.", "p.eq_capacity_title": "How much the battery can hold now", "p.eq_capacity_sub": "Compared with when it was new", "p.eq_usage_title": "How much has been used this charge", "p.eq_usage_sub": "This can be refilled by charging", "p.seg_use": "Actually usable", "p.seg_un": "Unreachable", "p.seg_age": "Lost to ageing", "p.card_now": "Left right now", "p.card_use": "Usable when full", "p.card_un": "Still there, out of reach", "p.card_age": "Actually lost to ageing", "p.seg_use_d": "<strong>Like the part of the tank you can really fill and drain.</strong> The menu-bar 0–100% moves within this usable portion.", "p.seg_un_d": "<strong>Like water below the reach of a straw.</strong> The charge is still there, but the Mac shuts down before voltage becomes unsafe.", "p.seg_age_d": "<strong>Like the tank itself becoming slightly smaller.</strong> Charging cannot restore this part; it is currently only a small slice of the original capacity.", "p.why_deeper": "How are these capacities calculated? View technical details", "p.ra_legend": "Internal resistance vs charge level", "p.ra_outlier": "Endpoint under-sampled — excluded", "p.ra_take": "Resistance climbs as charge falls, reaching {x} the mid-range level near empty. Since voltage = open-circuit − current×resistance, high resistance collapses the terminal voltage before that last charge can be drawn — so the gauge excludes it from usable capacity.", "p.dual_head": "Each point records the time remaining reported by macOS; the line only connects system readings", "p.split_v": "Voltage · what the cells give", "p.split_i": "Current · what the system draws", "p.split_note": "Voltage is set by cell chemistry and charge level — slow-moving and outside your control. <b>Only the current is yours to change</b>: closing heavy processes or dimming the display cuts the current term. Saving power physically means pulling less current.", "p.read_title": "Healthy ranges and high/low effects", "p.t_ok": "Normal", "p.t_warn": "Elevated", "p.t_bad": "Too hot", "p.t_lifeavg": "Your lifetime average", "p.t_hist": "All-time range", "p.t_today": "Today's range", "p.t_vs": "vs your normal", "p.collecting": "Collecting", "p.t_impact": "<b>Impact:</b> below 35°C does essentially no harm; 35–45°C measurably accelerates capacity fade; sustained above 45°C causes real damage. Cold does not permanently harm the cells but temporarily reduces available power. Target: <b>under 35°C</b>.", "p.p_low": "Below your normal", "p.p_mid": "About normal", "p.p_high": "Above your normal", "p.p_base": "Your long-run baseline", "p.p_ratio": "vs baseline", "p.p_energy": "Usable energy", "p.p_theory": "Runtime at this draw", "p.p_impact": "<b>The reference is you</b>, not an industry average — the baseline comes from over a hundred thousand samples on this machine. <b>Impact:</b> at your normal draw you get {a}; compiling or rendering (~25W) drops it to {b}; full load (~45W) leaves {c}.", "p.cadence": "The gauge refreshes only every ~30–60 s and holds its value in between — hence steps, not a smooth curve. It is a smoothed average, not an instantaneous reading.", "p.scen_title": "What you do decides how fast it drains", "p.scen_sub": "Measured on this machine. The app keeps recording and will fill in your own habitual scenarios.", "p.scen_now": "Now", "p.scen_idle": "Idle / reading", "p.scen_full": "Full-core compile", "p.scen_measured": "measured", "p.scen_note": "Not a hypothetical — measured just now by running a full-core load on this machine: power {a} → {b}, time left {c} → {d} min. <b>Everything you do sits on this curve.</b>", "p.t_cadence": "Refresh cadence", "p.t_histband": "All-time band", "p.p_peak": "Your all-time peak draw", "p.tb_freeze": "Charging below freezing plates metallic lithium and causes permanent damage. Discharging is safe but capacity shrinks sharply and temporarily.", "p.tb_cold": "Internal resistance rises; available power and runtime drop temporarily. No permanent harm — it recovers as it warms up.", "p.tb_ideal": "The sweet spot. Ageing runs at its slowest and neither charging nor discharging is restricted.", "p.tb_warm": "Ageing starts to accelerate. Rule of thumb: every extra 10 °C roughly doubles the rate of capacity fade.", "p.tb_hot": "Real damage. The system will usually throttle or limit charging to protect itself; sustained exposure here markedly shortens life.", "p.t_arrhenius": "<b>Target 15–35 °C.</b> Rule of thumb (Arrhenius): every 10 °C rise roughly doubles the fade rate — a battery living at 35 °C ages about twice as fast as one at 25 °C. <b>Note:</b> Apple publishes no cell-temperature thresholds; these bands come from general lithium-ion literature, not vendor specs.", "p.spec_title": "Metric reference · read it like a blood panel", "p.spec_sub": "Each metric gets a reference range, where you sit, and what high or low actually does — plus where that range came from.", "p.range": "Reference range", "p.src_apple": "Apple's own spec", "p.src_personal": "Your own history", "p.src_lit": "General Li-ion literature (not vendor spec)", "p.src_none": "⚠️ No authoritative range exists; this is a conservative guess. What is reliable is its trend over time.", "p.cb_ok": "Cells well matched — no single cell holding the pack back", "p.cb_mid": "Drifting apart. In series the weakest cell caps the pack, so a wider spread wastes more", "p.cb_bad": "Clearly unbalanced. Usable capacity is dragged down by the weakest cell — usually a sign one cell has degraded", "p.cb_cells": "Per-cell voltage", "p.ra_ok": "Good power delivery — voltage holds up under heavy load", "p.ra_mid": "Resistance rising. Bigger voltage sag under load means less usable capacity and more heat", "p.ra_bad": "High resistance. Heavy draw can trigger low-voltage shutdowns, and the extra heat accelerates ageing — a feedback loop", "p.ra_cells": "Per-cell resistance", "p.cy_ok": "Plenty of headroom. Against Apple's 1000-cycle rating you are nowhere near the end", "p.cy_mid": "Past halfway. Capacity fade usually flattens here, though the absolute number keeps falling", "p.cy_bad": "Near the rated end. Fade and resistance rise both accelerate from here — worth planning a replacement", "p.hp_ok": "Healthy. Runtime is close to what it was new", "p.hp_mid": "Some fade but still normal. Shorter runtime is noticeable yet everyday use is fine", "p.hp_bad": "Below 80% — Apple's own threshold for “service recommended”. macOS may start prompting", "p.pw_low": "Below your normal — you will get more runtime than usual", "p.pw_mid": "About your normal level", "p.pw_high": "Above normal. Runtime will be noticeably shorter than you are used to", "p.pw_max": "Near full load. The battery will not last long like this, and the heat accelerates ageing", "p.pv_ok": "Within the range this pack has historically operated in", "p.pv_low": "Below the all-time low. Close to cutoff — the system may shut down to protect the cells", "p.pv_high": "Above the all-time high — normally only seen at the instant of full charge", "p.unlock_title": "It keeps learning your battery", "p.unlock_head": "No setup or studying required — just use your Mac and more answers appear", "p.unlock_sub": "Minutes explain what is happening now, hours reveal today's pattern, and days begin shaping a profile unique to you. Every session makes the answers more personal.", "p.ul_now": "Right away", "p.ul_minutes": "After a few minutes", "p.ul_hours": "After a few hours", "p.ul_day": "After a day", "p.ul_days": "After a few days", "p.ul_longer": "Keep using it", "p.ul_0": "Health & capacity overview", "p.ul_0d": "See health, where capacity went, and lifetime extremes immediately", "p.ul_min": "Power & runtime together", "p.ul_mind": "See how long the battery should last at your current usage", "p.ul_hour": "Today's operating range", "p.ul_hourd": "Today's temperature and power ranges begin to take shape", "p.ul_1d": "First personal scenarios", "p.ul_1dd": "Starts separating light work, video, and heavy-load behavior", "p.ul_3": "Your usage profile", "p.ul_3d": "Learns charging habits and which scenarios affect runtime most", "p.ul_more": "Causes & long-term trends", "p.ul_mored": "Richer history explains why runtime changes and how this battery is ageing", "p.unlock_note": "Leave it running quietly in the background. No special test is needed and it will not interrupt you. It says “still learning” until there is enough evidence for a conclusion.", "p.learn_summary": "What else can this metric tell me over time?", "p.learn_intro": "No special test is needed. Leave the app in the background; it says “still learning” until there is enough evidence.", "p.learn_minutes": "See how current power changes affect time remaining.", "p.learn_hours": "Build today's ranges for power, temperature, and time remaining.", "p.learn_days": "Recognize common scenarios and explain which usage patterns affect runtime most.", "p.spec_metric": "Metric", "p.spec_current": "Current", "p.spec_reading": "What it means now", "p.spec_bands": "What each range means", "p.spec_source": "Range source", "p.spec_source_note": "Reference ranges are not treated as one universal truth: Apple specs, your own history, and general Li-ion research are labelled separately.", "p.spec_other_title": "Four other key metrics", "p.spec_other_sub": "The top only shows health, power, and temperature. Here the four remaining live values are compared directly with ranges, history, and high/low effects.", "p.good_range": "Healthy range", "p.history_extreme": "Historical range", "p.history_peak": "Historical peak", "p.history_learning": "Historical range is still learning", "p.cumulative_no_extreme": "Cumulative metric — no high/low extreme", "p.low_effect": "When low", "p.high_effect": "When high", "p.health_low_short": "Shorter runtime; below 80% may trigger service advice", "p.health_high_short": "Runtime stays closer to new", "p.cycle_low_short": "Less cumulative use", "p.cycle_high_short": "Near rated life; judge together with capacity", "p.temp_low_short": "Runtime and power drop temporarily", "p.temp_high_short": "More heat and faster ageing", hed benchmark × this Mac", "p.runtime_audit_title": "Why can an official 15 hours become only a few hours now?", "p.audit_official": "Apple new-battery wireless web test", "p.audit_same_load": "This battery at the same light workload", "p.audit_actual": "Actual system runtime now", "p.audit_capacity_note": "Capacity effect: about {hours} hours below new", "p.audit_load_note": "Workload effect: about {hours} more hours lost", "p.audit_cause": "Main cause: current workload", "p.audit_cause_body": "Current power is about {ratio}× the implied average in Apple's wireless-web test. 100% means today's capacity is full, not that the Mac is running the official light workload.", "p.audit_test_config": "Apple test system", "p.audit_your_config": "Your Mac", "p.audit_conditions": "Wireless web: 25 websites over Wi-Fi; display at 8 clicks from bottom and keyboard backlight off.", "p.audit_method": "Method: 53.8Wh ÷ 15h ≈ 3.59W average for the official web test; compare that with this battery's scaled full energy and system power.", "p.help_open": "View definition and formula", "p.help_title": "Where does this metric come from?", "p.help_current": "Current result", "p.help_raw": "Lowest-level input fields", "p.help_formula": "Formula", "p.help_substitution": "Substitute this Mac's values", "p.help_source": "Source and reliability", "p.help_direct": "No formula: read directly from the system field.", "p.help_model_spec": "System model identifier matched to Apple's published specification.", "p.help_derived": "Derived from raw system fields; not a same-named value returned directly by IOKit.", "p.help_close": "Close", "hw.group.runtime": "Runtime and system estimates", "p.hw_group_runtime": "Time remaining, time to full, and the post-wake invalid window", "hw.group.resistance": "Resistance and discharge curve", "p.hw_group_resistance": "Cell resistance and susceptibility to voltage sag at low charge", "hw.m.current_capacity": "System charge percentage", "hw.n.current_capacity": "User-facing 0–100% on Apple Silicon; capacity math should use AppleRawCurrentCapacity.", "hw.m.fcc_comp": "Full-charge capacity compensation copies", "hw.n.fcc_comp": "FccComp1/FccComp2 equal AppleRawMaxCapacity on this Mac and serve as redundant checks.", "hw.m.chemical_ra": "Chemical weighted resistance", "hw.n.chemical_ra": "Zero on this Mac, treated as unavailable and excluded from conclusions.", "hw.m.cell_wom": "Auxiliary cell-health field", "hw.n.cell_wom": "Only two zero entries for a three-cell pack; cardinality mismatch makes it unusable for scoring.", "hw.m.time_remaining": "Gauge time-remaining estimate", "hw.n.time_remaining": "TimeRemaining and AvgTimeToEmpty come directly from the gauge; 65535 means unavailable, not minutes.", "hw.m.time_to_full": "Estimated time to full", "hw.n.time_to_full": "Valid only while charging and ready; 65535 means unavailable or not applicable.", "hw.m.invalid_wake": "Post-wake estimate invalid window", "hw.n.invalid_wake": "Runtime estimates may be unstable for this many seconds after wake.", "hw.m.system_input": "Adapter input power/voltage/current", "hw.m.adapter_efficiency_loss": "Raw adapter-efficiency loss", "hw.n.adapter_efficiency_loss": "Instant values may be zero or negative and cumulative scaling is unknown; do not derive charging efficiency.", "hw.m.accumulated_avg_power": "Telemetry accumulated average power", "hw.n.accumulated_avg_power": "AccumulatedSystemLoad ÷ SystemLoadAccumulatorCount ÷ 1000, useful as this Mac's baseline.", "hw.m.wall_energy": "Raw accumulated wall-energy value", "hw.n.wall_energy": "Unit and scaling are undocumented; preserve only as a raw diagnostic value.", "hw.m.qmax_disqualification": "Qmax disqualification reason code", "hw.n.qmax_disqualification": "Zero is only the current raw code; nonzero may invalidate calibration, while bit meanings remain undocumented.", "hw.m.daily_soc_pair": "Daily maximum/minimum charge", "hw.m.adapter_contract": "Negotiated PD voltage/current", "hw.m.adapter_menu": "Negotiable PD profiles", "hw.n.adapter_menu": "Available only on AC; the highest profile reflects currently advertised negotiation capability.", "hw.m.adapter_description": "Adapter interface type", "hw.m.charge_limits": "Charging voltage/current limits", "hw.m.carrier_mode": "Carrier-mode charge thresholds and status", "hw.n.carrier_mode": "High/Low are carrier thresholds; Status needs system context and is not directly the 80% charge limit.", "hw.m.port_cycles": "Port-controller attach/detach counts", "hw.n.port_cycles": "Array order cannot safely map to left/right ports, so controllers are numbered. Abnormal growth may indicate contact issues.", "hw.m.port_failures": "Port capability mismatch/election failure", "hw.n.port_failures": "Nonzero values can point to cable, adapter, or PD negotiation issues; values are shown per controller.", "hw.m.chem_ids": "Cell chemistry and algorithm chemistry IDs", "hw.m.manufacture_batch": "Raw manufacturing batch integer", "hw.n.manufacture_batch": "The integer decodes to an ASCII batch code, not a verified calendar date.", "hw.m.first_use": "Raw first-use date", "hw.n.first_use": "Zero on this Mac, so true battery age cannot be obtained from it.", "hw.m.installed": "Battery installed/built-in state", "hw.m.temperature": "Measured cell temperature", "hw.m.model_design_energy": "Model-rated design energy", "hw.n.model_design_energy": "Rated Wh matched to Apple's specification after identifying the system model; it is not calculated from current voltage.", "hw.m.current_full_energy": "Current full-charge energy (scaled)", "hw.n.current_full_energy": "Model design Wh × current full-charge capacity ÷ design capacity, keeping one consistent scale for today's full battery.", "p.forecast_only": "The dashed line is a current forecast and is not saved as system history", "p.snapshot": "Snapshot", "p.snapshot_note": "This HTML prototype shows a system snapshot captured when generated; the app will update live", "p.usage_basis": "Reported directly by macOS; this product does not recalculate it from power", "p.system_charge": "macOS charge", "p.priority_health": "Overall battery health", "p.priority_power": "Current computer power use", "p.priority_temp": "Current battery temperature", "p.tagline": "Battery Monitor", "p.remaining": "Time remaining", "p.src_note": "Time remaining reported directly by macOS; this product does not recalculate it from power", "p.why_title": "Why the last 20% drains so fast", "p.why_sub": "Your battery is never “used up” — the voltage collapses first", "p.aha_label": "Aha moment", "p.health_two_title": "Why is health {sys}% while usable capacity is {raw}%?", "p.health_two_body": "<strong>It is like measuring one tank with two rulers.</strong> The system score accounts for the safety reserve; the capacity bar shows what can actually be filled now. Both are useful, but trends need the same ruler.", "p.health_two_formula": "{sys}% system health score · {raw}% direct capacity ratio", "p.loss_split_title": "Total gap {gap} mAh = unreachable + aged", "p.loss_split_body": "<strong>Using the same tank analogy:</strong> {un} mAh is like water below the straw—still there. Only {aged} mAh is the tank itself becoming smaller. Together they make the gap from new.", "p.loss_split_formula": "{gap} mAh total gap = {un} mAh out of reach + {aged} mAh aged", "p.use_loss_title": "Energy used today is not battery ageing", "p.use_loss_body": "<strong>Think of water in a cup versus the size of the cup.</strong> The {used} mAh used this time returns when charged; the {loss} mAh long-term loss is the cup becoming smaller than when new.", "p.use_loss_formula": "Used this time {used} mAh · long-term loss {loss} mAh · do not add them", "p.aging_judge_title": "Do not judge ageing from cycle count alone", "p.aging_judge_lead": "Cycle count is an odometer: it shows use, not health by itself.", "p.aging_judge_body": "What matters together is whether full-charge capacity keeps falling, resistance rises, cells drift apart, and high temperature becomes common. Those trends explain a real runtime decline.", "p.aging_proof": "This Mac has {cyc} cycles; current full-charge capacity is {loss} below design. The {per}-per-cycle figure is only a retrospective average—not measured loss per cycle and not a life forecast.", "p.time_jump_title": "Time remaining can jump without being wrong", "p.time_jump_lead": "Start compiling and it falls; stop to read and it rises.", "p.time_jump_body": "The charge did not come back. macOS repeatedly re-estimates how long the current pattern can continue. Power affects the estimate, but this page records the system value directly instead of calculating another answer from power.", "p.time_jump_proof": "Definition: on battery, record macOS time remaining. On power, when no system value exists, show stored energy divided by current power as a clearly labelled unplug estimate.", "p.geek": "Complete hardware metrics with per-item explanations", "p.hw_intro_title": "Start with the answer, then inspect raw fields when needed", "p.hw_intro_body": "This prototype includes every raw metric in the supplied list, plus the published model specification and necessary derivations. Each item has this Mac's current value, unit, explanation, range, and reliability; ? expands composite rows to their lowest-level fields.", "p.hw_search": "Search field, meaning, or group: temperature / capacity / charger", "p.hw_no_results": "No matching metric. Try a shorter search term.", "p.hw_group_cells": "Cell balance, depth of discharge, and permanent faults", "p.hw_group_capacity": "Design, full charge, and cycle life", "p.hw_group_electrical": "Live voltage, current, power, and temperature", "p.hw_group_charger": "Adapter capability and charging limits", "p.hw_group_telemetry": "Energy flow between system, adapter, and battery", "p.hw_group_identity": "Battery, gauge, firmware, and model identity", "p.hw_group_lifetime": "Lifetime extremes and capacity-calibration confidence", "p.hw_group_derived": "Derived answers from raw fields", "p.footer": "Definitions · Charge and time remaining prefer the user-visible macOS values; hardware values come from this Mac's IOKit snapshot ({time}).<br>Derived values · Health, capacity splits, and the on-power unplug estimate are labelled as derived or forecast and never mixed into system history.<br>Coverage · {fields} explained metrics / {groups} groups / {langs} languages; no fabricated long-term trends.", "p.hover_hint": "Click ? beside any metric for raw fields, formula, substitution, and reliability", "p.unusable_ex": "The part still included in chemical Qmax but excluded from usable full-charge FCC, derived by subtracting two gauge readings.", "p.nonlinear": "Do not extrapolate: lithium fade is fast early, then flattens"}, "es": {"app.title": "Monitor de Batería", "insight.section.health": "Diagnóstico de salud", "insight.section.power": "Análisis de consumo", "insight.section.hardware": "Datos brutos de hardware", "insight.level.good": "BUENO", "insight.level.excellent": "EXCELENTE", "insight.factor.capacity": "Retención de capacidad", "insight.factor.cycles": "Uso de ciclos", "insight.factor.balance": "Equilibrio de celdas", "insight.factor.resistance": "Resistencia interna", "insight.factor.temperature": "Historial de temperatura", "insight.factor.fault": "Autodiagnóstico de hardware", "insight.factor.fault_none": "Sin fallos", "insight.life.label": "Vida restante", "insight.age.label": "Edad de la batería", "insight.estimated": "estimado", "insight.power.light": "Uso ligero", "insight.power.idle": "Inactivo · muy eficiente", "insight.expand_factors": "Ver base", "hw.field": "Campo", "hw.value": "Valor", "hw.unit": "Unidad", "hw.meaning": "Significado", "hw.rel": "Conf", "hw.rel.verified": "Verificado en hardware real", "hw.rel.conditional": "Con condiciones: ver nota", "hw.rel.questionable": "Semántica o unidad sin resolver", "hw.rel.derived": "Calculado por nosotros", "hw.group.cells": "Celdas", "hw.group.capacity": "Capacidad y vida", "hw.group.electrical": "Eléctrico", "hw.group.charger": "Cargador", "hw.group.telemetry": "Telemetría de consumo", "hw.group.identity": "Identidad", "hw.group.lifetime": "Estadísticas de vida", "hw.group.derived": "Métricas derivadas", "hw.m.cell_delta": "Diferencia entre celdas", "hw.m.weighted_ra": "Resistencia interna", "hw.m.qmax": "Capacidad medida", "hw.m.design_capacity": "Capacidad de diseño", "hw.m.raw_max": "Capacidad a plena carga", "hw.m.raw_current": "Carga disponible ahora", "hw.m.reserve": "Capacidad reservada", "hw.m.cycles": "Ciclos usados", "hw.m.design_cycles": "Vida útil nominal", "hw.m.pack_voltage": "Voltaje del pack", "hw.m.system_power": "Potencia total del sistema", "hw.m.temp_max": "Máxima histórica", "hw.m.temp_avg": "Media histórica", "hw.m.min_pack_voltage": "Voltaje mín. del pack", "hw.m.calib_age": "Ciclos desde la calibración", "hw.m.unusable": "Presente pero inaccesible", "hw.m.deficit_cycle": "Historical full-charge gap per cycle", "hw.m.deficit_total": "Total design-to-full-charge gap", "hw.m.health_system": "Prototype system-aligned health", "hw.m.health_raw": "Valor bruto sin reserva", "hw.m.topology": "Topología de celdas", "hw.m.serial": "Nº de serie", "hw.m.gauge_chip": "Chip medidor", "hw.n.qmax": "Capacidad química por celda, aprendida entre dos anclas de voltaje en circuito abierto. En serie: la capacidad del pack es la celda más débil, no la suma.", "hw.n.cell_voltage": "Celdas en serie: los voltajes se suman, la capacidad no. Su suma equivale al voltaje del pack.", "hw.n.reserve": "Buffer capacity outside the user charge percentage. This prototype uses it in its system-aligned health definition, reverse-verified only on this Mac.", "hw.n.raw_max": "Capacidad a plena carga aprendida por el medidor (= FccComp1/2). No es el total químico: la parte inutilizable ya está descontada.", "hw.n.raw_current": "No se mide directamente: se calcula como FCC × (1 − profundidad de descarga), obtenida por conteo de culombios corregido con voltaje en circuito abierto.", "hw.n.unusable": "Qmax and FCC come from the gauge. “Unreachable” is this prototype's interpretation of Qmax minus FCC, not a directly named gauge field.", "hw.n.deficit_cycle": "A retrospective average from total gap divided by cycles. It mixes chemical fade with currently unreachable capacity, so it is not measured loss per cycle and must not forecast life.", "hw.n.deficit_total": "Design minus FCC. This is not pure ageing; it combines chemical total-capacity fade with currently unreachable capacity and must be split using Qmax minus FCC.", "hw.n.calib_age": "El medidor solo puede reaprender la capacidad cuando la batería reposa lo suficiente para leer el voltaje en circuito abierto. Estar siempre enchufado hace crecer este número y envejece la lectura de salud.", "hw.n.topology": "nSmP significa n en serie y m en paralelo. En serie los voltajes se suman, la capacidad no: la celda más débil limita el pack.", "hw.n.health_system": "This prototype uses (FCC + reserve) divided by (design minus reserve), reverse-checked against this Mac. It is verified only here and is not a published Apple formula.", "hw.n.health_raw": "Proporción física pura sin ajuste de reserva. Menor que la de Ajustes: ambas son correctas según su definición.", "hw.n.design_cycles": "Úsalo como base para la vida restante. Extrapolar linealmente la pérdida actual sobrestima mucho el desgaste durante el rodaje.", "hw.n.weighted_ra": "Apple no publica un rango aceptable. La tendencia en el tiempo es fiable; un valor aislado no.", "hw.n.min_pack_voltage": "El voltaje mínimo del pack alcanzado: ancla empírica de dónde está realmente el corte.", "hw.m.dod": "Profundidad de descarga", "hw.m.nominal": "Capacidad nominal", "hw.m.smoothed_amperage": "Corriente suavizada", "hw.m.instant_amperage": "Corriente instantánea", "hw.m.virtual_temp": "Con modelo térmico", "hw.m.adapter_watts": "Potencia nominal", "hw.m.charge_v_limit": "Límite de voltaje", "hw.m.charge_i_limit": "Límite de corriente", "hw.m.not_charging_reason": "Máscara de motivo", "hw.m.system_load": "Carga del sistema", "hw.m.battery_power": "Flujo de potencia", "hw.m.power_in": "Potencia de entrada", "hw.m.gauge_fw": "Firmware del medidor", "hw.m.chem_id": "Química de celdas", "hw.m.flash_writes": "Escrituras en flash", "hw.m.pf_status": "0 = sin fallo", "hw.m.cell_disconnect": "Desconexiones de celda", "hw.m.machine_model": "Modelo de equipo", "hw.m.temp_min": "Mínima histórica", "hw.m.max_charge_current": "Corriente máx. de carga", "hw.m.max_discharge_current": "Corriente máx. de descarga", "hw.m.max_pack_voltage": "Voltaje máx. del pack", "hw.m.temp_samples": "Muestras de temperatura", "hw.m.daily_max_soc": "Máximo de hoy", "hw.m.daily_min_soc": "Mínimo de hoy", "hw.n.ac_only": "La telemetría instantánea es 0 con batería: esta fila solo aparece conectado a la corriente.", "hw.n.charge_i_limit": "También es 0 al mantener carga completa o justo tras conectar: por sí solo no indica limitación de carga.", "hw.n.not_charging_reason": "Los bits no están documentados: mostramos el valor bruto sin sacar conclusiones.", "hw.n.temp_unit": "La escala varía: Apple Silicon usa centi-°C y algunos Mac Intel deci-°C. Lo decidimos por magnitud.", "hw.n.temp_avg": "Ojo con las escalas mixtas: en el mismo diccionario Average está en deci-°C y Min/Max en °C.", "hw.n.max_discharge": "Ya es un entero negativo con signo: no requiere conversión en complemento a dos.", "hw.n.total_runtime": "Semántica poco clara: en este equipo es demasiado bajo para ser tiempo real, así que no lo usamos para estimar la edad.", "hw.n.daily_soc": "Solo la instantánea de hoy: el medidor no guarda historial, así que los datos semanales los acumula esta app.", "hw.n.system_power": "Ya está en vatios y sigue activo con batería: la fuente preferida para el análisis de consumo.", "stat.temperature": "Temperatura", "stat.cycles": "Ciclos", "stat.health": "Salud", "stat.adapter": "Adaptador", "gauge.ac": "Corriente", "gauge.battery": "En batería", "rt.voltage": "Voltaje", "rt.amperage": "Corriente", "rt.power": "Potencia", "rt.temperature": "Temp", "rt.percent": "Nivel", "rt.title": "Monitor en vivo", "_name": "Español", "p.menu_preview": "Menu bar preview", "p.menu_time": "Time until empty", "p.menu_unplug": "Estimated after unplugging", "p.menu_unplug_short": "unplug ≈", "p.menu_direct": "Direct macOS value · click the pill to collapse", "p.menu_forecast": "Unplug estimate for the current Mac state · not system history", "p.menu_waiting": "Waiting for macOS time estimate", "p.menu_open": "Open full dashboard", "p.menu_settings": "Settings", "p.menu_close": "Close menu bar panel", "p.seg_now": "In there now", "p.seg_used": "Used", "p.seg_now_d": "<strong>Like the water left in the tank right now.</strong> Using the Mac drains it; plugging in fills it again.", "p.derive": "Consumer view: design {d} − current full charge {f} = long-term loss {loss}; current full charge {f} − current charge {c} = used this time {used}.<br>Deep diagnosis: gauge Qmax {q} is only for cell analysis and does not enter the main breakdown above.", "p.where_title": "Where your capacity went", "p.where_head": "Designed for {a} mAh, now fills to {b}, with {c} left right now", "p.design_capacity": "Original design capacity", "p.current_max": "Maximum when full now", "p.current_actual": "Actually left right now", "p.used_since_full": "Used since the last full charge", "p.permanent_loss": "Long-term capacity loss", "p.capacity_sum": "Whole bar = left now + used this charge + long-term loss = {design} mAh design capacity", "p.current_actual_desc": "Charge physically in the battery now. It falls with use and returns when charged.", "p.used_since_full_desc": "Consumed since the most recent full charge. It means “used this time” and returns as usable charge after charging.", "p.used_zero_desc": "It is zero because the battery is full now. This grows after unplugging and using the Mac.", "p.permanent_loss_desc": "The part current full-charge capacity is below the original design. Normal charging does not refill it.", "p.eq_capacity_title": "How much the battery can hold now", "p.eq_capacity_sub": "Compared with when it was new", "p.eq_usage_title": "How much has been used this charge", "p.eq_usage_sub": "This can be refilled by charging", "p.seg_use": "Actually usable", "p.seg_un": "Unreachable", "p.seg_age": "Lost to ageing", "p.card_now": "Left right now", "p.card_use": "Usable when full", "p.card_un": "Still there, out of reach", "p.card_age": "Actually lost to ageing", "p.seg_use_d": "<strong>Like the part of the tank you can really fill and drain.</strong> The menu-bar 0–100% moves within this usable portion.", "p.seg_un_d": "<strong>Like water below the reach of a straw.</strong> The charge is still there, but the Mac shuts down before voltage becomes unsafe.", "p.seg_age_d": "<strong>Like the tank itself becoming slightly smaller.</strong> Charging cannot restore this part; it is currently only a small slice of the original capacity.", "p.why_deeper": "How are these capacities calculated? View technical details", "p.ra_legend": "Internal resistance vs charge level", "p.ra_outlier": "Endpoint under-sampled — excluded", "p.ra_take": "Resistance climbs as charge falls, reaching {x} the mid-range level near empty. Since voltage = open-circuit − current×resistance, high resistance collapses the terminal voltage before that last charge can be drawn — so the gauge excludes it from usable capacity.", "p.dual_head": "Each point records the time remaining reported by macOS; the line only connects system readings", "p.split_v": "Voltage · what the cells give", "p.split_i": "Current · what the system draws", "p.split_note": "Voltage is set by cell chemistry and charge level — slow-moving and outside your control. <b>Only the current is yours to change</b>: closing heavy processes or dimming the display cuts the current term. Saving power physically means pulling less current.", "p.read_title": "Healthy ranges and high/low effects", "p.t_ok": "Normal", "p.t_warn": "Elevated", "p.t_bad": "Too hot", "p.t_lifeavg": "Your lifetime average", "p.t_hist": "All-time range", "p.t_today": "Today's range", "p.t_vs": "vs your normal", "p.collecting": "Collecting", "p.t_impact": "<b>Impact:</b> below 35°C does essentially no harm; 35–45°C measurably accelerates capacity fade; sustained above 45°C causes real damage. Cold does not permanently harm the cells but temporarily reduces available power. Target: <b>under 35°C</b>.", "p.p_low": "Below your normal", "p.p_mid": "About normal", "p.p_high": "Above your normal", "p.p_base": "Your long-run baseline", "p.p_ratio": "vs baseline", "p.p_energy": "Usable energy", "p.p_theory": "Runtime at this draw", "p.p_impact": "<b>The reference is you</b>, not an industry average — the baseline comes from over a hundred thousand samples on this machine. <b>Impact:</b> at your normal draw you get {a}; compiling or rendering (~25W) drops it to {b}; full load (~45W) leaves {c}.", "p.cadence": "The gauge refreshes only every ~30–60 s and holds its value in between — hence steps, not a smooth curve. It is a smoothed average, not an instantaneous reading.", "p.scen_title": "What you do decides how fast it drains", "p.scen_sub": "Measured on this machine. The app keeps recording and will fill in your own habitual scenarios.", "p.scen_now": "Now", "p.scen_idle": "Idle / reading", "p.scen_full": "Full-core compile", "p.scen_measured": "measured", "p.scen_note": "Not a hypothetical — measured just now by running a full-core load on this machine: power {a} → {b}, time left {c} → {d} min. <b>Everything you do sits on this curve.</b>", "p.t_cadence": "Refresh cadence", "p.t_histband": "All-time band", "p.p_peak": "Your all-time peak draw", "p.tb_freeze": "Charging below freezing plates metallic lithium and causes permanent damage. Discharging is safe but capacity shrinks sharply and temporarily.", "p.tb_cold": "Internal resistance rises; available power and runtime drop temporarily. No permanent harm — it recovers as it warms up.", "p.tb_ideal": "The sweet spot. Ageing runs at its slowest and neither charging nor discharging is restricted.", "p.tb_warm": "Ageing starts to accelerate. Rule of thumb: every extra 10 °C roughly doubles the rate of capacity fade.", "p.tb_hot": "Real damage. The system will usually throttle or limit charging to protect itself; sustained exposure here markedly shortens life.", "p.t_arrhenius": "<b>Target 15–35 °C.</b> Rule of thumb (Arrhenius): every 10 °C rise roughly doubles the fade rate — a battery living at 35 °C ages about twice as fast as one at 25 °C. <b>Note:</b> Apple publishes no cell-temperature thresholds; these bands come from general lithium-ion literature, not vendor specs.", "p.spec_title": "Metric reference · read it like a blood panel", "p.spec_sub": "Each metric gets a reference range, where you sit, and what high or low actually does — plus where that range came from.", "p.range": "Reference range", "p.src_apple": "Apple's own spec", "p.src_personal": "Your own history", "p.src_lit": "General Li-ion literature (not vendor spec)", "p.src_none": "⚠️ No authoritative range exists; this is a conservative guess. What is reliable is its trend over time.", "p.cb_ok": "Cells well matched — no single cell holding the pack back", "p.cb_mid": "Drifting apart. In series the weakest cell caps the pack, so a wider spread wastes more", "p.cb_bad": "Clearly unbalanced. Usable capacity is dragged down by the weakest cell — usually a sign one cell has degraded", "p.cb_cells": "Per-cell voltage", "p.ra_ok": "Good power delivery — voltage holds up under heavy load", "p.ra_mid": "Resistance rising. Bigger voltage sag under load means less usable capacity and more heat", "p.ra_bad": "High resistance. Heavy draw can trigger low-voltage shutdowns, and the extra heat accelerates ageing — a feedback loop", "p.ra_cells": "Per-cell resistance", "p.cy_ok": "Plenty of headroom. Against Apple's 1000-cycle rating you are nowhere near the end", "p.cy_mid": "Past halfway. Capacity fade usually flattens here, though the absolute number keeps falling", "p.cy_bad": "Near the rated end. Fade and resistance rise both accelerate from here — worth planning a replacement", "p.hp_ok": "Healthy. Runtime is close to what it was new", "p.hp_mid": "Some fade but still normal. Shorter runtime is noticeable yet everyday use is fine", "p.hp_bad": "Below 80% — Apple's own threshold for “service recommended”. macOS may start prompting", "p.pw_low": "Below your normal — you will get more runtime than usual", "p.pw_mid": "About your normal level", "p.pw_high": "Above normal. Runtime will be noticeably shorter than you are used to", "p.pw_max": "Near full load. The battery will not last long like this, and the heat accelerates ageing", "p.pv_ok": "Within the range this pack has historically operated in", "p.pv_low": "Below the all-time low. Close to cutoff — the system may shut down to protect the cells", "p.pv_high": "Above the all-time high — normally only seen at the instant of full charge", "p.unlock_title": "It keeps learning your battery", "p.unlock_head": "No setup or studying required — just use your Mac and more answers appear", "p.unlock_sub": "Minutes explain what is happening now, hours reveal today's pattern, and days begin shaping a profile unique to you. Every session makes the answers more personal.", "p.ul_now": "Right away", "p.ul_minutes": "After a few minutes", "p.ul_hours": "After a few hours", "p.ul_day": "After a day", "p.ul_days": "After a few days", "p.ul_longer": "Keep using it", "p.ul_0": "Health & capacity overview", "p.ul_0d": "See health, where capacity went, and lifetime extremes immediately", "p.ul_min": "Power & runtime together", "p.ul_mind": "See how long the battery should last at your current usage", "p.ul_hour": "Today's operating range", "p.ul_hourd": "Today's temperature and power ranges begin to take shape", "p.ul_1d": "First personal scenarios", "p.ul_1dd": "Starts separating light work, video, and heavy-load behavior", "p.ul_3": "Your usage profile", "p.ul_3d": "Learns charging habits and which scenarios affect runtime most", "p.ul_more": "Causes & long-term trends", "p.ul_mored": "Richer history explains why runtime changes and how this battery is ageing", "p.unlock_note": "Leave it running quietly in the background. No special test is needed and it will not interrupt you. It says “still learning” until there is enough evidence for a conclusion.", "p.learn_summary": "What else can this metric tell me over time?", "p.learn_intro": "No special test is needed. Leave the app in the background; it says “still learning” until there is enough evidence.", "p.learn_minutes": "See how current power changes affect time remaining.", "p.learn_hours": "Build today's ranges for power, temperature, and time remaining.", "p.learn_days": "Recognize common scenarios and explain which usage patterns affect runtime most.", "p.spec_metric": "Metric", "p.spec_current": "Current", "p.spec_reading": "What it means now", "p.spec_bands": "What each range means", "p.spec_source": "Range source", "p.spec_source_note": "Reference ranges are not treated as one universal truth: Apple specs, your own history, and general Li-ion research are labelled separately.", "p.spec_other_title": "Four other key metrics", "p.spec_other_sub": "The top only shows health, power, and temperature. Here the four remaining live values are compared directly with ranges, history, and high/low effects.", "p.good_range": "Healthy range", "p.history_extreme": "Historical range", "p.history_peak": "Historical peak", "p.history_learning": "Historical range is still learning", "p.cumulative_no_extreme": "Cumulative metric — no high/low extreme", "p.low_effect": "When low", "p.high_effect": "When high", "p.health_low_short": "Shorter runtime; below 80% may trigger service advice", "p.health_high_short": "Runtime stays closer to new", "p.cycle_low_short": "Less cumulative use", "p.cycle_high_short": "Near rated life; judge together with capacity", "p.temp_low_short": "Runtime and power drop temporarily", "p.temp_high_short": "More heat and faster ageing", "p.power_low_short": "Longer runtime and less heat", "p.power_high_short": "Shorter runtime and more heat", "p.src_none_short": "Trend only", "p.no_fixed_range": "No fixed normal range", "p.id_no_range": "Identifier — no normal range", "p.counter_range": "Cumulative — watch the trend", "p.rated_value": "rated value", "p.chart_time": "Time", "p.chart_hours": "Time remaining", "p.left_axis": "left axis", "p.right_axis": "right axis", "p.chart_waiting": "Waiting for the gauge's runtime estimate", "p.no_estimate_ac": "Connected to power — the gauge is not estimating runtime", "p.remaining_trend": "System time-remaining history", "p.direct_source": "Source: macOS system value", "p.sample_cadence_short": "App: records about every 56 seconds", "p.no_recalc": "Calculation: no power-based recalculation", "p.no_history": "This snapshot has no system runtime history; the app starts recording on battery power", "p.unplug_badge": "Unplug estimate", "p.unplug_kicker": "At the computer's current state, unplugging would give about", "p.unplug_note": "Estimate · expected after unplugging at the computer's current power use", "p.unplug_trend": "Estimated runtime after unplugging", "p.unplug_head": "With no discharge history yet, the dashed line estimates unplugged runtime from the current computer state", "p.unplug_legend": "Unplug estimate · not system history", "p.unplug_method": "Calculation: current stored energy ÷ current power use", "p.full_tank_explain": "A full charge only means the tank is full. Power use is now {ratio}% of your usual level, so it will drain faster.", "p.model_design_energy": "Design energy for this model", "p.current_full_energy": "This battery when full now", "p.energy_in_battery": "Energy remaining now", "p.current_power": "Current power use", "p.current_use_estimate": "At this usage", "p.baseline_compare": "At this Mac's usual {watts}W, the estimate is about {time}. The shorter figure mainly reflects the current workload.", "p.runtime_audit_tag": "Published benchmark × this Mac", "p.runtime_audit_title": "Why can an official 15 hours become only a few hours now?", "p.audit_official": "Apple new-battery wireless web test", "p.audit_same_load": "This battery at the same light workload", "p.audit_actual": "Actual system runtime now", "p.audit_capacity_note": "Capacity effect: about {hours} hours below new", "p.audit_load_note": "Workload effect: about {hours} more hours lost", "p.audit_cause": "Main cause: current workload", "p.audit_cause_body": "Current power is about {ratio}× the implied average in Apple's wireless-web test. 100% means today's capacity is full, not that the Mac is running the official light workload.", "p.audit_test_config": "Apple test system", "p.audit_your_config": "Your Mac", "p.audit_conditions": "Wireless web: 25 websites over Wi-Fi; display at 8 clicks from bottom and keyboard backlight off.", "p.audit_method": "Method: 53.8Wh ÷ 15h ≈ 3.59W average for the official web test; compare that with this battery's scaled full energy and system power.", "p.help_open": "View definition and formula", "p.help_title": "Where does this metric come from?", "p.help_current": "Current result", "p.help_raw": "Lowest-level input fields", "p.help_formula": "Formula", "p.help_substitution": "Substitute this Mac's values", "p.help_source": "Source and reliability", "p.help_direct": "No formula: read directly from the system field.", "p.help_model_spec": "System model identifier matched to Apple's published specification.", "p.help_derived": "Derived from raw system fields; not a same-named value returned directly by IOKit.", "p.help_close": "Close", "hw.group.runtime": "Runtime and system estimates", "p.hw_group_runtime": "Time remaining, time to full, and the post-wake invalid window", "hw.group.resistance": "Resistance and discharge curve", "p.hw_group_resistance": "Cell resistance and susceptibility to voltage sag at low charge", "hw.m.current_capacity": "System charge percentage", "hw.n.current_capacity": "User-facing 0–100% on Apple Silicon; capacity math should use AppleRawCurrentCapacity.", "hw.m.fcc_comp": "Full-charge capacity compensation copies", "hw.n.fcc_comp": "FccComp1/FccComp2 equal AppleRawMaxCapacity on this Mac and serve as redundant checks.", "hw.m.chemical_ra": "Chemical weighted resistance", "hw.n.chemical_ra": "Zero on this Mac, treated as unavailable and excluded from conclusions.", "hw.m.cell_wom": "Auxiliary cell-health field", "hw.n.cell_wom": "Only two zero entries for a three-cell pack; cardinality mismatch makes it unusable for scoring.", "hw.m.time_remaining": "Gauge time-remaining estimate", "hw.n.time_remaining": "TimeRemaining and AvgTimeToEmpty come directly from the gauge; 65535 means unavailable, not minutes.", "hw.m.time_to_full": "Estimated time to full", "hw.n.time_to_full": "Valid only while charging and ready; 65535 means unavailable or not applicable.", "hw.m.invalid_wake": "Post-wake estimate invalid window", "hw.n.invalid_wake": "Runtime estimates may be unstable for this many seconds after wake.", "hw.m.system_input": "Adapter input power/voltage/current", "hw.m.adapter_efficiency_loss": "Raw adapter-efficiency loss", "hw.n.adapter_efficiency_loss": "Instant values may be zero or negative and cumulative scaling is unknown; do not derive charging efficiency.", "hw.m.accumulated_avg_power": "Telemetry accumulated average power", "hw.n.accumulated_avg_power": "AccumulatedSystemLoad ÷ SystemLoadAccumulatorCount ÷ 1000, useful as this Mac's baseline.", "hw.m.wall_energy": "Raw accumulated wall-energy value", "hw.n.wall_energy": "Unit and scaling are undocumented; preserve only as a raw diagnostic value.", "hw.m.qmax_disqualification": "Qmax disqualification reason code", "hw.n.qmax_disqualification": "Zero is only the current raw code; nonzero may invalidate calibration, while bit meanings remain undocumented.", "hw.m.daily_soc_pair": "Daily maximum/minimum charge", "hw.m.adapter_contract": "Negotiated PD voltage/current", "hw.m.adapter_menu": "Negotiable PD profiles", "hw.n.adapter_menu": "Available only on AC; the highest profile reflects currently advertised negotiation capability.", "hw.m.adapter_description": "Adapter interface type", "hw.m.charge_limits": "Charging voltage/current limits", "hw.m.carrier_mode": "Carrier-mode charge thresholds and status", "hw.n.carrier_mode": "High/Low are carrier thresholds; Status needs system context and is not directly the 80% charge limit.", "hw.m.port_cycles": "Port-controller attach/detach counts", "hw.n.port_cycles": "Array order cannot safely map to left/right ports, so controllers are numbered. Abnormal growth may indicate contact issues.", "hw.m.port_failures": "Port capability mismatch/election failure", "hw.n.port_failures": "Nonzero values can point to cable, adapter, or PD negotiation issues; values are shown per controller.", "hw.m.chem_ids": "Cell chemistry and algorithm chemistry IDs", "hw.m.manufacture_batch": "Raw manufacturing batch integer", "hw.n.manufacture_batch": "The integer decodes to an ASCII batch code, not a verified calendar date.", "hw.m.first_use": "Raw first-use date", "hw.n.first_use": "Zero on this Mac, so true battery age cannot be obtained from it.", "hw.m.installed": "Battery installed/built-in state", "hw.m.temperature": "Measured cell temperature", "hw.m.model_design_energy": "Model-rated design energy", "hw.n.model_design_energy": "Rated Wh matched to Apple's specification after identifying the system model; it is not calculated from current voltage.", "hw.m.current_full_energy": "Current full-charge energy (scaled)", "hw.n.current_full_energy": "Model design Wh × current full-charge capacity ÷ design capacity, keeping one consistent scale for today's full battery.", "p.forecast_only": "The dashed line is a current forecast and is not saved as system history", "p.snapshot": "Snapshot", "p.snapshot_note": "This HTML prototype shows a system snapshot captured when generated; the app will update live", "p.usage_basis": "Reported directly by macOS; this product does not recalculate it from power", "p.system_charge": "macOS charge", "p.priority_health": "Overall battery health", "p.priority_power": "Current computer power use", "p.priority_temp": "Current battery temperature", "p.tagline": "Battery Monitor", "p.remaining": "Time remaining", "p.src_note": "Time remaining reported directly by macOS; this product does not recalculate it from power", "p.why_title": "Why the last 20% drains so fast", "p.why_sub": "Your battery is never “used up” — the voltage collapses first", "p.aha_label": "Aha moment", "p.health_two_title": "Why is health {sys}% while usable capacity is {raw}%?", "p.health_two_body": "<strong>It is like measuring one tank with two rulers.</strong> The system score accounts for the safety reserve; the capacity bar shows what can actually be filled now. Both are useful, but trends need the same ruler.", "p.health_two_formula": "{sys}% system health score · {raw}% direct capacity ratio", "p.loss_split_title": "Total gap {gap} mAh = unreachable + aged", "p.loss_split_body": "<strong>Using the same tank analogy:</strong> {un} mAh is like water below the straw—still there. Only {aged} mAh is the tank itself becoming smaller. Together they make the gap from new.", "p.loss_split_formula": "{gap} mAh total gap = {un} mAh out of reach + {aged} mAh aged", "p.use_loss_title": "Energy used today is not battery ageing", "p.use_loss_body": "<strong>Think of water in a cup versus the size of the cup.</strong> The {used} mAh used this time returns when charged; the {loss} mAh long-term loss is the cup becoming smaller than when new.", "p.use_loss_formula": "Used this time {used} mAh · long-term loss {loss} mAh · do not add them", "p.aging_judge_title": "Do not judge ageing from cycle count alone", "p.aging_judge_lead": "Cycle count is an odometer: it shows use, not health by itself.", "p.aging_judge_body": "What matters together is whether full-charge capacity keeps falling, resistance rises, cells drift apart, and high temperature becomes common. Those trends explain a real runtime decline.", "p.aging_proof": "This Mac has {cyc} cycles; current full-charge capacity is {loss} below design. The {per}-per-cycle figure is only a retrospective average—not measured loss per cycle and not a life forecast.", "p.time_jump_title": "Time remaining can jump without being wrong", "p.time_jump_lead": "Start compiling and it falls; stop to read and it rises.", "p.time_jump_body": "The charge did not come back. macOS repeatedly re-estimates how long the current pattern can continue. Power affects the estimate, but this page records the system value directly instead of calculating another answer from power.", "p.time_jump_proof": "Definition: on battery, record macOS time remaining. On power, when no system value exists, show stored energy divided by current power as a clearly labelled unplug estimate.", "p.geek": "Complete hardware metrics with per-item explanations", "p.hw_intro_title": "Start with the answer, then inspect raw fields when needed", "p.hw_intro_body": "This prototype includes every raw metric in the supplied list, plus the published model specification and necessary derivations. Each item has this Mac's current value, unit, explanation, range, and reliability; ? expands composite rows to their lowest-level fields.", "p.hw_search": "Search field, meaning, or group: temperature / capacity / charger", "p.hw_no_results": "No matching metric. Try a shorter search term.", "p.hw_group_cells": "Cell balance, depth of discharge, and permanent faults", "p.hw_group_capacity": "Design, full charge, and cycle life", "p.hw_group_electrical": "Live voltage, current, power, and tà a piena carica appresa dal misuratore (= FccComp1/2). Non è il totale chimico: la parte inutilizzabile è già sottratta.", "hw.n.raw_current": "Non misurata direttamente: calcolata come FCC × (1 − profondità di scarica), ottenuta dal conteggio coulombico corretto con la tensione a circuito aperto.", "hw.n.unusable": "Qmax and FCC come from the gauge. “Unreachable” is this prototype's interpretation of Qmax minus FCC, not a directly named gauge field.", "hw.n.deficit_cycle": "A retrospective average from total gap divided by cycles. It mixes chemical fade with currently unreachable capacity, so it is not measured loss per cycle and must not forecast life.", "hw.n.deficit_total": "Design minus FCC. This is not pure ageing; it combines chemical total-capacity fade with currently unreachable capacity and must be split using Qmax minus FCC.", "hw.n.calib_age": "Il misuratore può riapprendere la capacità solo quando il pacco riposa abbastanza da leggere la tensione a circuito aperto. Restare collegati fa crescere questo numero e invecchiare il dato di salute.", "hw.n.topology": "nSmP indica n in serie e m in parallelo. In serie le tensioni si sommano, la capacità no: la cella più debole limita il pacco.", "hw.n.health_system": "This prototype uses (FCC + reserve) divided by (design minus reserve), reverse-checked against this Mac. It is verified only here and is not a published Apple formula.", "hw.n.health_raw": "Rapporto fisico puro senza correzione della riserva. Inferiore a quello delle Impostazioni: entrambi corretti secondo la propria definizione.", "hw.n.design_cycles": "Usalo come base per la vita residua. Estrapolare linearmente il calo attuale sovrastima molto il degrado nel rodaggio.", "hw.n.weighted_ra": "Apple non pubblica un intervallo accettabile. Il trend nel tempo è affidabile, non il singolo valore.", "hw.n.min_pack_voltage": "La tensione minima del pacco mai raggiunta: ancoraggio empirico della soglia di taglio reale.", "hw.m.dod": "Profondità di scarica", "hw.m.nominal": "Capacità nominale", "hw.m.smoothed_amperage": "Corrente livellata", "hw.m.instant_amperage": "Corrente istantanea", "hw.m.virtual_temp": "Con modello termico", "hw.m.adapter_watts": "Potenza nominale", "hw.m.charge_v_limit": "Limite di tensione", "hw.m.charge_i_limit": "Limite di corrente", "hw.m.not_charging_reason": "Maschera motivo", "hw.m.system_load": "Carico di sistema", "hw.m.battery_power": "Flusso di potenza", "hw.m.power_in": "Potenza in ingresso", "hw.m.gauge_fw": "Firmware misuratore", "hw.m.chem_id": "Chimica celle", "hw.m.flash_writes": "Scritture flash", "hw.m.pf_status": "0 = nessun guasto", "hw.m.cell_disconnect": "Disconnessioni celle", "hw.m.machine_model": "Modello macchina", "hw.m.temp_min": "Minima storica", "hw.m.max_charge_current": "Corrente max di carica", "hw.m.max_discharge_current": "Corrente max di scarica", "hw.m.max_pack_voltage": "Tensione max pacco", "hw.m.temp_samples": "Campioni temperatura", "hw.m.daily_max_soc": "Massimo di oggi", "hw.m.daily_min_soc": "Minimo di oggi", "hw.n.ac_only": "La telemetria istantanea è 0 a batteria: questa riga compare solo collegati alla rete.", "hw.n.charge_i_limit": "È 0 anche a batteria piena in mantenimento o subito dopo il collegamento: da solo non indica una limitazione.", "hw.n.not_charging_reason": "Il significato dei bit non è documentato: mostriamo il valore grezzo senza trarne conclusioni.", "hw.n.temp_unit": "La scala varia: Apple Silicon in centi-°C, alcuni Mac Intel in deci-°C. Decidiamo in base all'ordine di grandezza.", "hw.n.temp_avg": "Attenzione alle scale miste: nello stesso dizionario Average è in deci-°C mentre Min/Max in °C.", "hw.n.max_discharge": "È già un intero negativo con segno: nessuna conversione in complemento a due.", "hw.n.total_runtime": "Semantica poco chiara: su questa macchina è troppo basso per essere tempo reale, non lo usiamo per stimare l'età.", "hw.n.daily_soc": "Solo l'istantanea di oggi: il misuratore non conserva storico, i dati settimanali li accumula questa app.", "hw.n.system_power": "Già in watt e attivo anche a batteria — fonte preferita per l'analisi dei consumi.", "stat.temperature": "Temperatura", "stat.cycles": "Cicli", "stat.health": "Salute", "stat.adapter": "Adattatore", "gauge.ac": "Alimentazione", "gauge.battery": "Su batteria", "rt.voltage": "Tensione", "rt.amperage": "Corrente", "rt.power": "Potenza", "rt.temperature": "Temp", "rt.percent": "Livello", "rt.title": "Monitor in tempo reale", "_name": "Italiano", "p.menu_preview": "Menu bar preview", "p.menu_time": "Time until empty", "p.menu_unplug": "Estimated after unplugging", "p.menu_unplug_short": "unplug ≈", "p.menu_direct": "Direct macOS value · click the pill to collapse", "p.menu_forecast": "Unplug estimate for the current Mac state · not system history", "p.menu_waiting": "Waiting for macOS time estimate", "p.menu_open": "Open full dashboard", "p.menu_settings": "Settings", "p.menu_close": "Close menu bar panel", "p.seg_now": "In there now", "p.seg_used": "Used", "p.seg_now_d": "<strong>Like the water left in the tank right now.</strong> Using the Mac drains it; plugging in fills it again.", "p.derive": "Consumer view: design {d} − current full charge {f} = long-term loss {loss}; current full charge {f} − current charge {c} = used this time {used}.<br>Deep diagnosis: gauge Qmax {q} is only for cell analysis and does not enter the main breakdown above.", "p.where_title": "Where your capacity went", "p.where_head": "Designed for {a} mAh, now fills to {b}, with {c} left right now", "p.design_capacity": "Original design capacity", "p.current_max": "Maximum when full now", "p.current_actual": "Actually left right now", "p.used_since_full": "Used since the last full charge", "p.permanent_loss": "Long-term capacity loss", "p.capacity_sum": "Whole bar = left now + used this charge + long-term loss = {design} mAh design capacity", "p.current_actual_desc": "Charge physically in the battery now. It falls with use and returns when charged.", "p.used_since_full_desc": "Consumed since the most recent full charge. It means “used this time” and returns as usable charge after charging.", "p.used_zero_desc": "It is zero because the battery is full now. This grows after unplugging and using the Mac.", "p.permanent_loss_desc": "The part current full-charge capacity is below the original design. Normal charging does not refill it.", "p.eq_capacity_title": "How much the battery can hold now", "p.eq_capacity_sub": "Compared with when it was new", "p.eq_usage_title": "How much has been used this charge", "p.eq_usage_sub": "This can be refilled by charging", "p.seg_use": "Actually usable", "p.seg_un": "Unreachable", "p.seg_age": "Lost to ageing", "p.card_now": "Left right now", "p.card_use": "Usable when full", "p.card_un": "Still there, out of reach", "p.card_age": "Actually lost to ageing", "p.seg_use_d": "<strong>Like the part of the tank you can really fill and drain.</strong> The menu-bar 0–100% moves within this usable portion.", "p.seg_un_d": "<strong>Like water below the reach of a straw.</strong> The charge is still there, but the Mac shuts down before voltage becomes unsafe.", "p.seg_age_d": "<strong>Like the tank itself becoming slightly smaller.</strong> Charging cannot restore this part; it is currently only a small slice of the original capacity.", "p.why_deeper": "How are these capacities calculated? View technical details", "p.ra_legend": "Internal resistance vs charge level", "p.ra_outlier": "Endpoint under-sampled — excluded", "p.ra_take": "Resistance climbs as charge falls, reaching {x} the mid-range level near empty. Since voltage = open-circuit − current×resistance, high resistance collapses the terminal voltage before that last charge can be drawn — so the gauge excludes it from usable capacity.", "p.dual_head": "Each point records the time remaining reported by macOS; the line only connects system readings", "p.split_v": "Voltage · what the cells give", "p.split_i": "Current · what the system draws", "p.split_note": "Voltage is set by cell chemistry and charge level — slow-moving and outside your control. <b>Only the current is yours to change</b>: closing heavy processes or dimming the display cuts the current term. Saving power physically means pulling less current.", "p.read_title": "Healthy ranges and high/low effects", "p.t_ok": "Normal", "p.t_warn": "Elevated", "p.t_bad": "Too hot", "p.t_lifeavg": "Your lifetime average", "p.t_hist": "All-time range", "p.t_today": "Today's range", "p.t_vs": "vs your normal", "p.collecting": "Collecting", "p.t_impact": "<b>Impact:</b> below 35°C does essentially no harm; 35–45°C measurably accelerates capacity fade; sustained above 45°C causes real damage. Cold does not permanently harm the cells but temporarily reduces available power. Target: <b>under 35°C</b>.", "p.p_low": "Below your normal", "p.p_mid": "About normal", "p.p_high": "Above your normal", "p.p_base": "Your long-run baseline", "p.p_ratio": "vs baseline", "p.p_energy": "Usable energy", "p.p_theory": "Runtime at this draw", "p.p_impact": "<b>The reference is you</b>, not an industry average — the baseline comes from over a hundred thousand samples on this machine. <b>Impact:</b> at your normal draw you get {a}; compiling or rendering (~25W) drops it to {b}; full load (~45W) leaves {c}.", "p.cadence": "The gauge refreshes only every ~30–60 s and holds its value in between — hence steps, not a smooth curve. It is a smoothed average, not an instantaneous reading.", "p.scen_title": "What you do decides how fast it drains", "p.scen_sub": "Measured on this machine. The app keeps recording and will fill in your own habitual scenarios.", "p.scen_now": "Now", "p.scen_idle": "Idle / reading", "p.scen_full": "Full-core compile", "p.scen_measured": "measured", "p.scen_note": "Not a hypothetical — measured just now by running a full-core load on this machine: power {a} → {b}, time left {c} → {d} min. <b>Everything you do sits on this curve.</b>", "p.t_cadence": "Refresh cadence", "p.t_histband": "All-time band", "p.p_peak": "Your all-time peak draw", "p.tb_freeze": "Charging below freezing plates metallic lithium and causes permanent damage. Discharging is safe but capacity shrinks sharply and temporarily.", "p.tb_cold": "Internal resistance rises; available power and runtime drop temporarily. No permanent harm — it recovers as it warms up.", "p.tb_ideal": "The sweet spot. Ageing runs at its slowest and neither charging nor discharging is restricted.", "p.tb_warm": "Ageing starts to accelerate. Rule of thumb: every extra 10 °C roughly doubles the rate of capacity fade.", "p.tb_hot": "Real damage. The system will usually throttle or limit charging to protect itself; sustained exposure here markedly shortens life.", "p.t_arrhenius": "<b>Target 15–35 °C.</b> Rule of thumb (Arrhenius): every 10 °C rise roughly doubles the fade rate — a battery living at 35 °C ages about twice as fast as one at 25 °C. <b>Note:</b> Apple publishes no cell-temperature thresholds; these bands come from general lithium-ion literature, not vendor specs.", "p.spec_title": "Metric reference · read it like a blood panel", "p.spec_sub": "Each metric gets a reference range, where you sit, and what high or low actually does — plus where that range came from.", "p.range": "Reference range", "p.src_apple": "Apple's own spec", "p.src_personal": "Your own history", "p.src_lit": "General Li-ion literature (not vendor spec)", "p.src_none": "⚠️ No authoritative range exists; this is a conservative guess. What is reliable is its trend over time.", "p.cb_ok": "Cells well matched — no single cell holding the pack back", "p.cb_mid": "Drifting apart. In series the weakest cell caps the pack, so a wider spread wastes more", "p.cb_bad": "Clearly unbalanced. Usable capacity is dragged down by the weakest cell — usually a sign one cell has degraded", "p.cb_cells": "Per-cell voltage", "p.ra_ok": "Good power delivery — voltage holds up under heavy load", "p.ra_mid": "Resistance rising. Bigger voltage sag under load means less usable capacity and more heat", "p.ra_bad": "High resistance. Heavy draw can trigger low-voltage shutdowns, and the extra heat accelerates ageing — a feedback loop", "p.ra_cells": "Per-cell resistance", "p.cy_ok": "Plenty of headroom. Against Apple's 1000-cycle rating you are nowhere near the end", "p.cy_mid": "Past halfway. Capacity fade usually flattens here, though the absolute number keeps falling", "p.cy_bad": "Near the rated end. Fade and resistance rise both accelerate from here — worth planning a replacement", "p.hp_ok": "Healthy. Runtime is close to what it was new", "p.hp_mid": "Some fade but still normal. Shorter runtime is noticeable yet everyday use is fine", "p.hp_bad": "Below 80% — Apple's own threshold for “service recommended”. macOS may start prompting", "p.pw_low": "Below your normal — you will get more runtime than usual", "p.pw_mid": "About your normal level", "p.pw_high": "Above normal. Runtime will be noticeably shorter than you are used to", "p.pw_max": "Near full load. The battery will not last long like this, and the heat accelerates ageing", "p.pv_ok": "Within the range this pack has historically operated in", "p.pv_low": "Below the all-time low. Close to cutoff — the system may shut down to protect the cells", "p.pv_high": "Above the all-time high — normally only seen at the instant of full charge", "p.unlock_title": "It keeps learning your battery", "p.unlock_head": "No setup or studying required — just use your Mac and more answers appear", "p.unlock_sub": "Minutes explain what is happening now, hours reveal today's pattern, and days begin shaping a profile unique to you. Every session makes the answers more personal.", "p.ul_now": "Right away", "p.ul_minutes": "After a few minutes", "p.ul_hours": "After a few hours", "p.ul_day": "After a day", "p.ul_days": "After a few days", "p.ul_longer": "Keep using it", "p.ul_0": "Health & capacity overview", "p.ul_0d": "See health, where capacity went, and lifetime extremes immediately", "p.ul_min": "Power & runtime together", "p.ul_mind": "See how long the battery should last at your current usage", "p.ul_hour": "Today's operating range", "p.ul_hourd": "Today's temperature and power ranges begin to take shape", "p.ul_1d": "First personal scenarios", "p.ul_1dd": "Starts separating light work, video, and heavy-load behavior", "p.ul_3": "Your usage profile", "p.ul_3d": "Learns charging habits and which scenarios affect runtime most", "p.ul_more": "Causes & long-term trends", "p.ul_mored": "Richer history explains why runtime changes and how this battery is ageing", "p.unlock_note": "Leave it running quietly in the background. No special test is needed and it will not interrupt you. It says “still learning” until there is enough evidence for a conclusion.", "p.learn_summary": "What else can this metric tell me over time?", "p.learn_intro": "No special test is needed. Leave the app in the background; it says “still learning” until there is enough evidence.", "p.learn_minutes": "See how current power changes affect time remaining.", "p.learn_hours": "Build today's ranges for power, temperature, and time remaining.", "p.learn_days": "Recognize common scenarios and explain which usage patterns affect runtime most.", "p.spec_metric": "Metric", "p.spec_current": "Current", "p.spec_reading": "What it means now", "p.spec_bands": "What each range means", "p.spec_source": "Range source", "p.spec_source_note": "Reference ranges are not treated as one universal truth: Apple specs, your own history, and general Li-ion research are labelled separately.", "p.spec_other_title": "Four other key metrics", "p.spec_other_sub": "The top only shows health, power, and temperature. Here the four remaining live values are compared directly with ranges, history, and high/low effects.", "p.good_range": "Healthy range", "p.history_extreme": "Historical range", "p.history_peak": "Historical peak", "p.history_learning": "Historic
