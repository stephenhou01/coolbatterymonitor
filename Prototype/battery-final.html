alculation: current stored energy ÷ current power use", "p.full_tank_explain": "A full charge only means the tank is full. Power use is now {ratio}% of your usual level, so it will drain faster.", "p.model_design_energy": "Design energy for this model", "p.current_full_energy": "This battery when full now", "p.energy_in_battery": "Energy remaining now", "p.current_power": "Current power use", "p.current_use_estimate": "At this usage", "p.baseline_compare": "At this Mac's usual {watts}W, the estimate is about {time}. The shorter figure mainly reflects the current workload.", "p.runtime_audit_tag": "Published benchmark × this Mac", "p.runtime_audit_title": "Why can an official 15 hours become only a few hours now?", "p.audit_official": "Apple new-battery wireless web test", "p.audit_same_load": "This battery at the same light workload", "p.audit_actual": "Actual system runtime now", "p.audit_capacity_note": "Capacity effect: about {hours} hours below new", "p.audit_load_note": "Workload effect: about {hours} more hours lost", "p.audit_cause": "Main cause: current workload", "p.audit_cause_body": "Current power is about {ratio}× the implied average in Apple's wireless-web test. 100% means today's capacity is full, not that the Mac is running the official light workload.", "p.audit_test_config": "Apple test system", "p.audit_your_config": "Your Mac", "p.audit_conditions": "Wireless web: 25 websites over Wi-Fi; display at 8 clicks from bottom and keyboard backlight off.", "p.audit_method": "Method: 53.8Wh ÷ 15h ≈ 3.59W average for the official web test; compare that with this battery's scaled full energy and system power.", "p.help_open": "View definition and formula", "p.help_title": "Where does this metric come from?", "p.help_current": "Current result", "p.help_raw": "Lowest-level input fields", "p.help_formula": "Formula", "p.help_substitution": "Substitute this Mac's values", "p.help_source": "Source and reliability", "p.help_direct": "No formula: read directly from the system field.", "p.help_model_spec": "System model identifier matched to Apple's published specification.", "p.help_derived": "Derived from raw system fields; not a same-named value returned directly by IOKit.", "p.help_close": "Close", "hw.group.runtime": "Runtime and system estimates", "p.hw_group_runtime": "Time remaining, time to full, and the post-wake invalid window", "hw.group.resistance": "Resistance and discharge curve", "p.hw_group_resistance": "Cell resistance and susceptibility to voltage sag at low charge", "hw.m.current_capacity": "System charge percentage", "hw.n.current_capacity": "User-facing 0–100% on Apple Silicon; capacity math should use AppleRawCurrentCapacity.", "hw.m.fcc_comp": "Full-charge capacity compensation copies", "hw.n.fcc_comp": "FccComp1/FccComp2 equal AppleRawMaxCapacity on this Mac and serve as redundant checks.", "hw.m.chemical_ra": "Chemical weighted resistance", "hw.n.chemical_ra": "Zero on this Mac, treated as unavailable and excluded from conclusions.", "hw.m.cell_wom": "Auxiliary cell-health field", "hw.n.cell_wom": "Only two zero entries for a three-cell pack; cardinality mismatch makes it unusable for scoring.", "hw.m.time_remaining": "Gauge time-remaining estimate", "hw.n.time_remaining": "TimeRemaining and AvgTimeToEmpty come directly from the gauge; 65535 means unavailable, not minutes.", "hw.m.time_to_full": "Estimated time to full", "hw.n.time_to_full": "Valid only while charging and ready; 65535 means unavailable or not applicable.", "hw.m.invalid_wake": "Post-wake estimate invalid window", "hw.n.invalid_wake": "Runtime estimates may be unstable for this many seconds after wake.", "hw.m.system_input": "Adapter input power/voltage/current", "hw.m.adapter_efficiency_loss": "Raw adapter-efficiency loss", "hw.n.adapter_efficiency_loss": "Instant values may be zero or negative and cumulative scaling is unknown; do not derive charging efficiency.", "hw.m.accumulated_avg_power": "Telemetry accumulated average power", "hw.n.accumulated_avg_power": "AccumulatedSystemLoad ÷ SystemLoadAccumulatorCount ÷ 1000, useful as this Mac's baseline.", "hw.m.wall_energy": "Raw accumulated wall-energy value", "hw.n.wall_energy": "Unit and scaling are undocumented; preserve only as a raw diagnostic value.", "hw.m.qmax_disqualification": "Qmax disqualification reason code", "hw.n.qmax_disqualification": "Zero is only the current raw code; nonzero may invalidate calibration, while bit meanings remain undocumented.", "hw.m.daily_soc_pair": "Daily maximum/minimum charge", "hw.m.adapter_contract": "Negotiated PD voltage/current", "hw.m.adapter_menu": "Negotiable PD profiles", "hw.n.adapter_menu": "Available only on AC; the highest profile reflects currently advertised negotiation capability.", "hw.m.adapter_description": "Adapter interface type", "hw.m.charge_limits": "Charging voltage/current limits", "hw.m.carrier_mode": "Carrier-mode charge thresholds and status", "hw.n.carrier_mode": "High/Low are carrier thresholds; Status needs system context and is not directly the 80% charge limit.", "hw.m.port_cycles": "Port-controller attach/detach counts", "hw.n.port_cycles": "Array order cannot safely map to left/right ports, so controllers are numbered. Abnormal growth may indicate contact issues.", "hw.m.port_failures": "Port capability mismatch/election failure", "hw.n.port_failures": "Nonzero values can point to cable, adapter, or PD negotiation issues; values are shown per controller.", "hw.m.chem_ids": "Cell chemistry and algorithm chemistry IDs", "hw.m.manufacture_batch": "Raw manufacturing batch integer", "hw.n.manufacture_batch": "The integer decodes to an ASCII batch code, not a verified calendar date.", "hw.m.first_use": "Raw first-use date", "hw.n.first_use": "Zero on this Mac, so true battery age cannot be obtained from it.", "hw.m.installed": "Battery installed/built-in state", "hw.m.temperature": "Measured cell temperature", "hw.m.model_design_energy": "Model-rated design energy", "hw.n.model_design_energy": "Rated Wh matched to Apple's specification after identifying the system model; it is not calculated from current voltage.", "hw.m.current_full_energy": "Current full-charge energy (scaled)", "hw.n.current_full_energy": "Model design Wh × current full-charge capacity ÷ design capacity, keeping one consistent scale for today's full battery.", "p.forecast_only": "The dashed line is a current forecast and is not saved as system history", "p.snapshot": "Snapshot", "p.snapshot_note": "This HTML prototype shows a system snapshot captured when generated; the app will update live", "p.usage_basis": "Reported directly by macOS; this product does not recalculate it from power", "p.system_charge": "macOS charge", "p.priority_health": "Overall battery health", "p.priority_power": "Current computer power use", "p.priority_temp": "Current battery temperature", "p.tagline": "Battery Monitor", "p.remaining": "Time remaining", "p.src_note": "Time remaining reported directly by macOS; this product does not recalculate it from power", "p.why_title": "Why the last 20% drains so fast", "p.why_sub": "Your battery is never “used up” — the voltage collapses first", "p.aha_label": "Aha moment", "p.health_two_title": "Why is health {sys}% while usable capacity is {raw}%?", "p.health_two_body": "<strong>It is like measuring one tank with two rulers.</strong> The system score accounts for the safety reserve; the capacity bar shows what can actually be filled now. Both are useful, but trends need the same ruler.", "p.health_two_formula": "{sys}% system health score · {raw}% direct capacity ratio", "p.loss_split_title": "Total gap {gap} mAh = unreachable + aged", "p.loss_split_body": "<strong>Using the same tank analogy:</strong> {un} mAh is like water below the straw—still there. Only {aged} mAh is the tank itself becoming smaller. Together they make the gap from new.", "p.loss_split_formula": "{gap} mAh total gap = {un} mAh out of reach + {aged} mAh aged", "p.use_loss_title": "Energy used today is not battery ageing", "p.use_loss_body": "<strong>Think of water in a cup versus the size of the cup.</strong> The {used} mAh used this time returns when charged; the {loss} mAh long-term loss is the cup becoming smaller than when new.", "p.use_loss_formula": "Used this time {used} mAh · long-term loss {loss} mAh · do not add them", "p.aging_judge_title": "Do not judge ageing from cycle count alone", "p.aging_judge_lead": "Cycle count is an odometer: it shows use, not health by itself.", "p.aging_judge_body": "What matters together is whether full-charge capacity keeps falling, resistance rises, cells drift apart, and high temperature becomes common. Those trends explain a real runtime decline.", "p.aging_proof": "This Mac has {cyc} cycles; current full-charge capacity is {loss} below design. The {per}-per-cycle figure is only a retrospective average—not measured loss per cycle and not a life forecast.", "p.time_jump_title": "Time remaining can jump without being wrong", "p.time_jump_lead": "Start compiling and it falls; stop to read and it rises.", "p.time_jump_body": "The charge did not come back. macOS repeatedly re-estimates how long the current pattern can continue. Power affects the estimate, but this page records the system value directly instead of calculating another answer from power.", "p.time_jump_proof": "Definition: on battery, record macOS time remaining. On power, when no system value exists, show stored energy divided by current power as a clearly labelled unplug estimate.", "p.geek": "Complete hardware metrics with per-item explanations", "p.hw_intro_title": "Start with the answer, then inspect raw fields when needed", "p.hw_intro_body": "This prototype includes every raw metric in the supplied list, plus the published model specification and necessary derivations. Each item has this Mac's current value, unit, explanation, range, and reliability; ? expands composite rows to their lowest-level fields.", "p.hw_search": "Search field, meaning, or group: temperature / capacity / charger", "p.hw_no_results": "No matching metric. Try a shorter search term.", "p.hw_group_cells": "Cell balance, depth of discharge, and permanent faults", "p.hw_group_capacity": "Design, full charge, and cycle life", "p.hw_group_electrical": "Live voltage, current, power, and temperature", "p.hw_group_charger": "Adapter capability and charging limits", "p.hw_group_telemetry": "Energy flow between system, adapter, and battery", "p.hw_group_identity": "Battery, gauge, firmware, and model identity", "p.hw_group_lifetime": "Lifetime extremes and capacity-calibration confidence", "p.hw_group_derived": "Derived answers from raw fields", "p.footer": "Definitions · Charge and time remaining prefer the user-visible macOS values; hardware values come from this Mac's IOKit snapshot ({time}).<br>Derived values · Health, capacity splits, and the on-power unplug estimate are labelled as derived or forecast and never mixed into system history.<br>Coverage · {fields} explained metrics / {groups} groups / {langs} languages; no fabricated long-term trends.", "p.hover_hint": "Click ? beside any metric for raw fields, formula, substitution, and reliability", "p.unusable_ex": "The part still included in chemical Qmax but excluded from usable full-charge FCC, derived by subtracting two gauge readings.", "p.nonlinear": "Do not extrapolate: lithium fade is fast early, then flattens"}, "ja": {"app.title": "バッテリーモニター", "insight.section.health": "バッテリー健康診断", "insight.section.power": "消費電力分析", "insight.section.hardware": "ハードウェア生データ", "insight.level.good": "良好", "insight.level.excellent": "優秀", "insight.factor.capacity": "容量維持率", "insight.factor.cycles": "サイクル使用率", "insight.factor.balance": "セルの均衡", "insight.factor.resistance": "内部抵抗", "insight.factor.temperature": "温度履歴", "insight.factor.fault": "ハードウェア自己診断", "insight.factor.fault_none": "異常なし", "insight.life.label": "残り寿命", "insight.age.label": "バッテリー年齢", "insight.estimated": "推定", "insight. か容量を再学習できません。挿しっぱなしだとこの数値が増え続け、健康度の値が古くなります。", "hw.n.topology": "nSmP は n 直列 m 並列の意味です。直列では電圧が加算されますが容量は加算されず、最弱セルが上限になります。", "hw.n.health_system": "本プロトタイプは (FCC+予備)/(設計−予備) を使用。本機表示から逆検証した口径で、この1台のみ確認済み。Apple 公開式ではありません。", "hw.n.health_raw": "予備容量を補正しない純粋な物理比。システム設定の数値より低くなりますが、定義が違うだけでどちらも正しい値です。", "hw.n.design_cycles": "残り寿命はこれを基準にしてください。現在の容量低下を線形外挿すると、初期段階で劣化を大幅に過大評価します。", "hw.n.weighted_ra": "Appleは許容範囲を公開していません。経時変化の傾向は信頼できますが、単一の絶対値は当てになりません。", "hw.n.min_pack_voltage": "実際に到達した最低パック電圧。カットオフ位置の実測アンカーです。", "hw.m.dod": "現在の放電深度", "hw.m.nominal": "公称容量", "hw.m.smoothed_amperage": "平滑化された電流", "hw.m.instant_amperage": "瞬時電流", "hw.m.virtual_temp": "熱モデル補正込み", "hw.m.adapter_watts": "充電器の定格出力", "hw.m.charge_v_limit": "充電電圧の上限", "hw.m.charge_i_limit": "充電電流の上限", "hw.m.not_charging_reason": "非充電理由ビットマスク", "hw.m.system_load": "システム負荷", "hw.m.battery_power": "バッテリー電力の流れ", "hw.m.power_in": "電源入力電力", "hw.m.gauge_fw": "電量計ファームウェア", "hw.m.chem_id": "セル化学組成", "hw.m.flash_writes": "フラッシュ書き込み回数", "hw.m.pf_status": "0 = 異常なし", "hw.m.cell_disconnect": "セル切断回数", "hw.m.machine_model": "機種識別子", "hw.m.temp_min": "過去最低温度", "hw.m.max_charge_current": "最大充電電流", "hw.m.max_discharge_current": "最大放電電流", "hw.m.max_pack_voltage": "最高パック電圧", "hw.m.temp_samples": "温度サンプル数", "hw.m.daily_max_soc": "本日の最高残量", "hw.m.daily_min_soc": "本日の最低残量", "hw.n.ac_only": "バッテリー駆動中は瞬時テレメトリが 0 になります。この行は電源接続時のみ表示されます。", "hw.n.charge_i_limit": "満充電の保持中や差し込んだ直後も 0 になります。これだけで充電が制限されていると判断はできません。", "hw.n.not_charging_reason": "ビットの意味が公開されていないため、生値のみ表示し、そこから結論は出しません。", "hw.n.temp_unit": "スケールはプラットフォーム依存：Apple Silicon は centi-°C、一部の Intel Mac は deci-°C。桁で判別しています。", "hw.n.temp_avg": "スケールの混在に注意：同じ辞書内で Average は deci-°C、Min/Max はそのまま °C です。", "hw.n.max_discharge": "元から符号付きの負の整数です。2の補数変換は不要です。", "hw.n.total_runtime": "意味が不明瞭で、本機では実時間より大幅に小さいため、バッテリー年齢の推定には使いません。", "hw.n.daily_soc": "当日のスナップショットのみ。電量計は履歴を保持しないため、週次データは本アプリが蓄積します。", "hw.n.system_power": "すでにワット単位で、バッテリー駆動時も値が出ます。消費電力分析の第一候補です。", "stat.temperature": "バッテリ euberechnung aus Leistung", "p.why_title": "Warum die letzten 20 % so schnell weg sind", "p.why_sub": "Der Akku wird nie „leer“ – die Spannung bricht vorher ein", "p.aha_label": "Aha-Moment", "p.health_two_title": "Warum {sys}% Zustand, aber {raw}% nutzbare Kapazität?", "p.health_two_body": "<strong>Wie ein Tank, der mit zwei Maßstäben gemessen wird.</strong> Die Systemwertung berücksichtigt die Sicherheitsreserve; der Balken zeigt, was heute wirklich gefüllt werden kann. Trends immer mit demselben Maßstab vergleichen.", "p.health_two_formula": "{sys}% Systemzustand · {raw}% direktes Kapazitätsverhältnis", "p.loss_split_title": "Gesamtlücke {gap} mAh = unerreichbar + gealtert", "p.loss_split_body": "<strong>Im Tankbild:</strong> {un} mAh sind wie Wasser unter dem Strohhalm und noch vorhanden. Nur {aged} mAh sind der kleiner gewordene Tank. Zusammen bilden sie die Lücke zum Neuzustand.", "p.loss_split_formula": "{gap} mAh Gesamtlücke = {un} mAh unerreichbar + {aged} mAh gealtert", "p.use_loss_title": "Heute verbrauchte Energie ist keine Alterung", "p.use_loss_body": "<strong>Wasser im Becher ist etwas anderes als die Bechergröße.</strong> Die diesmal verbrauchten {used} mAh kommen beim Laden zurück; {loss} mAh Langzeitverlust sind der kleinere Becher.", "p.use_loss_formula": "Diesmal verbraucht {used} mAh · Langzeitverlust {loss} mAh · nicht addieren", "p.aging_judge_title": "Alterung nicht nur an Zyklen messen", "p.aging_judge_lead": "Zyklen sind wie ein Kilometerzähler: Nutzung ja, Gesundheit nicht allein.", "p.aging_judge_body": "Entscheidend sind sinkende Vollladekapazität, steigender Widerstand, Zellabweichung und häufige Hitze. Erst gemeinsam erklären diese Trends einen echten Laufzeitverlust.", "p.aging_proof": "Dieser Mac hat {cyc} Zyklen; die aktuelle Vollladekapazität liegt {loss} unter Design. {per} pro Zyklus ist nur ein Rückblick, kein gemessener Einzelverlust und keine Lebensdauerprognose.", "p.time_jump_title": "Sprünge der Restzeit sind kein Rechenfehler", "p.time_jump_lead": "Beim Kompilieren sinkt sie, beim Lesen steigt sie wieder.", "p.time_jump_body": "Die Ladung ist nicht zurückgekehrt. macOS schätzt aus der jüngsten Last laufend neu. Leistung beeinflusst das Ergebnis, aber die Seite speichert den Systemwert direkt und berechnet keine zweite Antwort.", "p.time_jump_proof": "Definition: im Akkubetrieb macOS-Restzeit speichern. Am Netz ohne Systemwert wird Restenergie geteilt durch aktuelle Leistung klar als Prognose beim Abziehen markiert.", "p.geek": "Vollständige Hardware-Metriken mit Einzelerklärungen", "p.hw_intro_title": "Erst die Antwort, dann bei Bedarf Rohfelder", "p.hw_intro_body": "Alle Rohmetriken der gelieferten Liste plus veröffentlichte Modellspezifikation und nötige Ableitungen sind enthalten. ? öffnet zusammengesetzte Zeilen bis zu den untersten Feldern.", "p.hw_search": "Feld, Bedeutung oder Gruppe suchen: Temperatur / capacity / charger", "p.hw_no_results": "Keine passende Metrik. Versuchen Sie einen kürzeren Begriff.", "p.hw_group_cells": "Zellbalance, Entladetiefe und permanente Fehler", "p.hw_group_capacity": "Design, Vollladung und Zyklen", "p.hw_group_electrical": "Spannung, Strom, Leistung und Temperatur", "p.hw_group_charger": "Netzteil und Ladegrenzen", "p.hw_group_telemetry": "Energiefluss zwischen System, Netzteil und Akku", "p.hw_group_identity": "Akku-, Gauge-, Firmware- und Modellidentität", "p.hw_group_lifetime": "Lebenszeit-Extremwerte und Zuverlässigkeit der Kapazitätskalibrierung", "p.hw_group_derived": "Aus Rohfeldern abgeleitete Aussagen", "p.footer": "Definitionen · Ladung und Restzeit bevorzugen die sichtbaren macOS-Systemwerte; Hardwarewerte stammen aus dem IOKit-Snapshot dieses Macs ({time}).<br>Ableitungen · Zustand, Kapazitätsaufteilung und Prognose beim Abziehen sind als Ableitung oder Prognose markiert und werden nie mit Systemverlauf vermischt.<br>Umfang · {fields} erklärte Metriken / {groups} Gruppen / {langs} Sprachen; keine erfundenen Langzeittrends.", "p.hover_hint": "? neben jedem Wert zeigt Rohfelder, Formel, Einsetzung und Zuverlässigkeit", "p.unusable_ex": "Der in chemischem Qmax enthaltene, aber aus nutzbarer FCC ausgeschlossene Teil; aus zwei Gauge-Werten abgeleitet.", "p.nonlinear": "Nicht extrapolieren: Li-Alterung ist früh schnell, dann flach"}, "fr": {"app.title": "Moniteur Batterie", "insight.section.health": "Diagnostic de santé", "insight.section.power": "Analyse de consommation", "insight.section.hardware": "Données brutes matériel", "insight.level.good": "BON", "insight.level.excellent": "EXCELLENT", "insight.factor.capacity": "Rétention de capacité", "insight.factor.cycles": "Utilisation des cycles", "insight.factor.balance": "Équilibre des cellules", "insight.factor.resistance": "Résistance interne", "insight.factor.temperature": "Historique de température", "insight.factor.fault": "Autodiagnostic matériel", "insight.factor.fault_none": "Aucun défaut", "insight.life.label": "Durée de vie restante", "insight.age.label": "Âge de la batterie", "insight.estimated": "estimé", "insight.power.light": "Usage léger", "insight.power.idle": "Inactif · très sobre", "insight.expand_factors": "Voir la base", "hw.field": "Champ", "hw.value": "Valeur", "hw.unit": "Unité", "hw.meaning": "Signification", "hw.rel": "Fiab", "hw.rel.verified": "Vérifié sur matériel réel", "hw.rel.conditional": "Sous conditions – voir note", "hw.rel.questionable": "Sémantique ou unité non résolue", "hw.rel.derived": "Calculé par nous", "hw.group.cells": "Cellules", "hw.group.capacity": "Capacité et durée", "hw.group.electrical": "Électrique", "hw.group.charger": "Chargeur", "hw.group.telemetry": "Télémétrie", "hw.group.identity": "Identité", "hw.group.lifetime": "Statistiques de vie", "hw.group.derived": "Métriques dérivées", "hw.m.cell_delta": "Écart entre cellules", "hw.m.weighted_ra": "Résistance interne", "hw.m.qmax": "Capacité mesurée", "hw.m.design_capacity": "Capacité d'origine", "hw.m.raw_max": "Capacité à pleine charge", "hw.m.raw_current": "Charge disponible", "hw.m.reserve": "Capacité réservée", "hw.m.cycles": "Cycles utilisés", "hw.m.design_cycles": "Durée de vie nominale", "hw.m.pack_voltage": "Tension du pack", "hw.m.system_power": "Puissance système totale", "hw.m.temp_max": "Maximum absolu", "hw.m.temp_avg": "Moyenne globale", "hw.m.min_pack_voltage": "Tension min du pack", "hw.m.calib_age": "Cycles depuis l'étalonnage", "hw.m.unusable": "Présente mais inaccessible", "hw.m.deficit_cycle": "Historical full-charge gap per cycle", "hw.m.deficit_total": "Total design-to-full-charge gap", "hw.m.health_system": "Prototype system-aligned health", "hw.m.health_raw": "Valeur brute hors réserve", "hw.m.topology": "Topologie des cellules", "hw.m.serial": "Nº de série", "hw.m.gauge_chip": "Puce de jauge", "hw.n.qmax": "Capacité chimique par cellule, apprise entre deux ancrages de tension à vide. En série : la capacité du pack est celle de la cellule la plus faible, pas la somme.", "hw.n.cell_voltage": "Cellules en série : les tensions s'additionnent, pas la capacité. Leur somme égale la tension du pack.", "hw.n.reserve": "Buffer capacity outside the user charge percentage. This prototype uses it in its system-aligned health definition, reverse-verified only on this Mac.", "hw.n.raw_max": "Capacité à pleine charge apprise par la jauge (= FccComp1/2). Ce n'est pas le total chimique : la part inutilisable est déjà déduite.", "hw.n.raw_current": "Non mesurée directement : calculée comme FCC × (1 − profondeur de décharge), issue du comptage coulombique corrigé par la tension à vide.", "hw.n.unusable": "Qmax and FCC come from the gauge. “Unreachable” is this prototype's interpretation of Qmax minus FCC, not a directly named gauge field.", "hw.n.deficit_cycle": "A retrospective average from total gap divided by cycles. It mixes chemical fade with currently unreachable capacity, so it is not measured loss per cycle and must not forecast life.", "hw.n.deficit_total": "Design minus FCC. This is not pure ageing; it combines chemical total-capacity fade with currently unreachable capacity and must be split using Qmax minus FCC.", "hw.n.calib_age": "La jauge ne peut réapprendre la capacité que si la batterie se repose assez pour lire la tension à vide. Rester branché fait croître ce nombre et périmer l'indication de santé.", "hw.n.topology": "nSmP signifie n en série, m en parallèle. En série les tensions s'additionnent, pas la capacité — la cellule la plus faible limite le pack.", "hw.n.health_system": "This prototype uses (FCC + reserve) divided by (design minus reserve), reverse-checked against this Mac. It is verified only here and is not a published Apple formula.", "hw.n.health_raw": "Ratio physique brut sans correction de réserve. Inférieur à celui des Réglages — les deux sont corrects selon leur définition.", "hw.n.design_cycles": "Utilisez-le comme base pour la durée de vie restante. Extrapoler linéairement la perte actuelle surestime fortement l'usure au rodage.", "hw.n.weighted_ra": "Apple ne publie pas de plage acceptable. La tendance dans le temps est fiable, pas une valeur isolée.", "hw.n.min_pack_voltage": "La tension minimale du pack jamais atteinte — ancrage empirique du seuil de coupure réel.", "hw.m.dod": "Profondeur de décharge", "hw.m.nominal": "Capacité nominale", "hw.m.smoothed_amperage": "Courant lissé", "hw.m.instant_amperage": "Courant instantané", "hw.m.virtual_temp": "Avec modèle thermique", "hw.m.adapter_watts": "Puissance nominale", "hw.m.charge_v_limit": "Limite de tension", "hw.m.charge_i_limit": "Limite de courant", "hw.m.not_charging_reason": "Masque de raison", "hw.m.system_load": "Charge système", "hw.m.battery_power": "Flux de puissance", "hw.m.power_in": "Puissance d'entrée", "hw.m.gauge_fw": "Micrologiciel jauge", "hw.m.chem_id": "Chimie des cellules", "hw.m.flash_writes": "Écritures flash", "hw.m.pf_status": "0 = aucun défaut", "hw.m.cell_disconnect": "Déconnexions de cellule", "hw.m.machine_model": "Modèle de machine", "hw.m.temp_min": "Minimum absolu", "hw.m.max_charge_current": "Courant de charge max", "hw.m.max_discharge_current": "Courant de décharge max", "hw.m.max_pack_voltage": "Tension max du pack", "hw.m.temp_samples": "Échantillons de température", "hw.m.daily_max_soc": "Maximum du jour", "hw.m.daily_min_soc": "Minimum du jour", "hw.n.ac_only": "La télémétrie instantanée est à 0 sur batterie — cette ligne n'apparaît que branché.", "hw.n.charge_i_limit": "Vaut aussi 0 en maintien de charge pleine ou juste après branchement — cela n'indique pas à soi seul un bridage.", "hw.n.not_charging_reason": "La signification des bits n'est pas documentée : nous affichons la valeur brute sans conclusion.", "hw.n.temp_unit": "L'échelle varie : Apple Silicon en centi-°C, certains Mac Intel en deci-°C. Nous décidons selon l'ordre de grandeur.", "hw.n.temp_avg": "Attention aux échelles mixtes : dans le même dictionnaire, Average est en deci-°C et Min/Max en °C.", "hw.n.max_discharge": "Déjà un entier négatif signé — aucune conversion en complément à deux nécessaire.", "hw.n.total_runtime": "Sémantique floue : bien trop faible ici pour être un temps réel, nous ne l'utilisons pas pour estimer l'âge.", "hw.n.daily_soc": "Instantané du jour uniquement : la jauge ne conserve pas d'historique, cette app doit accumuler les données hebdomadaires.", "hw.n.system_power": "Déjà en watts et actif sur batterie — source privilégiée pour l'analyse de consommation.", "stat.temperature": "Température", "stat.cycles": "Cycles", "stat.health": "Santé", "stat.adapter": "Adaptateur", "gauge.ac": "Secteur", "gauge.battery": "Sur batterie", "rt.voltage": "Tension", "rt.amperage": "Courant", "rt.power": "Puissance", "rt.temperature": "Temp", "rt.percent": "Niveau", "rt.title": "Moniteur temps réel", "_name": "Français", "p.menu_preview": "Menu bar preview", "p.menu_time": "Time until empty", "p.menu_unplug": "Estimated after unplugging", "p.menu_unplug_short": "unplug ≈", "p.menu_direct": "Direct macOS value · click the pill to collapse", "p.menu_forecast": "Unplug estimate for the current Mac state · not system history", "p.menu_waiting": "Waiting for macOS time estimate", "p.menu_open": "Open full dashboard", "p.menu_settings": "Settings", "p.menu_close": "Close menu bar panel", "p.seg_now": "In there now", "p.seg_used": "Used", "p.seg_now_d": "<strong>Like the water left in the tank right now.</strong> Using the Mac drains it; plugging in fills it again.", "p.derive": "Consumer view: design {d} − current full charge {f} = long-term loss {loss}; current full charge {f} − current charge {c} = used this time {used}.<br>Deep diagnosis: gauge Qmax {q} is only for cell analysis and does not enter the main breakdown above.", "p.where_title": "Where your capacity went", "p.where_head": "Designed for {a} mAh, now fills to {b}, with {c} left right now", "p.design_capacity": "Original design capacity", "p.current_max": "Maximum when full now", "p.current_actual": "Actually left right now", "p.used_since_full": "Used since the last full charge", "p.permanent_loss": "Long-term capacity loss", "p.capacity_sum": "Whole bar = left now + used this charge + long-term loss = {design} mAh design capacity", "p.current_actual_desc": "Charge physically in the battery now. It falls with use and returns when charged.", "p.used_since_full_desc": "Consumed since the most recent full charge. It means “used this time” and returns as usable charge after charging.", "p.used_zero_desc": "It is zero because the battery is full now. This grows after unplugging and using the Mac.", "p.permanent_loss_desc": "The part current full-charge capacity is below the original design. Normal charging does not refill it.", "p.eq_capacity_title": "How much the battery can hold now", "p.eq_capacity_sub": "Compared with when it was new", "p.eq_usage_title": "How much has been used this charge", "p.eq_usage_sub": "This can be refilled by charging", "p.seg_use": "Actually usable", "p.seg_un": "Unreachable", "p.seg_age": "Lost to ageing", "p.card_now": "Left right now", "p.card_use": "Usable when full", "p.card_un": "Still there, out of reach", "p.card_age": "Actually lost to ageing", "p.seg_use_d": "<strong>Like the part of the tank you can really fill and drain.</strong> The menu-bar 0–100% moves within this usable portion.", "p.seg_un_d": "<strong>Like water below the reach of a straw.</strong> The charge is still there, but the Mac shuts down before voltage becomes unsafe.", "p.seg_age_d": "<strong>Like the tank itself becoming slightly smaller.</strong> Charging cannot restore this part; it is currently only a small slice of the original capacity.", "p.why_deeper": "How are these capacities calculated? View technical details", "p.ra_legend": "Internal resistance vs charge level", "p.ra_outlier": "Endpoint under-sampled — excluded", "p.ra_take": "Resistance climbs as charge falls, reaching {x} the mid-range level near empty. Since voltage = open-circuit − current×resistance, high resistance collapses the terminal voltage before that last charge can be drawn — so the gauge excludes it from usable capacity.", "p.dual_head": "Each point records the time remaining reported by macOS; the line only connects system readings", "p.split_v": "Voltage · what the cells give", "p.split_i": "Current · what the system draws", "p.split_note": "Voltage is set by cell chemistry and charge level — slow-moving and outside your control. <b>Only the current is yours to change</b>: closing heavy processes or dimming the display cuts the current term. Saving power physically means pulling less current.", "p.read_title": "Healthy ranges and high/low effects", "p.t_ok": "Normal", "p.t_warn": "Elevated", "p.t_bad": "Too hot", "p.t_lifeavg": "Your lifetime average", "p.t_hist": "All-time range", "p.t_today": "Today's range", "p.t_vs": "vs your normal", "p.collecting": "Collecting", "p.t_impact": "<b>Impact:</b> below 35°C does essentially no harm; 35–45°C measurably accelerates capacity fade; sustained above 45°C causes real damage. Cold does not permanently harm the cells but temporarily reduces available power. Target: <b>under 35°C</b>.", "p.p_low": "Below your normal", "p.p_mid": "About normal", "p.p_high": "Above your normal", "p.p_base": "Your long-run baseline", "p.p_ratio": "vs baseline", "p.p_energy": "Usable energy", "p.p_theory": "Runtime at this draw", "p.p_impact": "<b>The reference is you</b>, not an industry average — the baseline comes from over a hundred thousand samples on this machine. <b>Impact:</b> at your normal draw you get {a}; compiling or rendering (~25W) drops it to {b}; full load (~45W) leaves {c}.", "p.cadence": "The gauge refreshes only every ~30–60 s and holds its value in between — hence steps, not a smooth curve. It is a smoothed average, not an instantaneous reading.", "p.scen_title": "What you do decides how fast it drains", "p.scen_sub": "Measured on this machine. The app keeps recording and will fill in your own habitual scenarios.", "p.scen_now": "Now", "p.scen_idle": "Idle / reading", "p.scen_full": "Full-core compile", "p.scen_measured": "measured", "p.scen_note": "Not a hypothetical — measured just now by running a full-core load on this machine: power {a} → {b}, time left {c} → {d} min. <b>Everything you do sits on this curve.</b>", "p.t_cadence": "Refresh cadence", "p.t_histband": "All-time band", "p.p_peak": "Your all-time peak draw", "p.tb_freeze": "Charging below freezing plates metallic lithium and causes permanent damage. Discharging is safe but capacity shrinks sharply and temporarily.", "p.tb_cold": "Internal resistance rises; available power and runtime drop temporarily. No permanent harm — it recovers as it warms up.", "p.tb_ideal": "The sweet spot. Ageing runs at its slowest and neither charging nor discharging is restricted.", "p.tb_warm": "Ageing starts to accelerate. Rule of thumb: every extra 10 °C roughly doubles the rate of capacity fade.", "p.tb_hot": "Real damage. The system will usually throttle or limit charging to protect itself; sustained exposure here markedly shortens life.", "p.t_arrhenius": "<b>Target 15–35 °C.</b> Rule of thumb (Arrhenius): every 10 °C rise roughly doubles the fade rate — a battery living at 35 °C ages about twice as fast as one at 25 °C. <b>Note:</b> Apple publishes no cell-temperature thresholds; these bands come from general lithium-ion literature, not vendor specs.", "p.spec_title": "Metric reference · read it like a blood panel", "p.spec_sub": "Each metric gets a reference range, where you sit, and what high or low actually does — plus where that range came from.", "p.range": "Reference range", "p.src_apple": "Apple's own spec", "p.src_personal": "Your own history", "p.src_lit": "General Li-ion literature (not vendor spec)", "p.src_none": "⚠️ No authoritative range exists; this is a conservative guess. What is reliable is its trend over time.", "p.cb_ok": "Cells well matched — no single cell holding the pack back", "p.cb_mid": "Drifting apart. In series the weakest cell caps the pack, so a wider spread wastes more", "p.cb_bad": "Clearly unbalanced. Usable capacity is dragged down by the weakest cell — usually a sign one cell has degraded", "p.cb_cells": "Per-cell voltage", "p.ra_ok": "Good power delivery — voltage holds up under heavy load", "p.ra_mid": "Resistance rising. Bigger voltage sag under load means less usable capacity and more heat", "p.ra_bad": "High resistance. Heavy draw can trigger low-voltage shutdowns, and the extra heat accelerates ageing — a feedback loop", "p.ra_cells": "Per-cell resistance", "p.cy_ok": "Plenty of headroom. Against Apple's 1000-cycle rating you are nowhere near the end", "p.cy_mid": "Past halfway. Capacity fade usually flattens here, though the absolute number keeps falling", "p.cy_bad": "Near the rated end. Fade and resistance rise both accelerate from here — worth planning a replacement", "p.hp_ok": "Healthy. Runtime is close to what it was new", "p.hp_mid": "Some fade but still normal. Shorter runtime is noticeable yet everyday use is fine", "p.hp_bad": "Below 80% — Apple's own threshold for “service recommended”. macOS may start prompting", "p.pw_low": "Below your normal — you will get more runtime than usual", "p.pw_mid": "About your normal level", "p.pw_high": "Above normal. Runtime will be noticeably shorter than you are used to", "p.pw_max": "Near full load. The battery will not last long like this, and the heat accelerates ageing", "p.pv_ok": "Within the range this pack has historically operated in", "p.pv_low": "Below the all-time low. Close to cutoff — the system may shut down to protect the cells", "p.pv_high": "Above the all-time high — normally only seen at the instant of full charge", "p.unlock_title": "It keeps learning your battery", "p.unlock_head": "No setup or studying required — just use your Mac and more answers appear", "p.unlock_sub": "Minutes explain what is happening now, hours reveal today's pattern, and days begin shaping a profile unique to you. Every session makes the answers more personal.", "p.ul_now": "Right away", "p.ul_minutes": "After a few minutes", "p.ul_hours": "After a few hours", "p.ul_day": "After a day", "p.ul_days": "After a few days", "p.ul_longer": "Keep using it", "p.ul_0": "Health & capacity overview", "p.ul_0d": "See health, where capacity went, and lifetime extremes immediately", "p.ul_min": "Power & runtime together", "p.ul_mind": "See how long the battery should last at your current usage", "p.ul_hour": "Today's operating range", "p.ul_hourd": "Today's temperature and power ranges begin to take shape", "p.ul_1d": "First personal scenarios", "p.ul_1dd": "Starts separating light work, video, and heavy-load behavior", "p.ul_3": "Your usage profile", "p.ul_3d": "Learns charging habits and which scenarios affect runtime most", "p.ul_more": "Causes & long-term trends", "p.ul_mored": "Richer history explains why runtime changes and how this battery is ageing", "p.unlock_note": "Leave it running quietly in the background. No special test is needed and it will not interrupt you. It says “still learning” until there is enough evidence for a conclusion.", "p.learn_summary": "What else can this metric tell me over time?", "p.learn_intro": "No special test is needed. Leave the app in the background; it says “still learning” until there is enough evidence.", "p.learn_minutes": "See how current power changes affect time remaining.", "p.learn_hours": "Build today's ranges for power, temperature, and time remaining.", "p.learn_days": "Recognize common scenarios and explain which usage patterns affect runtime most.", "p.spec_metric": "Metric", "p.spec_current": "Current", "p.spec_reading": "What it means now", "p.spec_bands": "What each range means", "p.spec_source": "Range source", "p.spec_source_note": "Reference ranges are not treated as one universal truth: Apple specs, your own history, and general Li-ion research are labelled separately.", "p.spec_other_title": "Four other key metrics", "p.spec_other_sub": "The top only shows health, power, and temperature. Here the four remaining live values are compared directly with ranges, history, and high/low effects.", "p.good_range": "Healthy range", "p.history_extreme": "Historical range", "p.history_peak": "Historical peak", "p.history_learning": "Historical range is still learning", "p.cumulative_no_extreme": "Cumulative metric — no high/low extreme", "p.low_effect": "When low", "p.high_effect": "When high", "p.health_low_short": "Shorter runtime; below 80% may trigger service advice", "p.health_high_short": "Runtime stays closer to new", "p.cycle_low_short": "Less cumulative use", "p.cycle_high_short": "Near rated life; judge together with capacity", "p.temp_low_short": "Runtime and power drop temporarily", "p.temp_high_short": "More heat and faster ageing", "p.power_low_short": "Longer runtime and less heat", "p.power_high_short": "Shorter runtime and more heat", "p.src_none_short": "Trend only", "p.no_fixed_range": "No fixed normal range", "p.id_no_range": "Identifier — no normal range", "p.counter_range": "Cumulative — watch the trend", "p.rated_value": "rated value", "p.chart_time": "Time", "p.chart_hours": "Time remaining", "p.left_axis": "left axis", "p.right_axis": "right axis", "p.chart_waiting": "Waiting for the gauge's runtime estimate", "p.no_estimate_ac": "Connected to power — the gauge is not estimating runtime", "p.remaining_trend": "System time-remaining history", "p.direct_source": "Source: macOS system value", "p.sample_cadence_short": "App: records about every 56 seconds", "p.no_recalc": "Calculation: no power-based recalculation", "p.no_history": "This snapshot has no system runtime history; the app starts recording on battery power", "p.unplug_badge": "Unplug estimate", "p.unplug_kicker": "At the computer's current state, unplugging would give about", "p.unplug_note": "Estimate · expected after unplugging at the computer's current power use", "p.unplug_trend": "Estimated runtime after unplugging", "p.unplug_head": "With no discharge history yet, the dashed line estimates unplugged runtime from the current computer state", "p.unplug_legend": "Unplug estimate · not system history", "p.unplug_method": "Calculation: current stored energy ÷ current power use", "p.full_tank_explain": "A full charge only means the tank is full. Power use is now {ratio}% of your usual level, so it will drain faster.", "p.model_design_energy": "Design energy for this model", "p.current_full_energy": "This battery when full now", "p.energy_in_battery": "Energy remaining now", "p.current_power": "Current power use", "p.current_use_estimate": "At this usage", "p.baseline_compare": "At this Mac's usual {watts}W, the estimate is about {time}. The shorter figure mainly reflects the current workload.", "p.runtime_audit_tag": "Published benchmark × this Mac", "p.runtime_audit_title": "Why can an official 15 hours become only a few hours now?", "p.audit_official": "Apple new-battery wireless web test", "p.audit_same_load": "This battery at the same light workload", "p.audit_actual": "Actual system runtime now", "p.audit_capacity_note": "Capacity effect: about {hours} hours below new", "p.audit_load_note": "Workload effect: about {hours} more hours lost", "p.audit_cause": "Main cause: current workload", "p.audit_cause_body": "Current power is about {ratio}× the implied average in Apple's wireless-web test. 100% means today's capacity is full, not that the Mac is running the official light workload.", "p.audit_test_config": "Apple test system", "p.audit_your_config": "Your Mac", "p.audit_conditions": "Wireless web: 25 websites over Wi-Fi; display at 8 clicks from bottom and keyboard backlight off.", "p.audit_method": "Method: 53.8Wh ÷ 15h ≈ 3.59W average for the official web test; compare that with this battery's scaled full energy and system power.", "p.help_open": "View definition and formula", "p.help_title": "Where does this metric come from?", "p.help_current": "Current result", "p.help_raw": "Lowest-level input fields", "p.help_formula": "Formula", "p.help_substitution": "Substitute this Mac's values", "p.help_source": "Source and reliability", "p.help_direct": "No formula: read directly from the system field.", "p.help_model_spec": "System model identifier matched to Apple's published specification.", "p.help_derived": "Derived from raw system fields; not a same-named value returned directly by IOKit.", "p.help_close": "Close", "hw.group.runtime": "Runtime and system estimates", "p.hw_group_runtime": "Time remaining, time to full, and the post-wake invalid window", "hw.group.resistance": "Resistance and discharge curve", "p.hw_group_resistance": "Cell resistance and susceptibility to voltage sag at low charge", "hw.m.current_capacity": "System charge percentage", "hw.n.current_capacity": "User-facing 0–100% on Apple Silicon; capacity math should use AppleRawCurrentCapacity.", "hw.m.fcc_comp": "Full-charge capacity compensation copies", "hw.n.fcc_comp": "FccComp1/FccComp2 equal AppleRawMaxCapacity on this Mac and serve as redundant checks.", "hw.m.chemical_ra": "Chemical weighted resistance", "hw.n.chemical_ra": "Zero on this Mac, treated as unavailable and excluded from conclusions.", "hw.m.cell_wom": "Auxiliary cell-health field", "hw.n.cell_wom": "Only two zero entries for a three-cell pack; cardinality mismatch makes it unusable for scoring.", "hw.m.time_remaining": "Gauge time-remaining estimate", "hw.n.time_remaining": "TimeRemaining and AvgTimeToEmpty come directly from the gauge; 65535 means unavailable, not minutes.", "hw.m.time_to_full": "Estimated time to full", "hw.n.time_to_full": "Valid only while charging and ready; 65535 means unavailable or not applicable.", "hw.m.invalid_wake": "Post-wake estimate invalid window", "hw.n.invalid_wake": "Runtime estimates may be unstable for this many seconds after wake.", "hw.m.system_input": "Adapter input power/voltage/current", "hw.m.adapter_efficiency_loss": "Raw adapter-efficiency loss", "hw.n.adapter_efficiency_loss": "Instant values may be zero or negative and cumulative scaling is unknown; do not derive charging efficiency.", "hw.m.accumulated_avg_power": "Telemetry accumulated average power", "hw.n.accumulated_avg_power": "AccumulatedSystemLoad ÷ SystemLoadAccumulatorCount ÷ 1000, useful as this Mac's baseline.", "hw.m.wall_energy": "Raw accumulated wall-energy value", "hw.n.wall_energy": "Unit and scaling are undocumented; preserve only as a raw diagnostic value.", "hw.m.qmax_disqualification": "Qmax disqualification reason code", "hw.n.qmax_disqualification": "Zero is only the current raw code; nonzero may invalidate calibration, while bit meanings remain undocumented.", "hw.m.daily_soc_pair": "Daily maximum/minimum charge", "hw.m.adapter_contract": "Negotiated PD voltage/current", "hw.m.adapter_menu": "Negotiable PD profiles", "hw.n.adapter_menu": "Available only on AC; the highest profile reflects currently advertised negotiation capability.", "hw.m.adapter_description": "Adapter interface type", "hw.m.charge_limits": "Charging voltage/current limits", "hw.m.carrier_mode": "Carrier-mode charge thresholds and status", "hw.n.carrier_mode": "High/Low are carrier thresholds; Status needs system context and is not directly the 80% charge limit.", "hw.m.port_cycles": "Port-controller attach/detach counts", "hw.n.port_cycles": "Array order cannot safely map to left/right ports, so controllers are numbered. Abnormal growth may indicate contact issues.", "hw.m.port_failures": "Port capability mismatch/election failure", "hw.n.port_failures": "Nonzero values can point to cable, adapter, or PD negotiation issues; values are shown per controller.", "hw.m.chem_ids": "Cell chemistry and algorithm chemistry IDs", "hw.m.manufacture_batch": "Raw manufacturing batch integer", "hw.n.manufacture_batch": "The integer decodes to an ASCII batch code, not a verified calendar date.", "hw.m.first_use": "Raw first-use date", "hw.n.first_use": "Zero on this Mac, so true battery age cannot be obtained from it.", "hw.m.installed": "Battery installed/built-in state", "hw.m.temperature": "Measured cell temperature", "hw.m.model_design_energy": "Model-rated design energy", "hw.n.model_design_energy": "Rated Wh matched to Apple's specification after identifying the system model; it is not calculated from current voltage.", "hw.m.current_full_energy": "Current full-charge energy (scaled)", "hw.n.current_full_energy": "Model design Wh × current full-charge capacity ÷ design capacity, keeping one consistent scale for today's full battery.", "p.forecast_only": "The dashed line is a current forecast and is not saved as system history", "p.snapshot": "Snapshot", "p.snapshot_note": "This HTML prototype shows a system snapshot captured when generated; the app will update live", "p.usage_basis": "Reported directly by macOS; this product does not recalculate it from power", "p.system_charge": "macOS charge", "p.priority_health": "Overall battery health", "p.priority_power": "Current computer power use", "p.priority_temp": "Current battery temperature", "p.tagline": "Battery Monitor", "p.remaining": "Time remaining", "p.src_note": "Time remaining reported directly by macOS; this product does not recalculate it from power", "p.why_title": "Why the last 20% drains so fast", "p.why_sub": "Your battery is never “used up” — the voltage collapses first", "p.aha_label": "Aha moment", "p.health_two_title": "Why is health {sys}% while usable capacity is {raw}%?", "p.health_two_body": "<strong>It is like measuring one tank with two rulers.</strong> The system score accounts for the safety reserve; the capacity bar shows what can actually be filled now. Both are useful, but trends need the same ruler.", "p.health_two_formula": "{sys}% system health score · {raw}% direct capacity ratio", "p.loss_split_title": "Total gap {gap} mAh = unreachable + aged", "p.loss_split_body": "<strong>Using the same tank analogy:</strong> {un} mAh is like water below the straw—still there. Only {aged} mAh is the tank itself becoming smaller. Together they make the gap from new.", "p.loss_split_formula": "{gap} mAh total gap = {un} mAh out of reach + {aged} mAh aged", "p.use_loss_title": "Energy used today is not battery ageing", "p.use_loss_body": "<strong>Think of water in a cup versus the size of the cup.</strong> The {used} mAh used this time returns when charged; the {loss} mAh long-term loss is the cup becoming smaller than when new.", "p.use_loss_formula": "Used this time {used} mAh · long-term loss {loss} mAh · do not add them", "p.aging_judge_title": "Do not judge ageing from cycle count alone", "p.aging_judge_lead": "Cycle count is an odometer: it shows use, not health by itself.", "p.aging_judge_body": "What matters together is whether full-charge capacity keeps falling, resistance rises, cells drift apart, and high temperature becomes common. Those trends explain a real runtime decline.", "p.aging_proof": "This Mac has {cyc} cycles; current full-charge capacity is {loss} below design. The {per}-per-cycle figure is only a retrospective average—not measured loss per cycle and not a life forecast.", "p.time_jump_title": "Time remaining can jump without being wrong", "p.time_jump_lead": "Start compiling and it falls; stop to read and it rises.", "p.time_jump_body": "The charge did not come back. macOS repeatedly re-estimates how long the current pattern can continue. Power affects the estimate, but this page records the system value directly instead of calculating another answer from power.", "p.time_jump_proof": "Definition: on battery, record macOS time remaining. On power, when no system value exists, show stored energy divided by current power as a clearly labelled unplug estimate.", "p.geek": "Complete hardware metrics with per-item explanations", "p.hw_intro_title": "Start with the answer, then inspect raw fields when needed", "p.hw_intro_body": "This prototype includes every raw metric in the supplied list, plus the published model specification and necessary derivations. Each item has this Mac's current value, unit, explanation, range, and reliability; ? expands composite rows to their lowest-level fields.", "p.hw_search": "Search field, meaning, or group: temperature / capacity / charger", "p.hw_no_results": "No matching metric. Try a shorter search term.", "p.hw_group_cells": "Cell balance, depth of discharge, and permanent faults", "p.hw_group_capacity": "Design, full charge, and cycle life", "p.hw_group_electrical": "Live voltage, current, power, and temperature", "p.hw_group_charger": "Adapter capability and charging limits", "p.hw_group_telemetry": "Energy flow between system, adapter, and battery", "p.hw_group_identity": "Battery, gauge, firmware, and model identity", "p.hw_group_lifetime": "Lifetime extremes and capacity-calibration confidence", "p.hw_group_derived": "Derived answers from raw fields", "p.footer": "Definitions · Charge and time remaining prefer the user-visible macOS values; hardware values come from this Mac's IOKit snapshot ({time}).<br>Derived values · Health, capacity splits, and the on-power unplug estimate are labelled as derived or forecast and never mixed into system history.<br>Coverage · {fields} explained metrics / {groups} groups / {langs} languages; no fabricated long-term trends.", "p.hover_hint": "Click ? beside any metric for raw fields, formula, substitution, and reliability", "p.unusable_ex": "The part still included in chemical Qmax but excluded from usable full-charge FCC, derived by subtracting two gauge readings.", "p.nonlinear": "Do not extrapolate: lithium fade is fast early, then flattens"}, "ko": {"app.title": "배터리 모니터", "insight.section.health": "배터리 건강 진단", "insight.section.power": "전력 분석", "insight.section.hardware": "하드웨어 원시 데이터", "insight.level.good": "양호", "insight.level.excellent": "우수", "insight.factor.capacity": "용량 유지율", "insight.factor.cycles": "사이클 사용률", "insight.factor.balance": "셀 균형", "insight.factor.resistance": "내부 저항", "insight.factor.temperature": "온도 이력", "insight.factor.fault": "하드웨어 자체 점검", "insight.factor.fault_none": "이상 없음", "insight.life.label": "남은 수명", "insight.age.label": "배터리 연령", "insight.estimated": "추정", "insight.power.light": "가벼운 사용", "insight.power.idle": "유휴 · 매우 효율적", "insight.expand_factors": "근거 보기", "hw.field": "항목", "hw.value": "값", "hw.unit": "단위", "hw.meaning": "설명", "hw.rel": "신뢰", "hw.rel.verified": "실기기 검증됨", "hw.rel.conditional": "전제 조건 있음", "hw.rel.questionable": "의미·단위 미해결", "hw.rel.derived": "앱이 계산한 값", "hw.group.cells": "셀", "hw.group.capacity": "용량 및 수명", "hw.group.electrical": "전기 특성", "hw.group.charger": "충전기", "hw.group.telemetry": "전력 원격 측정", "hw.group.identity": "배터리 식별", "hw.group.lifetime": "수명 통계", "hw.group.derived": "파생 지표", "hw.m.cell_delta": "셀 간 전압 차", "hw.m.weighted_ra": "내부 저항", "hw.m.qmax": "전량계 측정 용량", "hw.m.design_capacity": "출고 설계 용량", "hw.m.raw_max": "현재 완충 용량", "hw.m.raw_current": "현재 사용 가능 용량", "hw.m.reserve": "시스템 예약 용량", "hw.m.cycles": "사용한 충전 주기", "hw.m.design_cycles": "정격 사이클 수명", "hw.m.pack_voltage": "배터리 팩 전압", "hw.m.system_power": "시스템 총 전력", "hw.m.temp_max": "역대 최고 온도", "hw.m.temp_avg": "전체 평균 온도", "hw.m.min_pack_voltage": "최저 팩 전압", "hw.m.calib_age": "마지막 보정 이후 사이클", "hw.m.unusable": "존재하나 사용 불가한 전하", "hw.m.deficit_cycle": "Historical full-charge gap per cycle", "hw.m.deficit_total": "Total design-to-full-charge gap", "hw.m.health_system": "Prototype system-aligned health", "hw.m.health_raw": "예비 용량 제외 실측비", "hw.m.topology": "셀 연결 구성", "hw.m.serial": "배터리 시리얼", "hw.m.gauge_chip": "전량계 칩", "hw.n.qmax": "각 셀의 화학 용량. 개방 회로 전압 두 지점 사이를 통과한 전하로 학습합니다. 직렬이므로 팩 용량은 합이 아니라 가장 약한 셀입니다.", "hw.n.cell_voltage": "셀은 직렬입니다: 전압은 더해지지만 용량은 더해지지 않습니다. 셀 전압의 합이 팩 전압과 같습니다.", "hw.n.reserve": "Buffer capacity outside the user charge percentage. This prototype uses it in its system-aligned health definition, reverse-verified only on this Mac.", "hw.n.raw_max": "게이지가 학습한 완충 용량(FccComp1/2와 동일). 화학적 총량이 아니라 사용 불가분이 이미 차감된 값입니다.", "hw.n.raw_current": "직접 측정값이 아니라 계산값입니다: FCC × (1 − 방전 심도). 방전 심도는 쿨롱 카운팅을 개방 전압으로 보정해 얻습니다.", "hw.n.unusable": "Qmax and FCC come from the gauge. “Unreachable” is this prototype's interpretation of Qmax minus FCC, not a directly named gauge field.", "hw.n.deficit_cycle": "A retrospective average from total gap divided by cycles. It mixes chemical fade with currently unreachable capacity, so it is not measured loss per cycle and must not forecast life.", "hw.n.deficit_total": "Design minus FCC. This is not pure ageing; it combines chemical total-capacity fade with currently unreachable capacity and must be split using Qmax minus FCC.", "hw.n.calib_age": "게이지는 팩이 충분히 쉬어 개방 전압을 읽을 수 있을 때만 용량을 재학습합니다. 계속 연결해 두면 이 값이 계속 커지고 건강도 수치가 오래됩니다.", "hw.n.topology": "nSmP은 n직렬 m병렬을 뜻합니다. 직렬에서는 전압이 더해지지만 용량은 더해지지 않으며 가장 약한 셀이 한계를 정합니다.", "hw.n.health_system": "This prototype uses (FCC + reserve) divided by (design minus reserve), reverse-checked against this Mac. It is verified only here and is not a published Apple formula.", "hw.n.health_raw": "예비 용량 보정을 하지 않은 순수 물리 비율. 시스템 설정 값보다 낮지만 정의가 달라 둘 다 맞습니다.", "hw.n.design_cycles": "남은 수명은 이것을 기준으로 하세요. 현재 용량 감소를 선형 외삽하면 초기 단계에서 열화를 크게 과대평가합니다.", "hw.n.weighted_ra": "Apple은 허용 범위를 공개하지 않습니다. 시간에 따른 추세는 신뢰할 수 있으나 절대값 단독은 아닙니다.", "hw.n.min_pack_voltage": "실제로 도달한 최저 팩 전압. 차단 지점의 실측 기준점입니다.", "hw.m.dod": "현재 방전 심도", "hw.m.nominal": "공칭 용량", "hw.m.smoothed_amperage": "평활화 전류", "hw.m.instant_amperage": "순간 전류", "hw.m.virtual_temp": "열 모델 보정 포함", "hw.m.adapter_watts": "충전기 정격 출력", "hw.m.charge_v_limit": "충전 전압 상한", "hw.m.charge_i_limit": "충전 전류 상한", "hw.m.not_charging_reason": "비충전 이유 비트마스크", "hw.m.system_load": "시스템 부하", "hw.m.battery_power": "배터리 전력 흐름", "hw.m.power_in": "벽면 입력 전력", "hw.m.gauge_fw": "전량계 펌웨어", "hw.m.chem_id": "셀 화학 조성", "hw.m.flash_writes": "플래시 쓰기 횟수", "hw.m.pf_status": "0 = 이상 없음", "hw.m.cell_disconnect": "셀 단절 횟수", "hw.m.machine_model": "기기 모델", "hw.m.temp_min": "역대 최저 온도", "hw.m.max_charge_current": "최대 충전 전류", "hw.m.max_discharge_current": "최대 방전 전류", "hw.m.max_pack_voltage": "최고 팩 전압", "hw.m.temp_samples": "온도 샘플 수", "hw.m.daily_max_soc": "오늘 최고 잔량", "hw.m.daily_min_soc": "오늘 최저 잔량", "hw.n.ac_only": "배터리 사용 중에는 순시 원격 측정값이 0입니다. 이 행은 전원 연결 시에만 표시됩니다.", "hw.n.charge_i_limit": "완충 유지 중이거나 막 연결했을 때도 0입니다. 이것만으로 충전 제한을 판단할 수 없습니다.", "hw.n.not_charging_reason": "비트 의미가 문서화되어 있지 않아 원시 값만 표시하고 결론을 내리지 않습니다.", "hw.n.temp_unit": "플랫폼마다 배율이 다릅니다: Apple Silicon은 centi-°C, 일부 Intel Mac은 deci-°C. 자릿수로 판별합니다.", "hw.n.temp_avg": "배율 혼용 주의: 같은 딕셔너리 안에서 Average는 deci-°C, Min/Max는 그냥 °C입니다.", "hw.n.max_discharge": "이미 부호 있는 음수 정수입니다. 2의 보수 변환이 필요 없습니다.", "hw.n.total_runtime": "의미가 불분명하고 이 기기에서는 실제 경과 시간보다 훨씬 작아 배터리 연령 추정에 사용하지 않습니다.", "hw.n.daily_soc": "오늘 스냅샷만 제공됩니다. 게이지는 이력을 저장하지 않으므로 주간 데이터는 이 앱이 누적해야 합니다.", "hw.n.system_power": "이미 와트 단위이며 배터리 사용 중에도 값이 유지됩니다. 전력 분석의 최우선 소스입니다.", "stat.temperature": "배터리 온도", "stat.cycles": "사이클 횟수", "stat.health": "건강도", "stat.adapter": "어댑터", "gauge.ac": "전원 연결", "gauge.battery": "배터리 사용", "rt.voltage": "전압", "rt.amperage": "전류", "rt.power": "전력", "rt.temperature": "온도", "rt.percent": "잔량", "rt.title": "실시간 모니터링", "_name": "한국어", "p.menu_preview": "Menu bar preview", "p.menu_time": "Time until empty", "p.menu_unplug": "Estimated after unplugging", "p.menu_unplug_short": "unplug ≈", "p.menu_direct": "Direct macOS value · click the pill to collapse", "p.menu_forecast": "Unplug estimate for the current Mac state · not system history", "p.menu_waiting": "Waiting for macOS time estimate", "p.menu_open": "Open full dashboard", "p.menu_settings": "Settings", "p.menu_close": "Close menu bar panel", "p.seg_now": "In there now", "p.seg_used": "Used", "p.seg_now_d": "<strong>Like the water left in the tank right now.</strong> Using the Mac drains it; plugging in fills it again.", "p.derive": "Consumer view: design {d} − current full charge {f} = long-term loss {loss}; current full charge {f} − current charge {c} = used this time {used}.<br>Deep diagnosis: gauge Qmax {q} is only for cell analysis and does not enter the main breakdown above.", "p.where_title": "Where your capacity went", "p.where_head": "Designed for {a} mAh, now fills to {b}, with {c} left right now", "p.design_capacity": "Original design capacity", "p.current_max": "Maximum when full now", "p.current_actual": "Actually left right now", "p.used_since_full": "Used since the last full charge", "p.permanent_loss": "Long-term capacity loss", "p.capacity_sum": "Whole bar = left now + used this charge + long-term loss = {design} mAh design capacity", "p.current_actual_desc": "Charge physically in the battery now. It falls with use and returns when charged.", "p.used_since_full_desc": "Consumed since the most recent full charge. It means “used this time” and returns as usable charge after charging.", "p.used_zero_desc": "It is zero because the battery is full now. This grows after unplugging and using the Mac.", "p.permanent_loss_desc": "The part current full-charge capacity is below the original design. Normal charging does not refill it.", "p.eq_capacity_title": "How much the battery can hold now", "p.eq_capacity_sub": "Compared with when it was new", "p.eq_usage_title": "How much has been used this charge", "p.eq_usage_sub": "This can be refilled by charging", "p.seg_use": "Actually usable", "p.seg_un": "Unreachable", "p.seg_age": "Lost to ageing", "p.card_now": "Left right now", "p.card_use": "Usable when full", "p.card_un": "Still there, out of reach", "p.card_age": "Actually lost to ageing", "p.seg_use_d": "<strong>Like the part of the tank you can really fill and drain.</strong> The menu-bar 0–100% moves within this usable portion.", "p.seg_un_d": "<strong>Like water below the reach of a straw.</strong> The charge is still there, but the Mac shuts down before voltage becomes unsafe.", "p.seg_age_d": "<strong>Like the tank itself becoming slightly smaller.</strong> Charging cannot restore this part; it is currently only a small slice of the original capacity.", "p.why_deeper": "How are these capacities calculated? View technical details", "p.ra_legend": "Internal resistance vs charge level", "p.ra_outlier": "Endpoint under-sampled — excluded", "p.ra_take": "Resistance climbs as charge falls, reaching {x} the mid-range level near empty. Since voltage = open-circuit − current×resistance, high resistance collapses the terminal voltage before that last charge can be drawn — so the gauge excludes it from usable capacity.", "p.dual_head": "Each point records the time remaining reported by macOS; the line only connects system readings", "p.split_v": "Voltage · what the cells give", "p.split_i": "Current · what the system draws", "p.split_note": "Voltage is set by cell chemistry and charge level — slow-moving and outside your control. <b>Only the current is yours to change</b>: closing heavy processes or dimming the display cuts the current term. Saving power physically means pulling less current.", "p.read_title": "Healthy ranges and high/low effects", "p.t_ok": "Normal", "p.t_warn": "Elevated", "p.t_bad": "Too hot", "p.t_lifeavg": "Your lifetime average", "p.t_hist": "All-time range", "p.t_today": "Today's range", "p.t_vs": "vs your normal", "p.collecting": "Collecting", "p.t_impact": "<b>Impact:</b> below 35°C does essentially no harm; 35–45°C measurably accelerates capacity fade; sustained above 45°C causes real damage. Cold does not permanently harm the cells but temporarily reduces available power. Target: <b>under 35°C</b>.", "p.p_low": "Below your normal", "p.p_mid": "About normal", "p.p_high": "Above your normal", "p.p_base": "Your long-run baseline", "p.p_ratio": "vs baseline", "p.p_energy": "Usable energy", "p.p_theory": "Runtime at this draw", "p.p_impact": "<b>The reference is you</b>, not an industry average — the baseline comes from over a hundred thousand samples on this machine. <b>Impact:</b> at your normal draw you get {a}; compiling or rendering (~25W) drops it to {b}; full load (~45W) leaves {c}.", "p.cadence": "The gauge refreshes only every ~30–60 s and holds its value in between — hence steps, not a smooth curve. It is a smoothed average, not an instantaneous reading.", "p.scen_title": "What you do decides how fast it drains", "p.scen_sub": "Measured on this machine. The app keeps recording and will fill in your own habitual scenarios.", "p.scen_now": "Now", "p.scen_idle": "Idle / reading", "p.scen_full": "Full-core compile", "p.scen_measured": "measured", "p.scen_note": "Not a hypothetical — measured just now by running a full-core load on this machine: power {a} → {b}, time left {c} → {d} min. <b>Everything you do sits on this curve.</b>", "p.t_cadence": "Refresh cadence", "p.t_histband": "All-time band", "p.p_peak": "Your all-time peak draw", "p.tb_freeze": "Charging below freezing plates metallic lithium and causes permanent damage. Discharging is safe but capacity shrinks sharply and temporarily.", "p.tb_cold": "Internal resistance rises; available power and runtime drop temporarily. No permanent harm — it recovers as it warms up.", "p.tb_ideal": "The sweet spot. Ageing runs at its slowest and neither charging nor discharging is restricted.", "p.tb_warm": "Ageing starts to accelerate. Rule of thumb: every extra 10 °C roughly doubles the rate of capacity fade.", "p.tb_hot": "Real damage. The system will usually throttle or limit charging to protect itself; sustained exposure here markedly shortens life.", "p.t_arrhenius": "<b>Target 15–35 °C.</b> Rule of thumb (Arrhenius): every 10 °C rise roughly doubles the fade rate — a battery living at 35 °C ages about twice as fast as one at 25 °C. <b>Note:</b> Apple publishes no cell-temperature thresholds; these bands come from general lithium-ion literature, not vendor specs.", "p.spec_title": "Metric reference · read it like a blood panel", "p.spec_sub": "Each metric gets a reference range, where you sit, and what high or low actually does — plus where that range came from.", "p.range": "Reference range", "p.src_apple": "Apple's own spec", "p.src_personal": "Your own history", "p.src_lit": "General Li-ion literature (not vendor spec)", "p.src_none": "⚠️ No authoritative range exists; this is a conservative guess. What is reliable is its trend over time.", "p.cb_ok": "Cells well matched — no single cell holding the pack back", "p.cb_mid": "Drifting apart. In series the weakest cell caps the pack, so a wider spread wastes more", "p.cb_bad": "Clearly unbalanced. Usable capacity is dragged down by the weakest cell — usually a sign one cell has degraded", "p.cb_cells": "Per-cell voltage", "p.ra_ok": "Good power delivery — voltage holds up under heavy load", "p.ra_mid": "Resistance rising. Bigger voltage sag under load means less usable capacity and more heat", "p.ra_bad": "High resistance. Heavy draw can trigger low-voltage shutdowns, and the extra heat accelerates ageing — a feedback loop", "p.ra_cells": "Per-cell resistance", "p.cy_ok": "Plenty of headroom. Against Apple's 1000-cycle rating you are nowhere near the end", "p.cy_mid": "Past halfway. Capacity fade usually flattens here, though the absolute number keeps falling", "p.cy_bad": "Near the rated end. Fade and resistance rise both accelerate from here — worth planning a replacement", "p.hp_ok": "Healthy. Runtime is close to what it was new", "p.hp_mid": "Some fade but still normal. Shorter runtime is noticeable yet everyday use is fine", "p.hp_bad": "Below 80% — Apple's own threshold for “service recommended”. macOS may start prompting", "p.pw_low": "Below your normal — you will get more runtime than usual", "p.pw_mid": "About your normal level", "p.pw_high": "Above normal. Runtime will be noticeably shorter than you are used to", "p.pw_max": "Near full load. The battery will not last long like this, and the heat accelerates ageing", "p.pv_ok": "Within the range this pack has historically operated in", "p.pv_low": "Below the all-time low. Close to cutoff — the system may shut down to protect the cells", "p.pv_high": "Above the all-time high — normally only seen at the instant of full charge", "p.unlock_title": "It keeps learning your battery", "p.unlock_head": "No setup or studying required — just use your Mac and more answers appear", "p.unlock_sub": "Minutes explain what is happening now, hours reveal today's pattern, and days begin shaping a profile unique to you. Every session makes the answers more personal.", "p.ul_now": "Right away", "p.ul_minutes": "After a few minutes", "p.ul_hours": "After a few hours", "p.ul_day": "After a day", "p.ul_days": "After a few days", "p.ul_longer": "Keep using it", "p.ul_0": "Health & capacity overview", "p.ul_0d": "See health, where capacity went, and lifetime extremes immediately", "p.ul_min": "Power & runtime together", "p.ul_mind": "See how long the battery should last at your current usage", "p.ul_hour": "Today's operating range", "p.ul_hourd": "Today's temperature and power ranges begin to take shape", "p.ul_1d": "First personal scenarios", "p.ul_1dd": "Starts separating light work, video, and heavy-load behavior", "p.ul_3": "Your usage profile", "p.ul_3d": "Learns charging habits and which scenarios affect runtime most", "p.ul_more": "Causes & long-term trends", "p.ul_mored": "Richer history explains why runtime changes and how this battery is ageing", "p.unlock_note": "Leave it running quietly in the background. No special test is needed and it will not interrupt you. It says “still learning” until there is enough evidence for a conclusion.", "p.learn_summary": "What else can this metric tell me over time?", "p.learn_intro": "No special test is needed. Leave the app in the background; it says “still learning” until there is enough evidence.", "p.learn_minutes": "See how current power changes affect time remaining.", "p.learn_hours": "Build today's ranges for power, temperature, and time remaining.", "p.learn_days": "Recognize common scenarios and explain which usage patterns affect runtime most.", "p.spec_metric": "Metric", "p.spec_current": "Current", "p.spec_reading": "What it means now", "p.spec_bands": "What each range means", "p.spec_source": "Range source", "p.spec_source_note": "Reference ranges are not treated as one universal truth: Apple specs, your own history, and general Li-ion research are labelled separately.", "p.spec_other_title": "Four other key metrics", "p.spec_other_sub": "The top only shows health, power, and temperature. Here the four remaining live values are compared directly with ranges, history, and high/low effects.", "p.good_range": "Healthy range", "p.history_extreme": "Historical range", "p.history_peak": "Historical peak", "p.history_learning": "Historical range is still learning", "p.cumulative_no_extreme": "Cumulative metric — no high/low extreme", "p.low_effect": "When low", "p.high_effect": "When high", "p.health_low_short": "Shorter runtime; below 80% may trigger service advice", "p.health_high_short": "Runtime stays closer to new", "p.cycle_low_short": "Less cumulative use", "p.cycle_high_short": "Near rated life l resistance and susceptibility to voltage sag at low charge", "hw.m.current_capacity": "System charge percentage", "hw.n.current_capacity": "User-facing 0–100% on Apple Silicon; capacity math should use AppleRawCurrentCapacity.", "hw.m.fcc_comp": "Full-charge capacity compensation copies", "hw.n.fcc_comp": "FccComp1/FccComp2 equal AppleRawMaxCapacity on this Mac and serve as redundant checks.", "hw.m.chemical_ra": "Chemical weighted resistance", "hw.n.chemical_ra": "Zero on this Mac, treated as unavailable and excluded from conclusions.", "hw.m.cell_wom": "Auxiliary cell-health field", "hw.n.cell_wom": "Only two zero entries for a three-cell pack; cardinality mismatch makes it unusable for scoring.", "hw.m.time_remaining": "Gauge time-remaining estimate", "hw.n.time_remaining": "TimeRemaining and AvgTimeToEmpty come directly from the gauge; 65535 means unavailable, not minutes.", "hw.m.time_to_full": "Estimated time to full", "hw.n.time_to_full": "Valid only while charging and ready; 65535 means unavailable or not applicable.", "hw.m.invalid_wake": "Post-wake estimate invalid window", "hw.n.invalid_wake": "Runtime estimates may be unstable for this many seconds after wake.", "hw.m.system_input": "Adapter input power/voltage/current", "hw.m.adapter_efficiency_loss": "Raw adapter-efficiency loss", "hw.n.adapter_efficiency_loss": "Instant values may be zero or negative and cumulative scaling is unknown; do not derive charging efficiency.", "hw.m.accumulated_avg_power": "Telemetry accumulated average power", "hw.n.accumulated_avg_power": "AccumulatedSystemLoad ÷ SystemLoadAccumulatorCount ÷ 1000, useful as this Mac's baseline.", "hw.m.wall_energy": "Raw accumulated wall-energy value", "hw.n.wall_energy": "Unit and scaling are undocumented; preserve only as a raw diagnostic value.", "hw.m.qmax_disqualification": "Qmax disqualification reason code", "hw.n.qmax_disqualification": "Zero is only the current raw code; nonzero may invalidate calibration, while bit meanings remain undocumented.", "hw.m.daily_soc_pair": "Daily maximum/minimum charge", "hw.m.adapter_contract": "Negotiated PD voltage/current", "hw.m.adapter_menu": "Negotiable PD profiles", "hw.n.adapter_menu": "Available only on AC; the highest profile reflects currently advertised negotiation capability.", "hw.m.adapter_description": "Adapter interface type", "hw.m.charge_limits": "Charging voltage/current limits", "hw.m.carrier_mode": "Carrier-mode charge thresholds and status", "hw.n.carrier_mode": "High/Low are carrier thresholds; Status needs system context and is not directly the 80% charge limit.", "hw.m.port_cycles": "Port-controller attach/detach counts", "hw.n.port_cycles": "Array order cannot safely map to left/right ports, so controllers are numbered. Abnormal growth may indicate contact issues.", "hw.m.port_failures": "Port capability mismatch/election failure", "hw.n.port_failures": "Nonzero values can point to cable, adapter, or PD negotiation issues; values are shown per controller.", "hw.m.chem_ids": "Cell chemistry and algorithm chemistry IDs", "hw.m.manufacture_batch": "Raw manufacturing batch integer", "hw.n.manufacture_batch": "The integer decodes to an ASCII batch code, not a verified calendar date.", "hw.m.first_use": "Raw first-use date", "hw.n.first_use": "Zero on this Mac, so true battery age cannot be obtained from it.", "hw.m.installed": "Battery installed/built-in state", "hw.m.temperature": "Measured cell temperature", "hw.m.model_design_energy": "Model-rated design energy", "hw.n.model_design_energy": "Rated Wh matched to Apple's specification after identifying the system model; it is not calculated from current voltage.", "hw.m.current_full_energy": "Current full-charge energy (scaled)", "hw.n.current_full_energy": "Model design Wh × current full-charge capacity ÷ design capacity, keeping one consistent scale for today's full battery.", "p.forecast_only": "The dashed line is a current forecast and is not saved as system history", "p.snapshot": "Snapshot", "p.snapshot_note": "This HTML prototype shows a system snapshot captured when generated; the app will update live", "p.usage_basis": "Reported directly by macOS; this product does not recalculate it from power", "p.system_charge": "macOS charge", "p.priority_health": "Overall battery health", "p.priority_power": "Current computer power use", "p.priority_temp": "Current battery temperature", "p.tagline": "Battery Monitor", "p.remaining": "Time remaining", "p.src_note": "Time remaining reported directly by macOS; this product does not recalculate it from power", "p.why_title": "Why the last 20% drains so fast", "p.why_sub": "Your battery is never “used up” — the voltage collapses first", "p.aha_label": "Aha moment", "p.health_two_title": "Why is health {sys}% while usable capacity is {raw}%?", "p.health_two_body": "<strong>It is like measuring one tank with two rulers.</strong> The system score accounts for the safety reserve; the capacity bar shows what can actually be filled now. Both are useful, but trends need the same ruler.", "p.health_two_formula": "{sys}% system health score · {raw}% direct capacity ratio", "p.loss_split_title": "Total gap {gap} mAh = unreachable + aged", "p.loss_split_body": "<strong>Using the same tank analogy:</strong> {un} mAh is like water below the straw—still there. Only {aged} mAh is the tank itself becoming smaller. Together they make the gap from new.", "p.loss_split_formula": "{gap} mAh total gap = {un} mAh out of reach + {aged} mAh aged", "p.use_loss_title": "Energy used today is not battery ageing", "p.use_loss_body": "<strong>Think of water in a cup versus the size of the cup.</strong> The {used} mAh used this time returns when charged; the {loss} mAh long-term loss is the cup becoming smaller than when new.", "p.use_loss_formula": "Used this time {used} mAh · long-term loss {loss} mAh · do not add them", "p.aging_judge_title": "Do not judge ageing from cycle count alone", "p.aging_judge_lead": "Cycle count is an odometer: it shows use, not health by itself.", "p.aging_judge_body": "What matters together is whether full-charge capacity keeps falling, resistance rises, cells drift apart, and high temperature becomes common. Those trends explain a real runtime decline.", "p.aging_proof": "This Mac has {cyc} cycles; current full-charge capacity is {loss} below design. The {per}-per-cycle figure is only a retrospective average—not measured loss per cycle and not a life forecast.", "p.time_jump_title": "Time remaining can jump without being wrong", "p.time_jump_lead": "Start compiling and it falls; stop to read and it rises.", "p.time_jump_body": "The charge did not come back. macOS repeatedly re-estimates how long the current pattern can continue. Power affects the estimate, but this page records the system value directly instead of calculating another answer from power.", "p.time_jump_proof": "Definition: on battery, record macOS time remaining. On power, when no system value exists, show stored energy divided by current power as a clearly labelled unplug estimate.", "p.geek": "Complete hardware metrics with per-item explanations", "p.hw_intro_title": "Start with the answer, then inspect raw fields when needed", "p.hw_intro_body": "This prototype includes every raw metric in the supplied list, plus the published model specification and necessary derivations. Each item has this Mac's current value, unit, explanation, range, and reliability; ? expands composite rows to their lowest-level fields.", "p.hw_search": "Search field, meaning, or group: temperature / capacity / charger", "p.hw_no_results": "No matching metric. Try a shorter search term.", "p.hw_group_cells": "Cell balance, depth of discharge, and permanent faults", "p.hw_group_capacity": "Design, full charge, and cycle life", "p.hw_group_electrical": "Live voltage, current, power, and temperature", "p.hw_group_charger": "Adapter capability and charging limits", "p.hw_group_telemetry": "Energy flow between system, adapter, and battery", "p.hw_group_identity": "Battery, gauge, firmware, and model identity", "p.hw_group_lifetime": "Lifetime extremes and capacity-calibration confidence", "p.hw_group_derived": "Derived answers from raw fields", "p.footer": "Definitions · Charge and time remaining prefer the user-visible macOS values; hardware values come from this Mac's IOKit snapshot ({time}).<br>Derived values · Health, capacity splits, and the on-power unplug estimate are labelled as derived or forecast and never mixed into system history.<br>Coverage · {fields} explained metrics / {groups} groups / {langs} languages; no fabricated long-term trends.", "p.hover_hint": "Click ? beside any metric for raw fields, formula, substitution, and reliability", "p.unusable_ex": "The part still included in chemical Qmax but excluded from usable full-charge FCC, derived by subtracting two gauge readings.", "p.nonlinear": "Do not extrapolate: lithium fade is fast early, then flattens"}, "zh-Hant": {"app.title": "電池監控中心", "insight.section.health": "電池健康診斷", "insight.section.power": "耗電分析", "insight.section.hardware": "硬件原始數據", "insight.level.good": "良好", "insight.level.excellent": "優秀", "insight.factor.capacity": "容量保持率", "insight.factor.cycles": "循環使用率", "insight.factor.balance": "各單元均衡度", "insight.factor.resistance": "電池內部阻力", "insight.factor.temperature": "溫度歷史", "insight.factor.fault": "硬件故障檢測", "insight.factor.fault_none": "無異常", "insight.life.label": "剩餘壽命", "insight.age.label": "電池年齡", "insight.estimated": "估算", "insight.power.light": "輕度使用", "insight.power.idle": "空閒 · 非常省電", "insight.expand_factors": "查看依據", "hw.field": "欄位", "hw.value": "值", "hw.unit": "單位", "hw.meaning": "說明", "hw.rel": "可信", "hw.rel.verified": "實機核對可靠", "hw.rel.conditional": "有前提，見說明", "hw.rel.questionable": "語義或單位未解出", "hw.rel.derived": "我們算出來的，非原始讀數", "hw.group.cells": "電芯", "hw.group.capacity": "容量與壽命", "hw.group.electrical": "即時電氣", "hw.group.charger": "充電器", "hw.group.telemetry": "功耗遙測", "hw.group.identity": "電池身份", "
