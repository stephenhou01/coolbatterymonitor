     <div class="hd"><b style="color:${COL[pv[0]]}">${D.watts.toFixed(1)}</b><s>W · ${T('rt.power')}</s>
       <span class="verdict" style="color:${COL[pv[0]]};background:rgba(255,255,255,.06)">${pv[1]}</span></div>
     <div class="scale"><div style="background:rgba(91,255,199,.5)"></div><div style="background:rgba(77,163,255,.5)"></div><div style="background:rgba(255,176,32,.5)"></div><div style="background:rgba(255,92,92,.5)"></div></div>
     <div class="scmark"><i style="left:${mark(D.watts, 0, 45)}%"></i>
       <s style="left:${mark(D.avgW,0,45)}%">${D.avgW}</s><s style="left:${mark(25,0,45)}%">25</s></div>
     <div class="rdrow"><span class="k">${T('p.p_base')}</span><span class="v">${D.avgW} W</span></div>
     <div class="rdrow"><span class="k">${T('p.p_ratio')}</span><span class="v" style="color:${COL[pv[0]]}">${(pRatio * 100).toFixed(0)}%</span></div>
     <div class="rdrow"><span class="k">${T('p.p_energy')}</span><span class="v">${D.wh} Wh</span></div>
     <div class="rdrow"><span class="k">${T('p.p_theory')}</span><span class="v">${(D.wh / D.watts).toFixed(1)} h</span></div>
     <div class="rdimp">${T('p.p_impact').replace('{a}', `<b>${(D.wh / D.avgW).toFixed(1)}h</b>`).replace('{b}', `<b>${(D.wh / 25).toFixed(1)}h</b>`).replace('{c}', `<b>${(D.wh / 45).toFixed(1)}h</b>`)}</div>
   </div>`;

  // ③ 你买的容量去哪了 —— 三段加起来正好等于出厂标称
  const use = D.fcc, un = D.unusable, ag = D.aged, tot = D.design;
  $('#whereHead').innerHTML = T('p.where_head')
    .replace('{a}', `<em>${tot.toLocaleString()}</em>`).replace('{b}', `<em>${use.toLocaleString()}</em>`);
  const nowc = D.cur, usedc = use - nowc;
  // 外层：永久划分（能用 / 取不出来 / 已老化）；「能用」内部再分「现在还有 / 已用掉」
  $('#whBar').innerHTML =
    `<div class="whseg use" style="flex:${use} 1 0">
       <div class="whin now" style="flex:${nowc} 1 0"><b>${nowc.toLocaleString()}</b><s>${T('p.seg_now')}</s></div>
       <div class="whin used" style="flex:${Math.max(usedc,1)} 1 0"><b style="color:var(--t3)">${usedc.toLocaleString()}</b><s style="color:var(--t3)">${T('p.seg_used')}</s></div>
     </div>
     <div class="whseg un" style="flex:${un} 1 0"><b>${un.toLocaleString()}</b><s>${(un/tot*100).toFixed(1)}%</s></div>
     <div class="whseg age" style="flex:${Math.max(ag,60)} 1 0"><b>${ag.toLocaleString()}</b><s>${(ag/tot*100).toFixed(1)}%</s></div>`;
  $('#whLeg').innerHTML =
    `<div class="whcap" style="width:100%">
       <span style="flex:${use}">${T('p.seg_use')} ${use.toLocaleString()} mAh · ${(use/tot*100).toFixed(1)}%</span>
       <span style="flex:${un}">${T('p.seg_un')}</span>
       <span style="flex:${Math.max(ag,60)}">${T('p.seg_age')}</span>
     </div>`;
  $('#whCards').innerHTML = [
    ['var(--phos)', nowc, T('p.seg_now'), T('p.seg_now_d')],
    ['var(--phos)', use, T('p.seg_use'), T('p.seg_use_d')],
    ['var(--amber)', un, T('p.seg_un'), T('p.seg_un_d')],
    ['var(--red)', ag, T('p.seg_age'), T('p.seg_age_d').replace('{n}', D.cyc)],
  ].map(([c, v, t, d]) => `<div class="whc"><div class="n" style="color:${c}">${v.toLocaleString()}<span style="font-size:11px"> mAh</span></div>
      <div class="t2">${t}</div><div class="d">${d}</div></div>`).join('');
  // 推导来源（原容量链条的信息，压缩成一行）
  $('#whDeriv').innerHTML = T('p.derive')
    .replace('{d}', `<b>${tot.toLocaleString()}</b>`).replace('{q}', `<b>${Math.min(...D.qmax).toLocaleString()}</b>`)
    .replace('{f}', `<b>${use.toLocaleString()}</b>`).replace('{c}', `<b>${nowc.toLocaleString()}</b>`);

  const mid = Math.round(D.ra.slice(2, 9).reduce((a, b) => a + b) / 7);
  $('#scopeLegend').innerHTML = `<span><i style="background:var(--phos)"></i>${T('p.ra_legend')}</span>
     <span><i style="background:#5d6f6b;opacity:.6"></i>${T('p.ra_outlier')}</span>`;
  $('#scopeTake').innerHTML = T('p.ra_take').replace('{x}', `<span class="h">${(D.ra[14] / mid).toFixed(1)}×</span>`);

  $('#eq').innerHTML = [
    [D.deficitPC, 'mAh', T('p.per_cycle'), ''], ['×', '', '', 'o'],
    [D.cyc, '', T('p.cycles_done'), ''], ['=', '', '', 'o'],
    [D.deficit, 'mAh', T('p.total_locked'), 'hl'],
  ].map(([a, b, c, k]) => k === 'o' ? `<div class="eqo">${a}</div>`
    : `<div class="eqi ${k}"><b>${a}</b><s>${b}</s><i>${c}</i></div>`).join('');

  let n = 0, html = '';
  D.table.forEach(([gk, rows]) => {
    html += `<div class="grp">${T(gk)}</div>`;
    rows.forEach(r => { n++;
      const note = r.n ? T(r.n).replace(/"/g, '&quot;') : '';
      html += `<div class="r" title="${note}"><span class="k">${r.k}</span><span class="v">${r.v}</span>
        <span class="u">${r.u}</span><span class="m">${T(r.m)}</span>
        <span class="b b-${r.r}" title="${T('hw.rel.' + r.r).replace(/"/g, '&quot;')}">${{verified:'✓',conditional:'◐',questionable:'?',derived:'ƒ'}[r.r]}</span></div>`; });
  });
  $('#gkBody').innerHTML = html;
  $('#fieldCount').textContent = n + ' / ' + T('hw.field');
  $('#foot').innerHTML = `产品原型定稿 · 全部数值取自本机真实 IOKit 读数（AppleSmartBattery）<br>
    译文直接读取 app 的语言包 Localization/Languages/*.json —— 与 app 同一份，共 ${D.langs.length} 种语言<br>
    「变化趋势」为目标态示意，需长期记录才有真实数据；其余均为实测`;
}

ringSvg(); drawScope(); drawTrend(); drawDual(); render();
</script>
</body>
</html>
